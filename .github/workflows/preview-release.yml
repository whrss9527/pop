name: Preview Release

# 手动运行：构建一个本地签名（ad-hoc）的测试包，发布为 GitHub Pre-release，方便在自己的 Mac 上试用。
# 没有 Developer ID 签名和公证，也不带 iCloud / 自动更新。正式版请在本机用 scripts/release.sh 发布。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.0（会创建 v0.1.0 标签）"
        required: true
      overwrite:
        description: "版本已存在时覆盖：用原标签的代码重新构建，替换安装包并更新标题和说明"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preview-release:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      # 注意：shell 变量后面紧跟中文或全角符号时一定要写成 ${VAR}，否则 bash 可能把多字节字符的一部分当成变量名。
      - name: Check version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "版本号格式不对：${VERSION}（应该像 0.1.0）"
            exit 1
          fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "v$V 已经发布过了：换一个版本号，或者勾选 overwrite 覆盖"
              exit 1
            fi
            # 覆盖时仍然用原标签对应的代码构建，保证安装包和标签一致
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ref=v$V" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.check.outputs.ref }}
          fetch-depth: 0

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Pop.app (Release, universal, ad-hoc signed, without iCloud)
        run: |
          APP=$(scripts/build-preview.sh "$VERSION" build/preview | tail -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          grep -E "warning:" build/preview/build.log | grep -v -e SourcePackages -e appintentsmetadataprocessor | sort -u | head -50 || true

      - name: Launch smoke test
        run: scripts/launch-smoke.sh "$APP"

      - name: Verify and package
        run: |
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Format|flags|Signature"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/Pop")"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Contents/Info.plist"
          ditto -c -k --keepParent "$APP" "Pop-${VERSION}.zip"
          echo "SHA256=$(shasum -a 256 "Pop-${VERSION}.zip" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Pop __VERSION__ 测试版，用于在自己的 Mac 上试用（需要 macOS 15 或更新版本，Apple 芯片和 Intel 通用）。

          > 这是 CI 自动构建的测试包：只做了本地签名，没有 Developer ID 签名和苹果公证，也没有启用 iCloud 同步和自动更新（这两项需要用你自己的开发者账号签名后才能启用，见 README）。

          ### 安装

          1. 下载下面的 `Pop-__VERSION__.zip`，解压后把 `Pop.app` 拖进「应用程序」文件夹。
          2. 因为没有经过公证，第一次打开会被系统拦截。在终端里执行下面这行解除拦截，然后正常打开：
             ```
             xattr -dr com.apple.quarantine /Applications/Pop.app
             ```
             也可以先双击一次，再到「系统设置 → 隐私与安全性」页面底部点「仍要打开」。
          3. 第一次打开会弹出 Pop 的设置窗口（这时程序坞里也会出现 Pop 的图标）。按「快速上手」的提示，到「系统设置 → 隐私与安全性 → 辅助功能」里打开 Pop，几秒内自动生效。
          4. 选中一段英文，**按住**鼠标右键约 0.25 秒再松开，就会弹出翻译；在空白处按住右键会弹出圆盘。普通点一下右键仍然是系统菜单。第一次翻译前，需要在「设置 → 翻译」里下载离线语言包。

          ### 注意

          - Pop 平时只在菜单栏显示 ◎ 图标。图标被刘海挡住、或者在 macOS 26 的「系统设置 → 菜单栏」里被隐藏时，再次打开 Pop 应用就会弹出设置窗口。
          - 每个测试包的签名都不一样。换新版本后如果按住右键没反应，到「辅助功能」列表里把旧的 Pop 删掉（选中后点「−」），再重新添加授权。
          - 设置里的「iCloud 同步」和「检查更新」在测试包里会显示为不可用，这是正常的。

          SHA-256：`__SHA256__`
          EOF
          perl -pi -e "s/__VERSION__/${VERSION}/g; s/__SHA256__/${SHA256}/g" notes.md
          TITLE="Pop ${VERSION}（测试版）"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            gh release upload "v${VERSION}" "Pop-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md --prerelease
          else
            gh release create "v${VERSION}" "Pop-${VERSION}.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$TITLE" \
              --notes-file notes.md \
              --prerelease
          fi
