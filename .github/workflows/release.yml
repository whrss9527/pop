name: Release

# 构建 Pop.app（Apple 芯片 / Intel 通用），发布到 GitHub Releases，附带 SHA256SUMS.txt，
# 发布说明取 CHANGELOG.md 里这个版本的那一节。插件包（plugin-<ID>.zip）和插件包列表（plugins-<版本号>.json）
# 也传到这个版本的发布页上：插件包只能和同一次构建的 Pop 一起用，装插件时从这里下载。
# 已安装的 Pop 从这里检查更新：下载 zip、比对 SHA256SUMS.txt 里的校验和、检查代码签名，再替换并重新启动。
#
# 两种触发方式：
#   - 自动：main 的已验证改动发布测试版；提升 CHANGELOG 顶部章节后，每个上海工作日最多发布一次稳定版。
#   - 手动：在 Actions 页面运行，填版本号，可以选择发成测试版（预发布）。
# Release 先建成草稿，附件都传完才公开，已安装的 Pop 不会看到一个没有安装包的新版本。
#
# 公开的正式版、测试版与签名 dry-run 都需要 Developer ID Application 和完整公证凭据。
# MACOS_CERTIFICATE_P12 + MACOS_CERTIFICATE_PASSWORD、NOTARY_* 配在仓库 Secrets 里，
# 见 docs/development.zh-CN.md「签名与公证」。缺项或最终安装包验收失败会停止，不创建发行标签。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.3.0（会创建 v0.3.0 标签）"
        required: true
      prerelease:
        description: "作为测试版（预发布）发布"
        type: boolean
        default: false
      overwrite:
        description: "版本已存在时覆盖：用原标签的代码重新构建，替换附件并更新标题和说明"
        type: boolean
        default: false
      dry_run:
        description: "构建、签名、公证并验收最终安装包，只保存 artifact，不创建标签或 Release"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "版本号，例如 0.4.0"
        required: true
        type: string
      ref:
        description: "在哪个提交上发布"
        required: true
        type: string
      prerelease:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    # 同一时间只发一个版本（手动发布和合并后的自动发布可能撞在一起）
    concurrency:
      group: release-${{ inputs.prerelease && inputs.version || 'stable' }}
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      OVERWRITE: ${{ inputs.overwrite || false }}
      PRERELEASE: ${{ inputs.prerelease }}
      TARGET_REF: ${{ inputs.ref }}
    steps:
      # 使用当前工作流的规则，覆盖旧标签时也不会丢失发布检查。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
      - name: Keep release policy helpers
        run: cp scripts/release-plan.py scripts/release-notes.py scripts/check-public-signing.sh scripts/notarize.sh "$RUNNER_TEMP/"

      # 注意：shell 变量后面紧跟中文或全角符号时一定要写成 ${VAR}，否则 bash 可能把多字节字符的一部分当成变量名。
      - name: Check version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "版本号格式不对：${VERSION}（应该像 0.3.0）"
            exit 1
          fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "v$V 已经发布过了：换一个版本号，或者勾选 overwrite 覆盖"
              exit 1
            fi
            # 覆盖时仍然用原标签对应的代码构建，保证安装包和标签一致
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ref=v$V" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ref=${TARGET_REF:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.check.outputs.ref }}
          fetch-depth: 0

      - name: Check stable release cadence
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = "true" ] || [ "$OVERWRITE" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            python3 "$RUNNER_TEMP/release-plan.py" allowed --version "$VERSION" < "$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Select newest stable Xcode
        if: steps.policy.outputs.allowed == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.policy.outputs.allowed == 'true'
        run: brew install xcodegen

      - name: Import signing certificate
        if: steps.policy.outputs.allowed == 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          bash "$RUNNER_TEMP/check-public-signing.sh" credentials
          scripts/import-certificate.sh

      - name: Require Developer ID identity
        if: steps.policy.outputs.allowed == 'true'
        run: bash "$RUNNER_TEMP/check-public-signing.sh" identity

      - name: Build Pop.app (Release, universal)
        if: steps.policy.outputs.allowed == 'true'
        run: |
          APP=$(scripts/build-app.sh "$VERSION" build/release | tail -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          grep -E "warning:" build/release/build.log | grep -v -e SourcePackages -e appintentsmetadataprocessor | sort -u | head -50 || true
          codesign -dvv "$APP" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Timestamp)=|flags=" || true
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/Pop")"

      - name: Launch smoke test
        if: steps.policy.outputs.allowed == 'true'
        run: scripts/launch-smoke.sh "$APP"

      - name: Package
        if: steps.policy.outputs.allowed == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/Pop-${VERSION}.zip"
          # 插件包（Pop.app 旁边的 PopXxx.bundle）：每个打成 plugin-<ID>.zip，加上插件包列表 plugins-<版本号>.json，
          # Pop 装插件时从这个版本的发布页下载
          scripts/package-plugins.sh "$(dirname "$APP")" dist/plugins "$VERSION"

      - name: Notarize
        if: steps.policy.outputs.allowed == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          # 插件包放在一起公证（只公证，不钉票据）
          plugins=()
          [ -f dist/plugins/plugins-notary.zip ] && plugins=(dist/plugins/plugins-notary.zip)
          bash "$RUNNER_TEMP/notarize.sh" "dist/Pop-${VERSION}.zip" "${plugins[@]}"
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Verify final public installation archive
        id: distribution
        if: steps.policy.outputs.allowed == 'true'
        run: |
          bash "$RUNNER_TEMP/check-public-signing.sh" archive "dist/Pop-${VERSION}.zip"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Checksums
        if: steps.policy.outputs.allowed == 'true'
        run: |
          cd dist
          shasum -a 256 "Pop-${VERSION}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        if: steps.policy.outputs.allowed == 'true' && steps.distribution.outputs.verified == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 构建期间可能跨日；稳定版公开前再核对一次，发布并发组保证检查与公开串行。
          if [ "$PRERELEASE" != "true" ] && [ "$OVERWRITE" != "true" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            allowed=$(python3 "$RUNNER_TEMP/release-plan.py" allowed --version "$VERSION" < "$RUNNER_TEMP/releases.json")
            if [ "$allowed" != "allowed=true" ]; then
              echo "今天的稳定版额度已用完或不是工作日，下个工作日重新检查。"
              exit 0
            fi
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/previous-releases.json"
          previous=$(jq -sr '[.[][] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | last | .tag_name // empty' "$RUNNER_TEMP/previous-releases.json")
          python3 "$RUNNER_TEMP/release-notes.py" --version "$VERSION" --previous "$previous" --index "dist/plugins/plugins-${VERSION}.json" > changes.md

          SIGNATURE="已用 Developer ID 签名并通过苹果公证，下载解压后双击就能打开。"

          {
            echo "Pop ${VERSION}，需要 macOS 15 或更新版本，Apple 芯片和 Intel 通用。"
            echo
            cat changes.md
            echo
            echo "> ${SIGNATURE}"
            echo
            echo "### 安装"
            echo
            echo "1. 下载下面的 \`Pop-${VERSION}.zip\`，解压后把 \`Pop.app\` 拖进「应用程序」文件夹。"
            echo "2. 双击打开。"
            echo "3. 第一次打开会弹出 Pop 的设置窗口。按「快速上手」的提示，到「系统设置 → 隐私与安全性 → 辅助功能」里打开 Pop，几秒内自动生效。"
            echo "4. 选中一段英文，**按住**鼠标右键约 0.25 秒，就会弹出翻译；在空白处按住右键会弹出圆盘，不要松开，往要用的功能方向一划再松开即可（在圆心松开就关闭）。普通点一下右键仍然是系统菜单。"
            echo
            echo "已经装了 0.3.0 或更新版本的话，不用手动下载：Pop 会提醒有新版本，在「设置 → 更新」或菜单栏图标里点「立即更新」即可。"
            echo
            echo "### 常见问题"
            echo
            echo "- Pop 平时只在菜单栏显示 ◎ 图标。图标被刘海挡住、或者在 macOS 26 的「系统设置 → 菜单栏」里被隐藏时，再次打开 Pop 应用就会弹出设置窗口。"
            echo "- 按住右键没反应时，到「设置 → 通用」看看权限状态：列表里有 Pop 但不生效，点「清除旧的授权记录」再授权一次。"
            echo "- CI 构建的包不带 iCloud 同步（需要付费开发者账号签名，见 README）。"
            echo "- 截图识字第一次使用时，系统会请求「录屏与系统录音」权限；授权后如果截到的只有桌面背景，重新打开 Pop 即可。"
            echo
            echo "SHA-256：\`$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)\`"
          } > notes.md
          cat notes.md

          if [ "$PRERELEASE" = "true" ]; then
            TITLE="Pop ${VERSION}（测试版）"
            FLAG="--prerelease"
          else
            TITLE="Pop ${VERSION}"
            FLAG="--latest"
          fi
          # 插件包和插件包列表也传上去（列表里有每个插件包的校验和）
          assets=("dist/Pop-${VERSION}.zip" dist/SHA256SUMS.txt)
          for file in dist/plugins/plugin-*.zip "dist/plugins/plugins-${VERSION}.json"; do
            [ -f "$file" ] && assets+=("$file")
          done
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            gh release upload "v${VERSION}" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            # 先建草稿、传附件，都好了再公开：已安装的 Pop 不会看到一个没有安装包的新版本
            gh release create "v${VERSION}" --draft \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$TITLE" \
              --notes-file notes.md
            gh release upload "v${VERSION}" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
            gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false "$FLAG"
          fi
          echo "已发布到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"

      - name: Save verified signing dry-run
        if: steps.distribution.outputs.verified == 'true' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: pop-signed-dry-run-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize signing dry-run
        if: always() && inputs.dry_run
        run: |
          if [ "${{ steps.distribution.outputs.verified }}" = "true" ]; then
            echo "签名 dry-run 已验收最终安装包；只保存 artifact，没有创建标签或 Release。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "发布额度不足或签名验收未完成；本次不是签名验收通过。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Delete temporary keychain
        if: always() && env.CODESIGN_KEYCHAIN != ''
        run: security delete-keychain "$CODESIGN_KEYCHAIN" || true
