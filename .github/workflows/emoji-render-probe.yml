name: Emoji rendering measurements
on:
  workflow_dispatch:
    inputs:
      workload:
        type: choice
        options: [isolated, full-prefix, observer]
        default: isolated
      cycles:
        description: "Fixed1–3 cycles (observer1); empty uses isolated3/others1"
        default: ""
  push:
    branches: [codex/emoji-render-probe]
    paths:
      - .github/workflows/emoji-render-probe.yml
      - scripts/emoji-render-probe.py
      - Pop/UI/OverlayRenderProbe.swift
      - Pop/UI/Glass.swift
      - Pop/UI/Overlay.swift
      - Pop/App/OverlayDemo.swift
permissions:
  contents: read
concurrency:
  group: emoji-render-probe-${{ github.sha }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build one app for every condition
        run: |
          set -e
          APP=$(scripts/build-app.sh 0.0.0-render-probe build/render-probe | tail -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Match normal screenshot accessibility preferences
        run: |
          set -e
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults read com.apple.universalaccess reduceMotion
          defaults read com.apple.universalaccess reduceTransparency
      - name: Measure without changing normal CI gates
        env:
          WORKLOAD: ${{ inputs.workload || 'isolated' }}
          CYCLES: ${{ inputs.cycles }}
        run: |
          args=(--workload "$WORKLOAD")
          if [[ -n "$CYCLES" ]]; then args+=(--cycles "$CYCLES"); fi
          if [[ "$WORKLOAD" == observer ]]; then
            args=()
            if [[ -n "$CYCLES" ]]; then args+=(--cycles "$CYCLES"); fi
            python3 scripts/emoji-observer-probe.py "$APP" build/render-measurements "${args[@]}"
          else
            python3 scripts/emoji-render-probe.py "$APP" build/render-measurements "${args[@]}"
          fi
      - name: Preserve raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emoji-render-measurements
          path: build/render-measurements/
          if-no-files-found: error
