name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select newest stable Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Pop.xcodeproj \
            -scheme Pop \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          echo "Swift files compiled: $(grep -cE '^SwiftCompile normal' build.log)"
          echo "::group::Diagnostics (errors / warnings in our sources)"
          grep -E "(error|warning):" build.log | grep -v "/SourcePackages/" | grep -v appintentsmetadataprocessor | sort -u | head -300
          echo "::endgroup::"
          echo "---- tail of build.log ----"
          tail -80 build.log
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
