name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 最低支持的 Xcode 16 和 runner 上最新的稳定版各跑一遍
        xcode: ["16.4", "latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          if [ "${{ matrix.xcode }}" = "latest" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          else
            XCODE="/Applications/Xcode_${{ matrix.xcode }}.app"
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Pop.xcodeproj \
            -scheme Pop \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          echo "Swift files compiled: $(grep -cE '^SwiftCompile normal' build.log)"
          echo "::group::Diagnostics (errors / warnings in our sources)"
          grep -E "(error|warning):" build.log | grep -v "/SourcePackages/" | grep -v appintentsmetadataprocessor | sort -u | head -300
          echo "::endgroup::"
          echo "---- tail of build.log ----"
          tail -80 build.log
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-xcode-${{ matrix.xcode }}
          path: build.log
          if-no-files-found: ignore

  # 单元测试不会执行 App 启动流程（测试宿主会跳过初始化），这里真正启动一次 Release 包。
  launch-smoke:
    name: launch-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Release app
        run: |
          APP=$(scripts/build-preview.sh 0.0.0-ci build/preview | tail -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Launch smoke test
        run: scripts/launch-smoke.sh "$APP"

