name: CI

# 每次推送（任何分支）：编译、单元测试、启动测试、一键更新的端到端测试，并给浮窗截图。
# main 的已验证改动发布测试版；正式版须先提升未发布章节，每个上海工作日最多一次。
# 不用 pull_request 触发：合并请求显示的就是它分支上这次推送的结果；两个都开的话同一个提交要跑两遍，
# macOS runner 排队的时间也翻倍。
on:
  push:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # main 上的运行可能正在发布新版本，不能被下一次推送取消
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: build-and-test (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 最低支持的 Xcode 16 和 runner 上最新的稳定版各跑一遍
        xcode: ["16.4", "latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          if [ "${{ matrix.xcode }}" = "latest" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          else
            XCODE="/Applications/Xcode_${{ matrix.xcode }}.app"
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project Pop.xcodeproj \
            -scheme Pop \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          echo "Swift files compiled: $(grep -cE '^SwiftCompile normal' build.log)"
          echo "::group::Diagnostics (errors / warnings in our sources)"
          grep -E "(error|warning):" build.log | grep -v "/SourcePackages/" | grep -v appintentsmetadataprocessor | sort -u | head -300
          echo "::endgroup::"
          echo "---- tail of build.log ----"
          tail -80 build.log
          exit $status

      # 编译时抽出来的界面文字（.stringsdata）和 en.lproj 对一遍：带中文的每一条都要有英文翻译，
      # 两种语言的 key 和占位符一致。缺的 key 会按 .strings 的格式列在日志里
      - name: Check release planning
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'

      - name: Check translations
        if: always()
        run: python3 scripts/check-localization.py --stringsdata ~/Library/Developer/Xcode/DerivedData --list-missing

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-xcode-${{ matrix.xcode }}
          path: build.log
          if-no-files-found: ignore

  # 单元测试不会执行 App 启动流程（测试宿主会跳过初始化），这里真正启动一次 Release 包，
  # 再用假的发布走一遍一键更新。
  launch-smoke:
    name: launch-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS 15 上编通用版要 10～14 分钟，截图要 13 分钟左右，30 分钟已经不够用
    timeout-minutes: 45
    # 截图推到 ci-screenshots/<系统> 分支上
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Release app
        run: |
          APP=$(scripts/build-app.sh 0.0.0-ci build/ci | tail -n 1)
          echo "APP=$APP" >> "$GITHUB_ENV"

      # 演示模式下把圆盘、结果卡片、提示、列表依次展示一遍（动画放慢 6 倍），按时截图，
      # 看玻璃效果和动画的中间帧；同时也确认这些浮窗在真实的 macOS 上能正常显示。
      # 放在启动测试前面：启动测试会弹出辅助功能的授权提示框，挡在截图里
      - name: Overlay screenshots
        run: scripts/overlay-screenshots.sh "$APP" build/screenshots 6

      - name: Launch smoke test
        run: scripts/launch-smoke.sh "$APP"

      # 截图放到单独的 ci-screenshots/<系统> 分支（只有这一次的截图，每次覆盖），git 拉下来就能看
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          OS_NAME: ${{ matrix.os }}
        run: |
          dir="$PWD/build/screenshots"
          if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "没有截图"
            exit 0
          fi
          branch="ci-screenshots/${OS_NAME}"
          work="$RUNNER_TEMP/screenshots-branch"
          rm -rf "$work" && mkdir -p "$work"
          cp "$dir"/*.jpg "$work"/
          cd "$work"
          printf 'CI 截图：%s 在 %s 上，%s\n' "$GITHUB_SHA" "$OS_NAME" "$(sw_vers -productVersion)" > README.md
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${GITHUB_SHA::7} on ${OS_NAME}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          echo "已推到 ${branch}"

      # 用本地 HTTP 服务器假装发布了 9.9.9，走一遍检查、下载、校验、替换、重新启动（本地签名的包）
      - name: End-to-end update test
        run: |
          rm -rf build/e2e-adhoc && mkdir -p build/e2e-adhoc
          ditto "$APP" build/e2e-adhoc/Pop.app
          scripts/update-e2e.sh build/e2e-adhoc/Pop.app

      # 发布时可以用证书签名：这里造一张临时的自签名证书，把生成、导入钥匙串、签名、启动、
      # 以及「只接受同一个证书签名的更新」都走一遍
      - name: Signing self-test (temporary self-signed certificate)
        run: |
          work="$RUNNER_TEMP/signing-selftest"
          rm -rf "$work" && mkdir -p "$work"
          POP_SIGNING_DIR="$work/cert" scripts/create-signing-certificate.sh "Pop CI Test" > /dev/null
          : > "$work/env"
          CERTIFICATE_P12_BASE64="$(cat "$work/cert/certificate.p12.base64")" \
            CERTIFICATE_PASSWORD="$(cat "$work/cert/password.txt")" \
            GITHUB_ENV="$work/env" scripts/import-certificate.sh
          identity=$(awk -F= '/^CODESIGN_IDENTITY=/{print $2}' "$work/env")
          keychain=$(awk -F= '/^CODESIGN_KEYCHAIN=/{print $2}' "$work/env")
          [ -n "$identity" ] && [ -n "$keychain" ] || { echo "导入脚本没有给出签名身份和钥匙串"; exit 1; }
          export CODESIGN_IDENTITY="$identity" CODESIGN_KEYCHAIN="$keychain"

          rm -rf build/e2e-signed && mkdir -p build/e2e-signed
          ditto "$APP" build/e2e-signed/Pop.app
          scripts/sign-app.sh build/e2e-signed/Pop.app
          info=$(codesign -dvv build/e2e-signed/Pop.app 2>&1)
          echo "$info" | grep -E "^(Authority|Timestamp)=|flags=" || true
          echo "$info" | grep -q "Authority=Pop CI Test" || { echo "$info"; echo "没有用证书签名"; exit 1; }
          echo "$info" | grep -q "flags=.*runtime" || { echo "$info"; echo "没有开 Hardened Runtime"; exit 1; }
          codesign -d --entitlements - --xml build/e2e-signed/Pop.app 2>/dev/null | grep -q "allow-jit" \
            || { echo "签名里没有 allow-jit"; exit 1; }

          scripts/launch-smoke.sh build/e2e-signed/Pop.app
          scripts/update-e2e.sh build/e2e-signed/Pop.app
          security delete-keychain "$keychain"

  plan-release:
    name: 看要不要发版
    needs: [build-and-test, launch-smoke]
    # 推到 main 并且测试都通过了
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      beta: ${{ steps.plan.outputs.beta }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: 计算稳定版和测试版
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/release-plan.py plan --event "$GITHUB_EVENT_NAME" --run-number "$GITHUB_RUN_NUMBER" < "$RUNNER_TEMP/releases.json" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: 发布新版本
    needs: plan-release
    if: needs.plan-release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan-release.outputs.version }}
      ref: ${{ needs.plan-release.outputs.sha }}
      prerelease: false
    secrets: inherit

  release-beta:
    name: 发布测试版
    needs: plan-release
    if: needs.plan-release.outputs.beta != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan-release.outputs.beta }}
      ref: ${{ needs.plan-release.outputs.sha }}
      prerelease: true
    secrets: inherit
