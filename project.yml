  PopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PopTests
      # 插件包的代码也编进单元测试，直接测
      - path: PluginBundles/ScreenPen
      - path: PluginBundles/CameraBubble
      - path: PluginBundles/PointerHighlight
      - path: PluginBundles/Teleprompter
      - path: PluginBundles/WindowLayout
      - path: PluginBundles/MenuShortcuts
      - path: PluginBundles/BatchRename
      - path: PluginBundles/FolderTools
      - path: PluginBundles/FileCompare
      - path: PluginBundles/CodeStats
      - path: PluginBundles/Reminder
      - path: PluginBundles/NumberStats
      - path: PluginBundles/TableOCR
      - path: PluginBundles/Palette
      - path: PluginBundles/Watermark
      - path: PluginBundles/RegexTester
      - path: PluginBundles/JSONTypes
      - path: PluginBundles/Cron
      - path: PluginBundles/CodeImage
      - path: PluginBundles/SpellCheck
      - path: PluginBundles/LargeType
      - path: PluginBundles/ScreenRuler
      - path: PluginBundles/KeyboardCleaner
