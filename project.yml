name: Pop

options:
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.44.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    # 这次构建的标识，写进 Pop 和插件包的 Info.plist：插件包只装载到同一次构建出来的 Pop 里。
    # scripts/build-app.sh 换成「版本号+提交」，在 Xcode 里直接运行时是 dev
    POP_BUILD_ID: dev

targetTemplates:
  # 插件包：单独编译成 .bundle，装上以后由 Pop 装载（见 Pop/Plugins/PluginBundles.swift）。
  # 插件包直接用 Pop 里的类型（@testable import Pop），链接时从 Pop 的可执行文件里找；Info.plist 共用 PluginBundles/Info.plist
  PopPlugin:
    type: bundle
    platform: macOS
    dependencies:
      - target: Pop
        link: false
        embed: false
    settings:
      base:
        INFOPLIST_FILE: PluginBundles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        BUNDLE_LOADER: $(BUILT_PRODUCTS_DIR)/Pop.app/Contents/MacOS/Pop
        SWIFT_INCLUDE_PATHS: $(BUILT_PRODUCTS_DIR)
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES

targets:
  Pop:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Pop.xcconfig
      Release: Config/Pop.xcconfig
    sources:
      - path: Pop
      # 更新记录也打进 App：更新后告诉用户这一版新增了什么
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Pop/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 编译时把代码里的界面文字抽出来（.stringsdata），CI 用它检查每条中文都有英文翻译
        SWIFT_EMIT_LOC_STRINGS: YES
        # 插件包（PluginBundles/ 下面单独编译的 .bundle）直接用 Pop 里的类型（@testable import Pop），
        # 所以 Release 也要打开 testability，并且只去掉局部符号，留着插件包要找的全局符号
        ENABLE_TESTABILITY: YES
        STRIP_STYLE: non-global

  # 插件包，用下面的 PopPlugin 模板：target 名字是 Pop + 文件夹名，代码在 PluginBundles/<文件夹>。
  # POP_PLUGIN_ID 是插件包的 ID（和 Pop/Plugins/PluginCatalog.swift 里的一样），POP_PLUGIN_ENTRY 是入口类的名字
  PopScreenPen:
    templates: [PopPlugin]
    sources: [PluginBundles/ScreenPen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.plugin.screenPen
        POP_PLUGIN_ID: screenPen
        POP_PLUGIN_ENTRY: PopScreenPenEntry

  PopCameraBubble:
    templates: [PopPlugin]
    sources: [PluginBundles/CameraBubble]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.plugin.cameraBubble
        POP_PLUGIN_ID: cameraBubble
        POP_PLUGIN_ENTRY: PopCameraBubbleEntry

  PopPointerHighlight:
    templates: [PopPlugin]
    sources: [PluginBundles/PointerHighlight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.plugin.pointerHighlight
        POP_PLUGIN_ID: pointerHighlight
        POP_PLUGIN_ENTRY: PopPointerHighlightEntry

  PopTeleprompter:
    templates: [PopPlugin]
    sources: [PluginBundles/Teleprompter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.plugin.teleprompter
        POP_PLUGIN_ID: teleprompter
        POP_PLUGIN_ENTRY: PopTeleprompterEntry

  PopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PopTests
      # 插件包的代码也编进单元测试，直接测
      - path: PluginBundles/ScreenPen
      - path: PluginBundles/CameraBubble
      - path: PluginBundles/PointerHighlight
      - path: PluginBundles/Teleprompter
    dependencies:
      - target: Pop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pop:
    build:
      targets:
        Pop: all
        PopScreenPen: all
        PopCameraBubble: all
        PopPointerHighlight: all
        PopTeleprompter: all
        PopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # 单元测试检查的是中文的结果；CI 的 runner 是英文系统，这里固定用中文界面跑
      language: zh-Hans
      gatherCoverageData: false
      targets:
        - PopTests
    archive:
      config: Release
