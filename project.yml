name: Pop

options:
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.33.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES

targets:
  Pop:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Pop.xcconfig
      Release: Config/Pop.xcconfig
    sources:
      - path: Pop
      # 更新记录也打进 App：更新后告诉用户这一版新增了什么
      - path: CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Pop/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 编译时把代码里的界面文字抽出来（.stringsdata），CI 用它检查每条中文都有英文翻译
        SWIFT_EMIT_LOC_STRINGS: YES

  PopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PopTests
    dependencies:
      - target: Pop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pop:
    build:
      targets:
        Pop: all
        PopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # 单元测试检查的是中文的结果；CI 的 runner 是英文系统，这里固定用中文界面跑
      language: zh-Hans
      gatherCoverageData: false
      targets:
        - PopTests
    archive:
      config: Release
