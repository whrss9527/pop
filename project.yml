    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.whrss9527.pop.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pop:
    build:
      targets:
        Pop: all
        PopScreenPen: all
        PopCameraBubble: all
        PopPointerHighlight: all
        PopTeleprompter: all
        PopWindowLayout: all
        PopMenuShortcuts: all
        PopBatchRename: all
        PopFolderTools: all
        PopFileCompare: all
        PopCodeStats: all
        PopReminder: all
        PopNumberStats: all
        PopTableOCR: all
        PopPalette: all
        PopWatermark: all
        PopRegexTester: all
        PopJSONTypes: all
        PopCron: all
        PopCodeImage: all
        PopSpellCheck: all
        PopLargeType: all
        PopScreenRuler: all
        PopKeyboardCleaner: all
        PopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # 单元测试检查的是中文的结果；CI 的 runner 是英文系统，这里固定用中文界面跑
      language: zh-Hans
      gatherCoverageData: false
      targets:
        - PopTests
    archive:
      config: Release
