// 显示按键：按下带 ⌘、⌃ 的组合键和回车、方向键这些特殊键时，在桌面下方（录屏时在录的区域下边）显示出来；
// 连着按同一个组合显示「⌘Z ×3」，停一会儿淡出。普通打字（字母、数字、只带 ⇧ 或 ⌥ 的符号）不显示
let keycaps = null;
const SPECIAL_KEYS = { Enter: '↩', Tab: '⇥', ' ': '␣', Backspace: '⌫', Delete: '⌦', Escape: '⎋', ArrowLeft: '←', ArrowRight: '→', ArrowDown: '↓', ArrowUp: '↑', Home: '↖', End: '↘', PageUp: '⇞', PageDown: '⇟' };
const CODE_KEYS = { Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`' };

function keystrokeText(event) {
  const special = SPECIAL_KEYS[event.key] || (/^F([1-9]|1[0-2])$/.test(event.key) ? event.key : null);
  const command = event.metaKey, control = event.ctrlKey, option = event.altKey, shift = event.shiftKey;
  if (!special && !command && !control) return null;
  if (event.key === ' ' && !command && !control && !option) return null;
  // 按的是哪个键（不管 ⇧ 打出的是什么）：⇧⌘4 写成「⇧⌘4」不写成「⇧⌘$」
  const code = event.code || '';
  const key = special || (/^Key[A-Z]$/.test(code) ? code.slice(3) : /^(Digit|Numpad)[0-9]$/.test(code) ? code.slice(-1) : CODE_KEYS[code])
    || (event.key.length === 1 ? event.key.toUpperCase() : null);
  if (!key) return null;
  return (control ? '⌃' : '') + (option ? '⌥' : '') + (shift ? '⇧' : '') + (command ? '⌘' : '') + key;
}

// 开始显示；已经在显示的换到 area 下边（area 为空就是整个桌面）
function startKeycaps(area) {
  if (keycaps) { keycaps.move(area); return; }
  const el = h('div', { class: 'keycaps gone', 'aria-hidden': 'true' });
  stage.append(el);
  let last = null;
  let hideTimer = 0;
  const hide = () => { el.classList.add('gone'); last = null; };
  const place = () => {
    const a = keycaps.area || { x: 0, y: 0, w: stage.clientWidth, h: stage.clientHeight };
    el.style.left = `${a.x + a.w / 2}px`;
    el.style.top = `${a.y + a.h - el.offsetHeight - 22}px`;
  };
  keycaps = {
    area,
    key(event) {
      // 按住不放的重复只让它多显示一会儿
      if (event.repeat) {
        if (last) { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 1600); }
        return;
      }
      const text = keystrokeText(event);
      if (!text) return;
      const now = performance.now();
      last = last && last.text === text && now - last.time <= 1500 ? { text, count: last.count + 1, time: now } : { text, count: 1, time: now };
      el.textContent = last.count > 1 ? `${text} ×${last.count}` : text;
      el.classList.remove('gone');
      place();
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hide, 1600);
    },
    move(next) { keycaps.area = next; place(); },
    stop() { clearTimeout(hideTimer); el.remove(); keycaps = null; },
  };
}

function toggleKeystrokes(anchor) {
  if (keycaps) {
    keycaps.stop();
    showToast(lang === 'zh' ? '不再显示按键' : 'Stopped showing keystrokes', anchor);
    return;
  }
  startKeycaps(null);
  showToast(lang === 'zh' ? '开始显示按下的组合键，再用一次就关闭' : 'Showing the shortcuts you press; use it again to turn it off', anchor);
}

// 屏幕画笔：桌面上盖一层画布，上方一条工具栏。按住 ⇧ 画直线、正方形、正圆和 45° 的箭头；
// 可以让笔迹几秒后自动消失，也可以让鼠标穿过画布去点下面的东西。Esc 或再用一次结束
let pen = null;
const PEN_TOOLS = [
  ['pen', 'penScribble', { zh: '画笔', en: 'Pen' }, 'p'],
  ['highlighter', 'highlighter', { zh: '荧光笔', en: 'Highlighter' }, 'h'],
  ['arrow', 'arrowTool', { zh: '箭头', en: 'Arrow' }, 'a'],
  ['rectangle', 'rectTool', { zh: '方框', en: 'Rectangle' }, 'r'],
  ['ellipse', 'ellipseTool', { zh: '椭圆', en: 'Ellipse' }, 'o'],
];
const PEN_COLORS = ['#ee3833', '#ffd60a', '#33c759', '#007aff', '#ffffff'];
const PEN_FADE_DELAY = 2500;
const PEN_FADE = 600;

// 按住 ⇧ 时的终点：方框、椭圆取长的一边画成正的，箭头转到最近的 45° 方向
function penConstrain(start, point, tool) {
  const dx = point.x - start.x, dy = point.y - start.y;
  if (tool === 'rectangle' || tool === 'ellipse') {
    const side = Math.max(Math.abs(dx), Math.abs(dy));
    return { x: start.x + (dx < 0 ? -side : side), y: start.y + (dy < 0 ? -side : side) };
  }
  if (tool === 'arrow') {
    const length = Math.hypot(dx, dy), step = Math.PI / 4, angle = Math.round(Math.atan2(dy, dx) / step) * step;
    return { x: start.x + Math.cos(angle) * length, y: start.y + Math.sin(angle) * length };
  }
  return point;
}

function togglePen() {
  if (pen) { pen.stop(); return; }
  closeRing(false);
  dismissCard(false);
  const model = { tool: 'pen', color: 0, strokes: [], current: null, fades: false, through: false };
  const canvas = h('canvas', { class: 'pen-canvas' });
  const bar = h('div', { class: 'pen-bar', role: 'toolbar', 'aria-label': L(P.screenPen.name), onpointerdown: (event) => event.stopPropagation() });
  stage.append(canvas, bar);
  const ctx = canvas.getContext('2d');
  let frame = 0;
  const alphaOf = (stroke, now) => {
    if (!model.fades || stroke.done == null) return 1;
    const t = now - stroke.done - PEN_FADE_DELAY;
    return t <= 0 ? 1 : Math.max(0, 1 - t / PEN_FADE);
  };
  const meaningful = (stroke) => {
    const a = stroke.points[0], b = stroke.points[stroke.points.length - 1];
    if (stroke.tool === 'pen' || stroke.tool === 'highlighter') return stroke.points.length > 1;
    if (stroke.tool === 'arrow') return Math.hypot(b.x - a.x, b.y - a.y) >= 4;
    return Math.abs(b.x - a.x) >= 3 && Math.abs(b.y - a.y) >= 3;
  };
  function drawStroke(stroke, alpha) {
    const points = stroke.points, a = points[0], b = points[points.length - 1];
    const highlight = stroke.tool === 'highlighter';
    const width = highlight ? 22 : 5;
    ctx.save();
    ctx.globalAlpha = alpha * (highlight ? 0.4 : 1);
    ctx.strokeStyle = PEN_COLORS[stroke.color];
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (!highlight) { ctx.shadowColor = 'rgba(0, 0, 0, .35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1; }
    ctx.beginPath();
    if (stroke.tool === 'pen' || highlight) {
      ctx.moveTo(a.x, a.y);
      for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
    } else if (stroke.tool === 'rectangle') {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), hh = Math.abs(b.y - a.y);
      if (ctx.roundRect) ctx.roundRect(x, y, w, hh, width); else ctx.rect(x, y, w, hh);
    } else if (stroke.tool === 'ellipse') {
      ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, Math.PI * 2);
    } else {
      // 箭头：一条线加上终点处的两撇
      const angle = Math.atan2(b.y - a.y, b.x - a.x), head = Math.max(width * 4, 12);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      for (const offset of [Math.PI * 5 / 6, -Math.PI * 5 / 6]) {
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + Math.cos(angle + offset) * head, b.y + Math.sin(angle + offset) * head);
      }
    }
    ctx.stroke();
    ctx.restore();
  }
  function draw() {
    const ratio = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const now = performance.now();
    for (const stroke of model.strokes) drawStroke(stroke, alphaOf(stroke, now));
    if (model.current) drawStroke(model.current, 1);
  }
  const resize = () => {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(stage.clientWidth * ratio);
    canvas.height = Math.round(stage.clientHeight * ratio);
    draw();
  };
  // 自动消失：一直重画，淡没了的去掉
  function tick() {
    frame = 0;
    if (!model.fades || !model.strokes.length) return;
    const now = performance.now(), before = model.strokes.length;
    model.strokes = model.strokes.filter((stroke) => alphaOf(stroke, now) > 0);
    if (model.strokes.length !== before) render();
    draw();
    frame = requestAnimationFrame(tick);
  }
  const kick = () => { if (!frame && model.fades && model.strokes.length) frame = requestAnimationFrame(tick); };
  canvas.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    model.current = { tool: model.tool, color: model.color, points: [stagePoint(event)] };
  });
  canvas.addEventListener('pointermove', (event) => {
    const current = model.current;
    if (!current) return;
    const point = stagePoint(event), start = current.points[0];
    if (current.tool === 'pen' || current.tool === 'highlighter') {
      if (event.shiftKey) current.points = [start, point];
      else {
        const last = current.points[current.points.length - 1];
        if (Math.hypot(point.x - last.x, point.y - last.y) < 1.5) return;
        current.points.push(point);
      }
    } else current.points = [start, event.shiftKey ? penConstrain(start, point, current.tool) : point];
    draw();
  });
  canvas.addEventListener('pointerup', () => {
    const current = model.current;
    model.current = null;
    if (current && meaningful(current)) { current.done = performance.now(); model.strokes.push(current); render(); kick(); }
    draw();
  });
  canvas.addEventListener('pointercancel', () => { model.current = null; draw(); });
  const choose = (tool) => { model.tool = tool; model.through = false; render(); };
  const undo = () => { if (model.current) model.current = null; else model.strokes.pop(); render(); draw(); };
  const clear = () => { model.strokes = []; model.current = null; render(); draw(); };
  const tool = (iconName, title, pressed, onclick, disabled) => h('button', { type: 'button', class: 'tool', title, 'aria-label': title, 'aria-pressed': String(pressed), disabled, onclick }, icon(iconName));
  function render() {
    canvas.classList.toggle('through', model.through);
    const empty = !model.strokes.length;
    bar.replaceChildren(
      h('div', { class: 'grp' }, PEN_TOOLS.map(([id, iconName, title, key]) => tool(iconName, `${L(title)}${lang === 'zh' ? `（${key.toUpperCase()}）` : ` (${key.toUpperCase()})`}`, !model.through && model.tool === id, () => choose(id)))),
      h('div', { class: 'dots' }, PEN_COLORS.map((color, index) => h('button', { type: 'button', class: 'dot', style: `background:${color}`, title: L({ zh: `颜色（${index + 1}）`, en: `Color (${index + 1})` }), 'aria-pressed': String(model.color === index), onclick: () => { model.color = index; render(); } }))),
      h('span', { class: 'sep' }),
      h('div', { class: 'grp' },
        tool('pointer', L({ zh: '鼠标穿过去操作下面的窗口，画好的留着；再点一次接着画', en: 'Use the windows underneath with the mouse and keep the drawing; click again to go on drawing' }), model.through, () => { model.through = !model.through; render(); }),
        tool('timer', L({ zh: '笔迹几秒后自动消失', en: 'Fade strokes after a few seconds' }), model.fades, () => { model.fades = !model.fades; if (model.fades) { const now = performance.now(); for (const stroke of model.strokes) stroke.done = now; kick(); } render(); draw(); }),
        tool('undo', L({ zh: '撤销（⌘Z）', en: 'Undo (⌘Z)' }), false, undo, empty),
        tool('trash', L({ zh: '全部擦掉（⌫）', en: 'Erase everything (⌫)' }), false, clear, empty)),
      h('button', { type: 'button', class: 'done', title: L({ zh: '结束屏幕画笔（Esc）', en: 'Stop drawing (Esc)' }), onclick: () => stop() }, lang === 'zh' ? '完成' : 'Done'));
  }
  const observer = new ResizeObserver(resize);
  observer.observe(stage);
  function stop() {
    cancelAnimationFrame(frame);
    observer.disconnect();
    canvas.remove();
    bar.remove();
    pen = null;
  }
  pen = {
    stop,
    // 画的时候的快捷键：Esc 结束、⌘Z 撤销、⌫ 擦掉、P H A R O 换笔、1～5 换颜色
    key(event) {
      if (event.key === 'Escape') { stop(); return true; }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') { undo(); return true; }
      if (event.metaKey || event.ctrlKey || event.altKey) return false;
      if (event.key === 'Backspace' || event.key === 'Delete') { clear(); return true; }
      const found = PEN_TOOLS.find(([, , , key]) => key === event.key.toLowerCase());
      if (found) { choose(found[0]); return true; }
      const number = Number(event.key);
      if (Number.isInteger(number) && number >= 1 && number <= PEN_COLORS.length) { model.color = number - 1; render(); return true; }
      return false;
    },
  };
  render();
  resize();
}

// 计时器：选一个时长倒计时；番茄钟是专注 25 分钟、休息 5 分钟轮流来（每四个番茄休息 15 分钟），一直到结束
let countdown = null;
const TIMER_PRESETS = [1, 3, 5, 10, 15, 25, 45, 60];

function durationTitle(seconds) {
  const minutes = Math.round(seconds / 60);
  return minutes >= 60 && minutes % 60 === 0 ? L({ zh: `${minutes / 60} 小时`, en: `${minutes / 60} hr` }) : L({ zh: `${minutes} 分钟`, en: `${minutes} min` });
}

function clockText(seconds) {
  const h0 = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), r = seconds % 60;
  return h0 > 0 ? `${h0}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`;
}

const pomodoroLength = (step) => (step.phase === 'focus' ? 25 : step.round % 4 === 0 ? 15 : 5) * 60;

function startCountdown(seconds, pomodoro = null) {
  clearTimeout(countdown?.timer);
  countdown = { endsAt: Date.now() + seconds * 1000, duration: seconds, pomodoro, timer: setTimeout(finishCountdown, seconds * 1000) };
}

function finishCountdown() {
  const current = countdown;
  if (!current) return;
  if (current.pomodoro) {
    const step = current.pomodoro;
    const next = step.phase === 'focus' ? { phase: 'rest', round: step.round } : { phase: 'focus', round: step.round + 1 };
    showToast(step.phase === 'focus'
      ? L({ zh: `第 ${step.round} 个番茄完成，休息 ${durationTitle(pomodoroLength(next))}`, en: `Pomodoro ${step.round} done. Take a ${durationTitle(pomodoroLength(next))} break` })
      : L({ zh: `休息结束，开始第 ${step.round + 1} 个番茄`, en: `Break’s over. Starting pomodoro ${step.round + 1}` }));
    startCountdown(pomodoroLength(next), next);
    return;
  }
  countdown = null;
  showToast(L({ zh: `时间到：${durationTitle(current.duration)}的计时到了`, en: `Time’s up: Your ${durationTitle(current.duration)} timer is done` }));
}

function countdownStatus() {
  if (!countdown) return null;
  const left = clockText(Math.max(Math.ceil((countdown.endsAt - Date.now()) / 1000), 0));
  const end = new Date(countdown.endsAt);
  const until = `${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')}`;
  const step = countdown.pomodoro;
  if (step?.phase === 'focus') return L({ zh: `第 ${step.round} 个番茄，专注还剩 ${left}（到 ${until}）`, en: `Pomodoro ${step.round}: ${left} of focus left (until ${until})` });
  if (step) return L({ zh: `番茄钟休息还剩 ${left}（到 ${until}）`, en: `Pomodoro break: ${left} left (until ${until})` });
  return L({ zh: `计时还剩 ${left}（到 ${until}）`, en: `Timer: ${left} left (until ${until})` });
}

function showTimerCard(anchor) {
  const buttons = TIMER_PRESETS.map((minutes) => button(durationTitle(minutes * 60), () => {
    startCountdown(minutes * 60);
    showToast(L({ zh: `开始计时 ${durationTitle(minutes * 60)}`, en: `Timer started: ${durationTitle(minutes * 60)}` }), anchor);
  }));
  buttons.push(button(lang === 'zh' ? '番茄钟' : 'Pomodoro', () => {
    startCountdown(25 * 60, { phase: 'focus', round: 1 });
    showToast(L({ zh: '番茄钟开始：先专注 25 分钟', en: 'Pomodoro started: focus for 25 minutes' }), anchor);
  }));
  if (countdown) {
    buttons.push(button(countdown.pomodoro ? (lang === 'zh' ? '结束番茄钟' : 'End Pomodoro') : (lang === 'zh' ? '取消计时' : 'Cancel Timer'), () => {
      clearTimeout(countdown.timer);
      countdown = null;
      showToast(lang === 'zh' ? '已取消计时' : 'Timer canceled', anchor);
    }));
  }
  const intro = L({ zh: '选一个时长开始倒计时；到点时响一声、发一条通知。也可以选中「25 分钟」「1:30」这样的文字再用它。番茄钟是专注 25 分钟、休息 5 分钟轮流来（每四个番茄休息 15 分钟），一直到你结束。', en: 'Choose a duration to start a countdown. When time’s up, Pop plays a sound and sends a notification. You can also select text such as “25 min” or “1:30” and use the timer. The Pomodoro timer alternates 25 minutes of focus with a 5-minute break (15 minutes after every fourth) until you end it.' });
  presentCard(cardShell({ title: L(P.timer.name), children: [h('div', { class: 'body' }, countdownStatus() || intro)], buttons }), anchor);
}

// 白噪音：和 App 里一样的算法，用 Web Audio 在浏览器里实时生成（点了播放才出声）。关掉卡片也接着放，菜单栏的耳机图标能暂停、停止
const FOCUS_SOUNDS = [
  { id: 'white', icon: 'fsWhite', name: { zh: '白噪音', en: 'White Noise' }, detail: { zh: '各个频率一样响，最能盖住说话声和键盘声', en: 'Every frequency equally loud; the best at covering voices and typing' } },
  { id: 'pink', icon: 'fsPink', name: { zh: '粉红噪音', en: 'Pink Noise' }, detail: { zh: '低音多一些，比白噪音柔和', en: 'More bass and softer than white noise' } },
  { id: 'brown', icon: 'fsBrown', name: { zh: '棕色噪音', en: 'Brown Noise' }, detail: { zh: '低沉，像远处的瀑布、飞机舱里', en: 'Deep, like a distant waterfall or the inside of a plane' } },
  { id: 'rain', icon: 'fsRain', name: { zh: '雨声', en: 'Rain' }, detail: { zh: '细密的雨点打在窗上', en: 'Steady rain tapping on the window' } },
  { id: 'waves', icon: 'fsWaves', name: { zh: '海浪', en: 'Waves' }, detail: { zh: '海浪一阵一阵地涌上来又退下去', en: 'Waves rolling in and drawing back' } },
];
const FOCUS_TIMERS = [0, 15, 30, 60, 120];
const FOCUS = { sound: 'rain', volume: 50, timer: 0, state: 'stopped', endsAt: 0, pausedLeft: null, fade: 1, message: '', audio: null, ticker: 0, redraw: null };

// 生成一路声音，每次一个样本（-1…1）；左右两路的海浪周期和起点不一样
function focusVoice(sound, sampleRate, period, phase) {
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, brown = 0, low = 0, drop = 0, smooth = 0;
  const white = () => Math.random() * 2 - 1;
  const pink = () => {
    const n = white();
    b0 = 0.99886 * b0 + n * 0.0555179; b1 = 0.99332 * b1 + n * 0.0750759; b2 = 0.969 * b2 + n * 0.153852;
    b3 = 0.8665 * b3 + n * 0.3104856; b4 = 0.55 * b4 + n * 0.5329522; b5 = -0.7616 * b5 - n * 0.016898;
    const sum = b0 + b1 + b2 + b3 + b4 + b5 + b6 + n * 0.5362;
    b6 = n * 0.115926;
    return sum * 0.11;
  };
  const brownian = () => { brown = (brown + 0.02 * white()) / 1.02; return brown * 3.5; };
  const voices = {
    white: () => white() * 0.45,
    pink,
    brown: brownian,
    rain: () => {
      // 远处的雨是去掉低音的粉红噪音；近处的雨点每秒三十来个，几毫秒就衰减下去
      const n = pink();
      low += (n - low) * 0.055;
      if (Math.random() < 30 / sampleRate) drop = Math.min(drop + 0.2 + 0.6 * Math.random(), 1);
      drop *= 0.9965;
      const hiss = white();
      smooth += (hiss - smooth) * 0.35;
      return (n - low) * 1.4 + (hiss - smooth) * drop * 0.45;
    },
    waves: () => {
      phase += 1 / (period * sampleRate);
      if (phase >= 1) phase -= 1;
      const swell = 0.5 - 0.5 * Math.cos(2 * Math.PI * phase);
      const crest = swell * swell;
      return (brownian() * (0.25 + 0.75 * crest) + pink() * 0.45 * crest * crest) * 1.1;
    },
  };
  const next = voices[sound] || voices.white;
  return () => Math.max(-1, Math.min(1, next()));
}

// 第一次点播放时才建 AudioContext（浏览器要求用户点过才能出声）；换声音时先淡出再淡入
function focusAudio() {
  if (FOCUS.audio) return FOCUS.audio;
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return null;
  const ctx = new Context();
  if (!ctx.createScriptProcessor) { ctx.close?.(); return null; }
  const rate = ctx.sampleRate;
  const node = ctx.createScriptProcessor(4096, 1, 2);
  const output = ctx.createGain();
  output.gain.value = 0;
  let current = FOCUS.sound;
  let left = focusVoice(current, rate, 10, 27 / 97);
  let right = focusVoice(current, rate, 11, 64 / 97);
  let mix = 0;
  const step = 1 - Math.exp(-1 / (0.06 * rate));
  node.onaudioprocess = (event) => {
    const l = event.outputBuffer.getChannelData(0);
    const r = event.outputBuffer.getChannelData(1);
    for (let i = 0; i < l.length; i++) {
      const wanted = FOCUS.sound === current ? 1 : 0;
      mix += (wanted - mix) * step;
      if (FOCUS.sound !== current && mix < 0.0005) {
        current = FOCUS.sound;
        left = focusVoice(current, rate, 10, 27 / 97);
        right = focusVoice(current, rate, 11, 64 / 97);
      }
      l[i] = left() * mix;
      r[i] = right() * mix;
    }
  };
  node.connect(output);
  output.connect(ctx.destination);
  FOCUS.audio = { ctx, output, node, suspendTimer: 0 };
  return FOCUS.audio;
}

// 音量条是线性的，听起来的大小按平方
function focusApplyVolume() {
  const audio = FOCUS.audio;
  if (!audio) return;
  const target = FOCUS.state === 'playing' ? (FOCUS.volume / 100) ** 2 * FOCUS.fade : 0;
  audio.output.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.06);
}

function focusPlay(sound) {
  if (sound) FOCUS.sound = sound;
  const audio = focusAudio();
  if (!audio) {
    FOCUS.message = L({ zh: '放不出声音：这个浏览器不支持网页里生成声音', en: 'Can’t play sound: this browser can’t generate audio in a web page' });
    focusStop();
    return;
  }
  clearTimeout(audio.suspendTimer);
  audio.ctx.resume?.().catch(() => {});
  if (FOCUS.state === 'stopped') {
    FOCUS.endsAt = FOCUS.timer ? Date.now() + FOCUS.timer * 60000 : 0;
  } else if (FOCUS.state === 'paused') {
    FOCUS.endsAt = FOCUS.pausedLeft != null ? Date.now() + FOCUS.pausedLeft : 0;
  }
  FOCUS.pausedLeft = null;
  FOCUS.message = '';
  FOCUS.state = 'playing';
  focusApplyVolume();
  focusTick();
  if (!FOCUS.ticker) FOCUS.ticker = setInterval(focusTick, 1000);
  focusChanged();
}

// 暂停、停止：先淡出，过一会儿再把声音停掉，免得「啪」的一声
function focusSilence() {
  const audio = FOCUS.audio;
  if (!audio) return;
  focusApplyVolume();
  clearTimeout(audio.suspendTimer);
  audio.suspendTimer = setTimeout(() => { if (FOCUS.state !== 'playing') audio.ctx.suspend?.().catch(() => {}); }, 300);
}

function focusPause() {
  if (FOCUS.state !== 'playing') return;
  FOCUS.pausedLeft = FOCUS.endsAt ? Math.max(FOCUS.endsAt - Date.now(), 0) : null;
  FOCUS.endsAt = 0;
  FOCUS.state = 'paused';
  focusSilence();
  focusChanged();
}

function focusStop() {
  FOCUS.state = 'stopped';
  FOCUS.endsAt = 0;
  FOCUS.pausedLeft = null;
  FOCUS.fade = 1;
  clearInterval(FOCUS.ticker);
  FOCUS.ticker = 0;
  focusSilence();
  focusChanged();
}

function focusToggle() {
  if (FOCUS.state === 'playing') focusPause(); else focusPlay();
}

// 点了一种声音：正在放的就是它就暂停，不然换过去放
function focusSelect(sound) {
  if (sound === FOCUS.sound && FOCUS.state === 'playing') focusPause(); else focusPlay(sound);
}

// 改定时：在放或者暂停着的话从现在开始重新算
function focusSetTimer(minutes) {
  FOCUS.timer = FOCUS_TIMERS.includes(minutes) ? minutes : 0;
  if (FOCUS.state === 'stopped') return;
  const length = FOCUS.timer ? FOCUS.timer * 60000 : null;
  if (FOCUS.state === 'paused') FOCUS.pausedLeft = length;
  else FOCUS.endsAt = length ? Date.now() + length : 0;
  FOCUS.fade = 1;
  focusApplyVolume();
  focusChanged();
}

// 每秒一次：最后 5 秒慢慢变小声，到点就停
function focusTick() {
  if (FOCUS.state === 'playing' && FOCUS.endsAt) {
    const left = FOCUS.endsAt - Date.now();
    if (left <= 0) { focusStop(); return; }
    if (left < 5000) { FOCUS.fade = left / 5000; focusApplyVolume(); }
  }
  FOCUS.redraw?.();
}

function focusRemaining() {
  if (FOCUS.state === 'paused') return FOCUS.pausedLeft;
  if (FOCUS.state === 'playing' && FOCUS.endsAt) return Math.max(FOCUS.endsAt - Date.now(), 0);
  return null;
}

function focusRemainingText() {
  const left = focusRemaining();
  return left == null ? '' : L({ zh: `还剩 ${clockText(Math.ceil(left / 1000))}`, en: `${clockText(Math.ceil(left / 1000))} left` });
}

function focusTimerTitle(minutes) {
  return minutes ? durationTitle(minutes * 60) : L({ zh: '不限时', en: 'Off' });
}

function focusStatusText() {
  const name = L(FOCUS_SOUNDS.find((sound) => sound.id === FOCUS.sound).name);
  if (FOCUS.state === 'paused') return L({ zh: `${name} · 已暂停`, en: `${name} · Paused` });
  const playing = L({ zh: `正在放${name}`, en: `Playing ${name}` });
  const left = focusRemainingText();
  return left ? `${playing} · ${left}` : playing;
}

function focusChanged() {
  renderMenubar();
  FOCUS.redraw?.();
}

// 菜单栏里的耳机图标：点开能暂停、接着放、停止
let focusMenu = null;
function closeFocusMenu() {
  focusMenu?.remove();
  focusMenu = null;
  document.removeEventListener('pointerdown', focusMenuOutside, true);
  document.removeEventListener('keydown', focusMenuKey, true);
  $('#menubar .fs-status')?.setAttribute('aria-expanded', 'false');
}
function focusMenuOutside(event) {
  if (focusMenu && !focusMenu.contains(event.target) && !event.target.closest?.('.fs-status')) closeFocusMenu();
}
function focusMenuKey(event) {
  if (event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); closeFocusMenu(); }
}

function focusStatusItem() {
  if (FOCUS.state === 'stopped') { closeFocusMenu(); return null; }
  const title = focusStatusText();
  const name = L(P.focusSounds.name);
  return h('button', { type: 'button', class: 'fs-status' + (FOCUS.state === 'paused' ? ' paused' : ''), title, 'aria-label': L({ zh: `${name}：${title}`, en: `${name}: ${title}` }),
    'aria-haspopup': 'menu', 'aria-expanded': String(!!focusMenu),
    // 点耳机图标只开菜单，不在这里弹圆盘
    onpointerdown: (event) => event.stopPropagation(), onclick: (event) => {
      event.stopPropagation();
      if (focusMenu) { closeFocusMenu(); return; }
      const item = (label, action) => h('button', { type: 'button', role: 'menuitem', onclick: () => { closeFocusMenu(); action(); } }, label);
      focusMenu = h('div', { class: 'cam-menu fs-menu glass', role: 'menu', onpointerdown: (e) => e.stopPropagation() },
        h('div', { class: 'fs-menu-title' }, focusStatusText()), h('hr'),
        item(FOCUS.state === 'playing' ? (lang === 'zh' ? '暂停' : 'Pause') : (lang === 'zh' ? '接着放' : 'Resume'), focusToggle),
        item(lang === 'zh' ? '停止' : 'Stop', focusStop));
      stage.append(focusMenu);
      const box = stage.getBoundingClientRect();
      const r = event.currentTarget.getBoundingClientRect();
      Object.assign(focusMenu.style, { left: `${clamp(r.left - box.left, 4, stage.clientWidth - focusMenu.offsetWidth - 4)}px`, top: `${MENUBAR + 3}px` });
      event.currentTarget.setAttribute('aria-expanded', 'true');
      setTimeout(() => document.addEventListener('pointerdown', focusMenuOutside, true));
      document.addEventListener('keydown', focusMenuKey, true);
    } }, icon('focusSounds'));
}

function showFocusSounds(anchor) {
  const zh = lang === 'zh';
  const tiles = h('div', { class: 'fs-tiles', role: 'group', 'aria-label': zh ? '声音' : 'Sounds' });
  const detail = h('div', { class: 'fs-detail' });
  const error = h('div', { class: 'fs-error', role: 'status' });
  const volume = h('input', { type: 'range', min: '0', max: '100', value: String(FOCUS.volume), 'aria-label': zh ? '音量' : 'Volume', title: zh ? '音量' : 'Volume',
    oninput: () => { FOCUS.volume = Number(volume.value); focusApplyVolume(); } });
  const timer = h('select', { class: 'fe-select', onchange: () => focusSetTimer(Number(timer.value)) },
    FOCUS_TIMERS.map((minutes) => h('option', { value: String(minutes), selected: minutes === FOCUS.timer }, focusTimerTitle(minutes))));
  const left = h('span', { class: 'fs-left' });
  const stopButton = button(zh ? '停止' : 'Stop', () => focusStop());
  const playButton = button('', () => focusToggle(), { class: 'mbtn default' });
  const el = cardShell({ title: L(P.focusSounds.name), subtitle: ' ', width: 400, children: [
    tiles, detail,
    h('div', { class: 'fs-volume' }, icon('devSpeaker'), volume),
    error,
    h('div', { class: 'fs-hint' }, zh ? '关掉卡片也接着放，菜单栏的耳机图标可以暂停、停止' : 'Keeps playing after you close the card; pause or stop it from the headphones icon in the menu bar'),
    h('div', { class: 'fs-foot' }, h('label', null, zh ? '定时停止' : 'Sleep Timer', timer), left, h('span', { class: 'space' }), stopButton, playButton),
  ] });
  const sub = el.querySelector('.card-head .sub');
  function draw() {
    tiles.replaceChildren(...FOCUS_SOUNDS.map((sound) => {
      const on = sound.id === FOCUS.sound;
      return h('button', { type: 'button', class: 'fs-tile' + (on ? ' on' : '') + (on && FOCUS.state === 'playing' ? ' playing' : ''), 'aria-pressed': String(on), title: L(sound.detail),
        onclick: () => focusSelect(sound.id) }, icon(sound.icon), h('span', null, L(sound.name)));
    }));
    detail.textContent = L(FOCUS_SOUNDS.find((sound) => sound.id === FOCUS.sound).detail);
    error.textContent = FOCUS.message;
    error.hidden = !FOCUS.message;
    left.textContent = focusRemainingText();
    stopButton.hidden = FOCUS.state === 'stopped';
    playButton.textContent = FOCUS.state === 'playing' ? (zh ? '暂停' : 'Pause') : (zh ? '播放' : 'Play');
    if (sub) sub.textContent = FOCUS.state === 'playing' ? (zh ? '播放中' : 'Playing') : FOCUS.state === 'paused' ? (zh ? '已暂停' : 'Paused') : '';
  }
  FOCUS.redraw = draw;
  draw();
  presentCard(el, anchor, { onClosed: () => { if (FOCUS.redraw === draw) FOCUS.redraw = null; } });
}

// 提词器：选中的稿子在桌面上方慢慢往上滚，读的那一行在上三分之一处；空格暂停，↑↓ 调速度，← → 挪一点，R 从头开始，Esc 关掉
let prompter = null;

function showTeleprompter(text) {
  prompter?.stop();
  closeRing(false);
  dismissCard(false);
  const model = { speed: 40, font: 26, offset: 0, paused: false };
  const textEl = h('div', { class: 'tp-text' }, (text || '').trim());
  const view = h('div', { class: 'tp-view' }, textEl);
  const rate = h('span', { class: 'tp-rate' });
  const playButton = h('button', { type: 'button', onclick: () => togglePause() });
  const tool = (iconName, title, onclick) => h('button', { type: 'button', title, 'aria-label': title, onclick }, icon(iconName));
  const bar = h('div', { class: 'tp-bar' }, playButton,
    tool('restart', L({ zh: '从头开始（R）', en: 'Start over (R)' }), () => restart()),
    h('span', { class: 'sp' }),
    tool('slower', L({ zh: '慢一点（↓）', en: 'Slower (↓)' }), () => setSpeed(model.speed - 8)), rate,
    tool('faster', L({ zh: '快一点（↑）', en: 'Faster (↑)' }), () => setSpeed(model.speed + 8)),
    h('span', { class: 'sp' }),
    tool('smallerText', L({ zh: '字小一点（⌘-）', en: 'Smaller text (⌘-)' }), () => setFont(model.font - 4)),
    tool('largerText', L({ zh: '字大一点（⌘+）', en: 'Larger text (⌘+)' }), () => setFont(model.font + 4)),
    tool('xmark', L(T.close), () => stop()));
  const el = h('div', { class: 'teleprompter', role: 'dialog', 'aria-label': L(P.teleprompter.name) }, view, bar);
  stage.append(el);
  const maxOffset = () => Math.max(textEl.offsetHeight - view.clientHeight / 3, 0);
  const render = () => {
    textEl.style.fontSize = `${model.font}px`;
    textEl.style.paddingTop = `${view.clientHeight / 3}px`;
    textEl.style.transform = `translateY(${-model.offset}px)`;
    rate.textContent = L({ zh: `每分钟约 ${Math.round(model.speed * 60 / (model.font * 1.45))} 行`, en: `About ${Math.round(model.speed * 60 / (model.font * 1.45))} lines a minute` });
    playButton.replaceChildren(icon(model.paused ? 'play' : 'pause'));
    playButton.title = L({ zh: '暂停或继续（空格）', en: 'Pause or resume (Space)' });
  };
  const setSpeed = (value) => { model.speed = clamp(value, 10, 150); render(); };
  const setFont = (value) => { model.font = clamp(value, 18, 60); render(); model.offset = Math.min(model.offset, maxOffset()); render(); };
  const restart = () => { model.offset = 0; model.paused = false; render(); };
  const togglePause = () => { if (model.paused && model.offset >= maxOffset()) { restart(); return; } model.paused = !model.paused; render(); };
  let last = performance.now();
  let frame = requestAnimationFrame(function step(now) {
    const elapsed = Math.min((now - last) / 1000, 0.1);
    last = now;
    if (!model.paused) {
      model.offset = Math.min(model.offset + model.speed * elapsed, maxOffset());
      if (model.offset >= maxOffset()) model.paused = true;
      render();
    }
    frame = requestAnimationFrame(step);
  });
  // 拖动换位置，滚轮往回、往前挪
  let drag = null;
  el.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    if (event.target.closest('button')) return;
    drag = { id: event.pointerId, x: event.clientX - el.offsetLeft, y: event.clientY - el.offsetTop };
    el.setPointerCapture(event.pointerId);
  });
  el.addEventListener('pointermove', (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    el.style.left = `${clamp(event.clientX - drag.x, el.offsetWidth / 2, stage.clientWidth - el.offsetWidth / 2)}px`;
    el.style.top = `${clamp(event.clientY - drag.y, MENUBAR + 4, stage.clientHeight - el.offsetHeight - 4)}px`;
  });
  el.addEventListener('pointerup', () => { drag = null; });
  el.addEventListener('wheel', (event) => { event.preventDefault(); model.offset = clamp(model.offset + event.deltaY, 0, maxOffset()); render(); }, { passive: false });
  function stop() { cancelAnimationFrame(frame); el.remove(); prompter = null; }
  prompter = {
    stop,
    key(event) {
      if (event.metaKey && (event.key === '=' || event.key === '+')) { setFont(model.font + 4); return true; }
      if (event.metaKey && event.key === '-') { setFont(model.font - 4); return true; }
      if (event.metaKey || event.ctrlKey || event.altKey) return false;
      switch (event.key) {
        case 'Escape': stop(); return true;
        case ' ': togglePause(); return true;
        case 'ArrowUp': setSpeed(model.speed + 8); return true;
        case 'ArrowDown': setSpeed(model.speed - 8); return true;
        case 'ArrowLeft': model.offset = clamp(model.offset - model.font * 2, 0, maxOffset()); render(); return true;
        case 'ArrowRight': model.offset = clamp(model.offset + model.font * 2, 0, maxOffset()); render(); return true;
        case 'r': case 'R': restart(); return true;
        default: return false;
      }
    },
  };
  render();
}

// 摄像头小窗：桌面右下角一个圆形小窗。网页里能用摄像头时显示真的画面（像照镜子一样左右翻过来），
// 用不了时换成一张示例画面。拖动换位置，滚动或双击换大小，右键换形状、关闭；再用一次关闭
let camera = null;
const CAM_SIZES = [140, 200, 280];

function cameraPlaceholder() {
  const svg = s('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' });
  svg.innerHTML = '<defs><linearGradient id="cam-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7d9f2"/><stop offset="1" stop-color="#f0e1d4"/></linearGradient></defs>'
    + '<rect width="100" height="100" fill="url(#cam-bg)"/><ellipse cx="50" cy="104" rx="36" ry="30" fill="#29334d"/><rect x="44" y="60" width="12" height="16" fill="#edc7a8"/>'
    + '<ellipse cx="50" cy="44" rx="18" ry="22" fill="#1f1a17"/><ellipse cx="50" cy="48" rx="15" ry="19" fill="#f2cdb0"/>';
  return svg;
}

function toggleCameraBubble() {
  if (camera) { camera.stop(); return; }
  closeRing(false);
  dismissCard(false);
  const scale = Math.min(1, stage.clientWidth / 900);
  let size = CAM_SIZES[1] * scale;
  const el = h('div', { class: 'cam-bubble', role: 'img', 'aria-label': L(P.cameraBubble.name) });
  stage.append(el);
  const place = (x, y) => {
    const left = clamp(x, 6, stage.clientWidth - size - 6), top = clamp(y, MENUBAR + 6, stage.clientHeight - size - 6);
    Object.assign(el.style, { left: `${left}px`, top: `${top}px`, width: `${size}px`, height: `${size}px` });
  };
  place(stage.clientWidth - size - 24, stage.clientHeight - size - 24);
  let stream = null;
  let closed = false;
  const fallback = () => { if (!closed && !el.firstChild) el.append(cameraPlaceholder()); };
  // 摄像头：只在打开小窗时请求，关掉时停下
  if (navigator.mediaDevices?.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then((media) => {
      if (closed) { media.getTracks().forEach((track) => track.stop()); return; }
      stream = media;
      const video = h('video', { autoplay: true, playsinline: true, muted: true });
      video.srcObject = media;
      el.replaceChildren(video);
    }).catch(() => {
      fallback();
      showToast(lang === 'zh' ? '这里用不了摄像头，先用一张示例画面' : 'The camera isn’t available here, so this shows a sample picture', { x: el.offsetLeft + size / 2, y: el.offsetTop });
    });
  } else fallback();
  const resize = (next) => {
    const cx = el.offsetLeft + size / 2, cy = el.offsetTop + size / 2;
    size = clamp(next, 110 * scale, 420 * scale);
    place(cx - size / 2, cy - size / 2);
  };
  let drag = null;
  el.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    if (event.button !== 0) return;
    drag = { id: event.pointerId, dx: event.clientX - el.offsetLeft, dy: event.clientY - el.offsetTop };
    el.setPointerCapture(event.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (event) => { if (drag && event.pointerId === drag.id) place(event.clientX - drag.dx, event.clientY - drag.dy); });
  const endDrag = () => { drag = null; el.classList.remove('dragging'); };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
  el.addEventListener('dblclick', () => {
    const steps = CAM_SIZES.map((value) => value * scale);
    resize(steps.find((value) => value > size + 1) ?? steps[0]);
  });
  el.addEventListener('wheel', (event) => { event.preventDefault(); resize(size - event.deltaY * 0.5); }, { passive: false });
  let menu = null;
  const closeMenu = () => { menu?.remove(); menu = null; document.removeEventListener('pointerdown', outside, true); };
  // 点菜单外面只是收起菜单，不把这一下传给桌面
  const outside = (event) => { if (menu && !menu.contains(event.target)) { event.stopPropagation(); closeMenu(); } };
  el.addEventListener('contextmenu', (event) => {
    event.preventDefault();
    event.stopPropagation();
    closeMenu();
    const p = stagePoint(event);
    const item = (label, checked, action) => h('button', { type: 'button', role: 'menuitemcheckbox', 'aria-checked': String(checked), onclick: () => { closeMenu(); action(); } }, label);
    const square = el.classList.contains('square');
    menu = h('div', { class: 'cam-menu glass', role: 'menu', onpointerdown: (event) => event.stopPropagation() },
      [[{ zh: '小', en: 'Small' }, 0], [{ zh: '中', en: 'Medium' }, 1], [{ zh: '大', en: 'Large' }, 2]].map(([label, index]) => item(L(label), Math.abs(size - CAM_SIZES[index] * scale) < 1, () => resize(CAM_SIZES[index] * scale))),
      h('hr'),
      item(lang === 'zh' ? '圆形' : 'Circle', !square, () => el.classList.remove('square')),
      item(lang === 'zh' ? '圆角方形' : 'Rounded Square', square, () => el.classList.add('square')),
      h('hr'),
      item(lang === 'zh' ? '关闭摄像头小窗' : 'Close Camera Bubble', false, () => stop()));
    stage.append(menu);
    Object.assign(menu.style, { left: `${clamp(p.x, 4, stage.clientWidth - menu.offsetWidth - 4)}px`, top: `${clamp(p.y, MENUBAR + 4, stage.clientHeight - menu.offsetHeight - 4)}px` });
    setTimeout(() => document.addEventListener('pointerdown', outside, true));
  });
  function stop() {
    closed = true;
    closeMenu();
    stream?.getTracks().forEach((track) => track.stop());
    el.remove();
    camera = null;
  }
  camera = { stop };
}

// 突出显示指针：指针周围一圈黄色光圈，按下时泛起一圈波纹；指针离开桌面时藏起来
let halo = null;

function togglePointerHighlight(anchor) {
  if (halo) {
    halo.stop();
    showToast(lang === 'zh' ? '不再突出显示指针' : 'Stopped highlighting the pointer', anchor);
    return;
  }
  const el = h('div', { class: 'halo away', 'aria-hidden': 'true' });
  stage.append(el);
  const at = (event) => { const p = stagePoint(event); el.style.left = `${p.x}px`; el.style.top = `${p.y}px`; el.classList.remove('away'); return p; };
  const move = (event) => at(event);
  const press = (event) => {
    const p = at(event);
    el.classList.remove('press');
    void el.offsetWidth;
    el.classList.add('press');
    const wave = h('div', { class: 'halo-wave', style: `left:${p.x}px;top:${p.y}px` });
    stage.append(wave);
    setTimeout(() => wave.remove(), 500);
  };
  const leave = () => el.classList.add('away');
  stage.addEventListener('pointermove', move, true);
  stage.addEventListener('pointerdown', press, true);
  stage.addEventListener('pointerleave', leave);
  halo = {
    stop() {
      stage.removeEventListener('pointermove', move, true);
      stage.removeEventListener('pointerdown', press, true);
      stage.removeEventListener('pointerleave', leave);
      el.remove();
      halo = null;
    },
  };
  const start = anchor || defaultAnchor();
  el.style.left = `${start.x}px`;
  el.style.top = `${start.y}px`;
  el.classList.remove('away');
  showToast(lang === 'zh' ? '指针周围加上了光圈，再用一次就关闭' : 'The pointer now has a halo; use it again to turn it off', anchor);
}

// 聚光灯：桌面压暗，只亮着指针周围一圈，边缘柔和，跟着指针走；再用一次关闭
let spotlight = null;

function toggleSpotlight(anchor) {
  if (spotlight) {
    spotlight.stop();
    showToast(lang === 'zh' ? '关掉了聚光灯' : 'Spotlight off', anchor);
    return;
  }
  const el = h('div', { class: 'spotlight', 'aria-hidden': 'true' });
  stage.append(el);
  const at = (p) => { el.style.setProperty('--x', `${p.x}px`); el.style.setProperty('--y', `${p.y}px`); };
  // App 里是 150 点；演示的桌面小，按桌面宽度缩一点
  const size = () => el.style.setProperty('--r', `${Math.round(clamp(stage.clientWidth * 0.17, 90, 150))}px`);
  const move = (event) => at(stagePoint(event));
  stage.addEventListener('pointermove', move, true);
  stage.addEventListener('pointerdown', move, true);
  window.addEventListener('resize', size);
  size();
  at(anchor || defaultAnchor());
  spotlight = {
    stop() {
      stage.removeEventListener('pointermove', move, true);
      stage.removeEventListener('pointerdown', move, true);
      window.removeEventListener('resize', size);
      el.remove();
      spotlight = null;
    },
  };
  showToast(lang === 'zh' ? '打开了聚光灯，再用一次就关闭' : 'Spotlight on. Use it again to turn it off', anchor);
}

// 屏幕放大：拍下桌面放大到 2 倍，指针下面一直是放大前它下面的内容，挪到边上就看到边上。
// 滚轮、↑↓ 或 +− 调倍数（1.25～8 倍），0 回到 2 倍；点一下、Esc 或者再用一次回去。手机上拖动换地方看，点一下回去
let zoomer = null;

async function toggleZoom(anchor) {
  if (zoomer) { zoomer.stop(); return; }
  closeRing(false);
  dismissCard(false);
  dismissToast(false);
  const W = stage.clientWidth, H = stage.clientHeight;
  const shot = await captureStage({ x: 0, y: 0, w: W, h: H });
  if (zoomer) return;
  shot.className = 'zoom-shot';
  shot.style.width = `${W}px`;
  shot.style.height = `${H}px`;
  const el = h('div', { class: 'zoomer', 'aria-hidden': 'true' }, shot);
  stage.append(el);
  let scale = 1;
  let p = anchor || defaultAnchor();
  let touch = null;
  // 画面的左上角放在「指针 × (1 − 倍数)」
  const place = (duration) => {
    shot.style.transition = duration && !reduced() ? `transform ${duration}s ease-out` : 'none';
    const x = clamp(p.x, 0, W), y = clamp(p.y, 0, H);
    shot.style.transform = `translate(${x * (1 - scale)}px, ${y * (1 - scale)}px) scale(${scale})`;
  };
  const zoomBy = (factor) => { scale = clamp(scale * factor, 1.25, 8); place(0.12); };
  const stop = () => {
    if (!zoomer) return;
    zoomer = null;
    if (picker === handle) picker = null;
    scale = 1;
    place(0.18);
    setTimeout(() => el.remove(), reduced() ? 0 : 200);
  };
  el.addEventListener('pointermove', (event) => {
    if (touch && Math.hypot(event.clientX - touch.x, event.clientY - touch.y) > 6) touch.moved = true;
    p = stagePoint(event);
    place(0);
  });
  el.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    event.preventDefault();
    if (event.pointerType === 'mouse') { stop(); return; }
    touch = { x: event.clientX, y: event.clientY, moved: false };
    el.setPointerCapture(event.pointerId);
    p = stagePoint(event);
    place(0);
  });
  el.addEventListener('pointerup', () => { if (touch && !touch.moved) stop(); touch = null; });
  el.addEventListener('wheel', (event) => { event.preventDefault(); zoomBy(event.deltaY < 0 ? 1.25 : 1 / 1.25); }, { passive: false });
  const handle = {
    cancel: stop,
    key(event) {
      if (event.key === 'ArrowUp' || event.key === '+' || event.key === '=') { zoomBy(1.25); return true; }
      if (event.key === 'ArrowDown' || event.key === '-') { zoomBy(1 / 1.25); return true; }
      if (event.key === '0') { scale = 2; place(0.12); return true; }
      return false;
    },
  };
  picker = handle;
  zoomer = { stop };
  place(0);
  // 先按 1 倍盖上去，下一帧再放大，放大的过程才看得到
  requestAnimationFrame(() => requestAnimationFrame(() => { if (zoomer) { scale = 2; place(0.25); } }));
}

// 截图美化：截图放在渐变背景上，四周留白，可以加圆角和阴影、按比例补齐；背景和截图标注是同一套渐变
const BEAUTIFY = {
  backgrounds: [
    ['sky', { zh: '晴空', en: 'Sky' }, '#599eff', '#8c5cf5'],
    ['sunset', { zh: '晚霞', en: 'Sunset' }, '#ff9e59', '#f0548f'],
    ['mint', { zh: '薄荷', en: 'Mint' }, '#5cdba8', '#299ec7'],
    ['grape', { zh: '葡萄', en: 'Grape' }, '#c770f2', '#5c45d6'],
    ['graphite', { zh: '石墨', en: 'Graphite' }, '#545966', '#1f2129'],
    ['paper', { zh: '纸白', en: 'Paper' }, '#f5f5f7', '#dbdee6'],
    [null, { zh: '透明', en: 'Transparent' }],
  ],
  // 留白占截图长边的比例
  paddings: [['small', { zh: '小', en: 'Small' }, 0.05], ['medium', { zh: '中', en: 'Medium' }, 0.09], ['large', { zh: '大', en: 'Large' }, 0.14]],
  // 宽 ÷ 高；自动时按截图加上留白的样子
  ratios: [['auto', { zh: '自动', en: 'Auto' }, 0], ['square', '1:1', 1], ['fourThree', '4:3', 4 / 3], ['sixteenNine', '16:9', 16 / 9]],
  // 上次用的样子
  options: { background: 'sky', padding: 'medium', ratio: 'auto', corners: true, shadow: true },
};

function renderBeautified(source, o) {
  const iw = source.width, ih = source.height;
  const pad = Math.round(Math.max(iw, ih) * BEAUTIFY.paddings.find(([id]) => id === o.padding)[2]);
  let cw = iw + pad * 2, ch = ih + pad * 2;
  const ratio = BEAUTIFY.ratios.find(([id]) => id === o.ratio)[2];
  if (ratio) {
    if (cw / ch < ratio) cw = Math.round(ch * ratio);
    else ch = Math.round(cw / ratio);
  }
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  const background = BEAUTIFY.backgrounds.find(([id]) => id && id === o.background);
  if (background) {
    const gradient = ctx.createLinearGradient(0, 0, cw, ch);
    gradient.addColorStop(0, background[2]);
    gradient.addColorStop(1, background[3]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cw, ch);
  }
  const x = Math.round((cw - iw) / 2), y = Math.round((ch - ih) / 2);
  // 圆角按截图短边的 2.5%，至少 8 像素
  const radius = o.corners ? Math.max(8, Math.round(Math.min(iw, ih) * 0.025)) : 0;
  if (o.shadow) {
    // 先用同样的形状铺一层投出阴影，再把截图画在上面
    const blur = Math.max(iw, ih) * 0.03;
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, .38)'; ctx.shadowBlur = blur; ctx.shadowOffsetY = blur * 0.35;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(x, y, iw, ih, radius); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, iw, ih, radius); ctx.clip();
  ctx.drawImage(source, x, y);
  ctx.restore();
  return canvas;
}

// 缩小到长边不超过 maxSide（预览用，改选项时画得快）
function downscaledCanvas(source, maxSide) {
  const longest = Math.max(source.width, source.height);
  if (longest <= maxSide) return source;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(source.width * maxSide / longest);
  canvas.height = Math.round(source.height * maxSide / longest);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas;
}

function beautifySource(file) {
  return imageSourceFor(file);
}

// 图片文件在试玩里画成什么样：设置页的两版、聊天截图、海边的照片
function imageSourceFor(file) {
  if (file.key === 'logo') return renderLogo();
  if (file.key === 'design-old' || file.key === 'design-new') return renderSettingsShot(file.key === 'design-new');
  return file.icon === 'shot' ? renderChat(false, true).canvas : renderBeach(true);
}

function showBeautify(source, subtitle, anchor) {
  const o = BEAUTIFY.options;

  const swatches = BEAUTIFY.backgrounds.map(([id, label, from, to]) => h('button', { class: 'bt-swatch' + (id ? '' : ' clear'), type: 'button', title: L(label), 'aria-label': L(label),
    onclick: () => { o.background = id; draw(); } }, h('i', { style: id ? `background: linear-gradient(135deg, ${from}, ${to})` : null })));
  const segment = (list, key) => list.map(([id, label]) => h('button', { type: 'button', 'data-id': id, onclick: () => { o[key] = id; draw(); } }, L(label)));
  const paddings = segment(BEAUTIFY.paddings, 'padding');
  const ratios = segment(BEAUTIFY.ratios, 'ratio');
  const check = (key, label) => h('label', null, h('input', { type: 'checkbox', checked: o[key], onchange: (event) => { o[key] = event.target.checked; draw(); } }), L(label));
  function draw() {

  draw();

  const el = cardShell({ title: L(P.beautify.name), subtitle, width: 440, children: [
    preview,
    h('div', { class: 'bt-opts' },
      h('span', null, L({ zh: '背景', en: 'Background' })), h('div', { class: 'bt-swatches', role: 'group', 'aria-label': L({ zh: '背景', en: 'Background' }) }, swatches),
      h('span', null, L({ zh: '留白', en: 'Padding' })), h('div', { class: 'seg', role: 'group', 'aria-label': L({ zh: '留白', en: 'Padding' }) }, paddings),
      h('span', null, L({ zh: '比例', en: 'Ratio' })), h('div', { class: 'seg', role: 'group', 'aria-label': L({ zh: '比例', en: 'Ratio' }) }, ratios)),
    h('div', { class: 'bt-checks' }, check('corners', { zh: '圆角', en: 'Rounded corners' }), check('shadow', { zh: '阴影', en: 'Shadow' })),
  ], buttons: [
    button(lang === 'zh' ? '贴到屏幕' : 'Pin to Screen', () => pinToScreen({ image: full().toDataURL('image/png') }, anchor)),
    button(lang === 'zh' ? '存到「下载」' : 'Save to Downloads', () => showToast(lang === 'zh' ? '已存到「下载」' : 'Saved to Downloads', anchor)),
    button(lang === 'zh' ? '复制图片' : 'Copy Image', copy),
  ] });
  presentCard(el, anchor);
}

// 设置页的截图（480×300 点，按 2 倍画）；新的一版改了三处：标题旁多一个「新」、登录设备数、按钮颜色
function renderSettingsShot(changed) {

  ctx.fillStyle = '#eef0f5'; ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(40, 36, 400, 228, 14); ctx.fill();
  ctx.textBaseline = 'top';

  ctx.fillStyle = '#1c1c1e'; ctx.font = font(20, 600);

  }
  ctx.fillStyle = '#48484a'; ctx.font = font(13);
  ctx.fillText(zh ? '邮箱：pop@example.com' : 'Email: pop@example.com', 64, 102);
  ctx.fillText(zh ? '手机：138 0000 0000' : 'Phone: 138 0000 0000', 64, 128);
  ctx.fillText(zh ? `登录设备：${changed ? 4 : 3} 台` : `Signed-in devices: ${changed ? 4 : 3}`, 64, 154);
  ctx.fillStyle = changed ? '#34c759' : '#0a84ff';
  ctx.beginPath(); ctx.roundRect(300, 204, 116, 36, 8); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = font(14, 500); ctx.textAlign = 'center';
  ctx.fillText(zh ? '保存更改' : 'Save Changes', 358, 214);
  return canvas;
}

// 对比图片：和 App 里一样，先把两张图摆到同一块画布上，逐像素比，挨在一起的归成一处
const IMAGE_DIFF = {
  modes: [['sideBySide', { zh: '并排', en: 'Side by Side' }], ['swipe', { zh: '滑动', en: 'Swipe' }], ['overlay', { zh: '叠加', en: 'Overlay' }], ['difference', { zh: '差异', en: 'Difference' }]],
  // 按这么大的格子（像素）归成一处；「忽略细微差别」时一格里少于 speckle 个算杂点
  tile: 16, speckle: 4, highlight: [255, 45, 85],
  // 上次用的看法和设置
  mode: 'difference', subtle: false,
};

// 一样大直接比；宽高比一样、大小差得多的缩到小的那张；其他的按原大小左上角对齐
function prepareComparison(a, b) {
  const ra = a.width / a.height, rb = b.width / b.height;
  const sizeRatio = Math.max(a.width, b.width) / Math.min(a.width, b.width);
  let width, height, alignment, frameA, frameB;
  if (a.width === b.width && a.height === b.height) {
    alignment = 'same'; width = a.width; height = a.height;
    frameA = frameB = [0, 0, width, height];
  } else if (Math.abs(ra - rb) <= 0.01 * ra && sizeRatio >= 1.2) {
    const small = a.width * a.height <= b.width * b.height ? a : b;
    alignment = 'scaled'; width = small.width; height = small.height;
    frameA = frameB = [0, 0, width, height];
  } else {
    alignment = 'topLeft'; width = Math.max(a.width, b.width); height = Math.max(a.height, b.height);
    frameA = [0, 0, a.width, a.height]; frameB = [0, 0, b.width, b.height];
  }
  const place = (source, [x, y, w, hh]) => {
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(source, x, y, w, hh);
    return canvas;
  };
  return { width, height, alignment, first: place(a, frameA), second: place(b, frameB) };
}

function compareImagePixels(prepared, ignoringSubtle) {
  const { width, height } = prepared;
  const read = (canvas) => canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height).data;
  const a = read(prepared.first), b = read(prepared.second);
  const tolerance = ignoringSubtle ? 40 : 2;
  const tile = IMAGE_DIFF.tile;
  const columns = Math.ceil(width / tile), rows = Math.ceil(height / tile), cells = columns * rows;
  const mask = new Uint8Array(width * height);
  const counts = new Int32Array(cells);
  const minX = new Int32Array(cells).fill(2147483647), minY = new Int32Array(cells).fill(2147483647);
  const maxX = new Int32Array(cells).fill(-1), maxY = new Int32Array(cells).fill(-1);
  let changed = 0;
  for (let y = 0; y < height; y++) {
    const tileRow = Math.floor(y / tile) * columns;
    for (let x = 0; x < width; x++) {
      const p = y * width + x, i = p * 4;
      const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]), Math.abs(a[i + 3] - b[i + 3]));
      if (d <= tolerance) continue;
      mask[p] = 1;
      changed++;
      const c = tileRow + Math.floor(x / tile);
      counts[c]++;
      if (x < minX[c]) minX[c] = x;
      if (x > maxX[c]) maxX[c] = x;
      if (y < minY[c]) minY[c] = y;
      if (y > maxY[c]) maxY[c] = y;
    }
  }
  if (ignoringSubtle) {
    // 零星几个像素不一样的格子当作压缩带来的杂点
    for (let c = 0; c < cells; c++) {
      if (counts[c] === 0 || counts[c] >= IMAGE_DIFF.speckle) continue;
      for (let y = minY[c]; y <= maxY[c]; y++) for (let x = minX[c]; x <= maxX[c]; x++) mask[y * width + x] = 0;
      changed -= counts[c];
      counts[c] = 0;
    }
  }
  // 相邻（含斜着挨着）的格子归成一处
  let regions = [];
  const visited = new Uint8Array(cells);
  for (let start = 0; start < cells; start++) {
    if (!counts[start] || visited[start]) continue;
    visited[start] = 1;
    const stack = [start];
    let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1;
    while (stack.length) {
      const c = stack.pop();
      x0 = Math.min(x0, minX[c]); y0 = Math.min(y0, minY[c]); x1 = Math.max(x1, maxX[c]); y1 = Math.max(y1, maxY[c]);
      const cx = c % columns, cy = Math.floor(c / columns);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= columns || ny >= rows) continue;
        const n = ny * columns + nx;
        if (counts[n] && !visited[n]) { visited[n] = 1; stack.push(n); }
      }
    }
    regions.push([x0, y0, x1 - x0 + 1, y1 - y0 + 1]);
  }
  // 框重叠的合成一个
  const meets = (r, q) => r[0] < q[0] + q[2] && q[0] < r[0] + r[2] && r[1] < q[1] + q[3] && q[1] < r[1] + r[3];
  for (let merged = regions.length > 1 && regions.length <= 400; merged;) {
    merged = false;
    outer: for (let i = 0; i < regions.length; i++) for (let j = i + 1; j < regions.length; j++) {
      if (!meets(regions[i], regions[j])) continue;
      const [r, q] = [regions[i], regions[j]];
      const x = Math.min(r[0], q[0]), y = Math.min(r[1], q[1]);
      regions[i] = [x, y, Math.max(r[0] + r[2], q[0] + q[2]) - x, Math.max(r[1] + r[3], q[1] + q[3]) - y];
      regions.splice(j, 1);
      merged = true;
      break outer;
    }
  }
  regions = regions.sort((r, q) => r[1] - q[1] || r[0] - q[0]);
  return { width, height, changed, regions, mask };
}

// 差异图：第一张褪成浅灰当底，不一样的像素涂红，每处外面画个框
function differenceCanvas(prepared, result) {
  const { width, height } = prepared;
  const base = prepared.first.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height).data;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  const out = ctx.createImageData(width, height);
  const [hr, hg, hb] = IMAGE_DIFF.highlight;
  for (let p = 0; p < width * height; p++) {
    const i = p * 4;
    if (result.mask[p]) {
      out.data[i] = hr; out.data[i + 1] = hg; out.data[i + 2] = hb; out.data[i + 3] = 255;
      continue;
    }
    // 叠在白底上再算灰度，褪浅了红色才显眼
    const alpha = base[i + 3];
    const over = (c) => c * alpha / 255 + 255 - alpha;
    const gray = (over(base[i]) * 299 + over(base[i + 1]) * 587 + over(base[i + 2]) * 114) / 1000;
    const faded = Math.round(255 - (255 - Math.min(gray, 255)) * 0.35);
    out.data[i] = out.data[i + 1] = out.data[i + 2] = faded;
    out.data[i + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
  const line = Math.max(2, Math.round(Math.min(width, height) / 300));
  ctx.strokeStyle = `rgba(${hr}, ${hg}, ${hb}, .9)`;
  ctx.lineWidth = line;
  for (const [x, y, w, hh] of result.regions) ctx.strokeRect(x - line * 2, y - line * 2, w + line * 4, hh + line * 4);
  return canvas;
}

// 按当前的看法画一张（复制、存储、贴到屏幕用），和原图一样大
function composeComparison(prepared, mode, split, opacity, difference) {
  if (mode === 'difference') return difference;
  const { width, height } = prepared;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  if (mode === 'sideBySide') {
    const gap = Math.max(8, Math.floor(width / 40));
    canvas.width = width * 2 + gap; canvas.height = height;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, height);
    ctx.drawImage(prepared.first, 0, 0);
    ctx.drawImage(prepared.second, width + gap, 0);
    return canvas;
  }
  canvas.width = width; canvas.height = height;
  if (mode === 'swipe') {
    const edge = Math.round(width * split);
    ctx.drawImage(prepared.second, 0, 0);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, edge, height); ctx.clip(); ctx.drawImage(prepared.first, 0, 0); ctx.restore();
    const line = Math.max(2, Math.round(width / 400));
    ctx.fillStyle = 'rgba(0, 0, 0, .35)'; ctx.fillRect(edge - line / 2 - 1, 0, line + 2, height);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(edge - line / 2, 0, line, height);
  } else {
    ctx.drawImage(prepared.first, 0, 0);
    ctx.globalAlpha = opacity;
    ctx.drawImage(prepared.second, 0, 0);
    ctx.globalAlpha = 1;
  }
  return canvas;
}

function diffPercent(fraction) {
  if (fraction > 0 && fraction < 0.0001) return '<0.01%';
  const value = fraction * 100;
  return value.toFixed(value >= 10 ? 0 : value >= 1 ? 1 : 2) + '%';
}

function diffDetails(prepared, result) {
  const zh = lang === 'zh';
  const parts = [];
  if (!result.changed) parts.push(zh ? '没有找到不一样的地方' : 'No differences found');
  else {
    const n = result.regions.length, pct = diffPercent(result.changed / (result.width * result.height));
    parts.push(zh ? `${n} 处不一样，占 ${pct} 的像素` : `Areas that differ: ${n} · ${pct} of the pixels`);
  }
  if (prepared.alignment === 'scaled') parts.push(zh ? '两张图比例相同、大小不同：按小的那张的大小对比' : 'Same proportions, different sizes: compared at the size of the smaller image');
  if (prepared.alignment === 'topLeft') parts.push(zh ? '两张图大小不同：按左上角对齐' : 'Different sizes: aligned at the top-left corner');
  return parts.join(zh ? '；' : '; ');
}

function showCompareImages(files, anchor) {
  const zh = lang === 'zh';
  // 修改时间早的算旧的
  const modified = (file) => L(file.info?.find(([key]) => L(key) === L({ zh: '修改时间', en: 'Modified' }))?.[1] || '');
  const [older, newer] = modified(files[1]) < modified(files[0]) ? [files[1], files[0]] : [files[0], files[1]];
  const prepared = prepareComparison(imageSourceFor(older), imageSourceFor(newer));
  const o = IMAGE_DIFF;
  let split = 0.5, opacity = 0.5;
  let result = compareImagePixels(prepared, o.subtle);
  let difference = differenceCanvas(prepared, result);
  // 显示用的几张图（同一张 canvas 在不同看法之间挪来挪去）
  const firstView = prepared.first, secondView = prepared.second;
  for (const view of [firstView, secondView]) view.setAttribute('aria-hidden', 'true');
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': zh ? '看法' : 'View' },
    o.modes.map(([id, label]) => h('button', { type: 'button', 'data-id': id, onclick: () => { o.mode = id; draw(); } }, L(label))));
  const options = h('div', { class: 'ci-opts' });
  const stageBox = h('div', { class: 'ci-stage' });
  const details = h('div', { class: 'detail' });
  const tag = (text, right) => h('span', { class: 'ci-tag' + (right ? ' r' : '') }, text);
  const oldTag = zh ? '旧' : 'Old', newTag = zh ? '新' : 'New';

  // 按比例放进 w×hh 的一块
  function frame(w, hh, children, extra) {
    const scale = Math.min(w / prepared.width, hh / prepared.height);
    return h('div', Object.assign({ class: 'ci-frame', style: `width:${Math.round(prepared.width * scale)}px;height:${Math.round(prepared.height * scale)}px` }, extra || {}), children);
  }

  function place(view, className) {
    view.className = 'ci-img' + (className ? ' ' + className : '');
    view.style.clipPath = '';
    view.style.opacity = '';
    return view;
  }

  function draw() {
    for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.id === o.mode));
    const W = Math.max(120, (stageBox.clientWidth || 488) - 12), H = 268;
    let content;
    if (o.mode === 'sideBySide') {
      const half = (W - 8) / 2;
      content = h('div', { class: 'ci-pair' }, frame(half, H, [place(firstView), tag(oldTag)]), frame(half, H, [place(secondView), tag(newTag)]));
      options.replaceChildren();
    } else if (o.mode === 'swipe') {
      const line = h('i', { class: 'ci-line' }), knob = h('i', { class: 'ci-knob', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>' });
      const left = tag(oldTag), right = tag(newTag, true);
      const top = place(firstView, 'top');
      const paint = () => {
        top.style.clipPath = `inset(0 ${(1 - split) * 100}% 0 0)`;
        line.style.left = knob.style.left = `${split * 100}%`;
        left.style.opacity = split > 0.12 ? '1' : '0';
        right.style.opacity = split < 0.88 ? '1' : '0';
      };
      const box = frame(W, H, [place(secondView), top, line, knob, left, right], { role: 'slider', tabindex: '0', 'aria-label': zh ? '分界线' : 'Divider', 'aria-valuemin': '0', 'aria-valuemax': '100' });
      const move = (event) => { const r = box.getBoundingClientRect(); split = clamp((event.clientX - r.left) / r.width, 0, 1); paint(); box.setAttribute('aria-valuenow', String(Math.round(split * 100))); };
      box.addEventListener('pointerdown', (event) => { event.preventDefault(); box.setPointerCapture?.(event.pointerId); move(event); });
      box.addEventListener('pointermove', (event) => { if (box.hasPointerCapture?.(event.pointerId)) move(event); });
      box.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault(); event.stopPropagation();
        split = clamp(split + (event.key === 'ArrowLeft' ? -0.05 : 0.05), 0, 1);
        paint();
      });
      box.classList.add('swipe');
      paint();
      content = box;
      options.replaceChildren(h('span', { class: 'ci-hint' }, zh ? '拖动中间的分界线' : 'Drag the divider'));
    } else if (o.mode === 'overlay') {
      const top = place(secondView);
      top.style.opacity = String(opacity);
      content = frame(W, H, [place(firstView), top]);
      const range = h('input', { type: 'range', min: '0', max: '100', value: String(Math.round(opacity * 100)), 'aria-label': zh ? '新图的深浅' : 'New image opacity',
        oninput: (event) => { opacity = Number(event.target.value) / 100; top.style.opacity = String(opacity); } });
      options.replaceChildren(h('label', { class: 'ci-range' }, h('span', null, oldTag), range, h('span', null, newTag)));
    } else {
      difference.className = 'ci-img';
      difference.setAttribute('role', 'img');
      difference.setAttribute('aria-label', diffDetails(prepared, result));
      content = frame(W, H, [difference]);
      const box = h('input', { type: 'checkbox', checked: o.subtle, onchange: (event) => {
        o.subtle = event.target.checked;
        result = compareImagePixels(prepared, o.subtle);
        difference = differenceCanvas(prepared, result);
        draw();
      } });
      options.replaceChildren(h('label', { class: 'ci-check', title: zh ? '压缩过的照片、导出过的截图会有肉眼看不出的杂色，打开后不算' : 'Compressed photos and exported screenshots contain noise you can’t see. Turn this on to ignore it' }, box, zh ? '忽略细微差别' : 'Ignore subtle differences'));
    }
    stageBox.replaceChildren(content);
    details.textContent = diffDetails(prepared, result);
  }

  // 复制、存储、贴到屏幕的是当前看到的样子，按原图大小画
  const full = () => composeComparison(prepared, o.mode, split, opacity, difference);
  const copy = () => {
    try {
      const canvas = full();
      navigator.clipboard?.write?.([new ClipboardItem({ 'image/png': new Promise((resolve) => canvas.toBlob(resolve, 'image/png')) })]).catch(() => {});
    } catch (error) { /* 不让写剪贴板也照样提示 */ }
    showToast(zh ? '已复制图片' : 'Image copied', anchor);
  };
  const el = cardShell({ title: L(P.compareImages.name), subtitle: `${L(older.name)} → ${L(newer.name)}`, width: 520, children: [
    h('div', { class: 'ci-top' }, seg, h('span', { class: 'space' }), options),
    stageBox,
    details,
  ], buttons: [
    button(zh ? '贴到屏幕' : 'Pin to Screen', () => pinToScreen({ image: full().toDataURL('image/png') }, anchor)),
    button(zh ? '存到「下载」' : 'Save to Downloads', () => showToast(zh ? '已存到「下载」' : 'Saved to Downloads', anchor)),
    button(zh ? '复制图片' : 'Copy Image', copy),
  ] });
  draw();
  presentCard(el, anchor);
  // 放进桌面以后才量得出宽度，按实际宽度再排一次
  requestAnimationFrame(() => { if (el.isConnected) draw(); });
}

// 切分图片：和 App 里一样，网格先按比例取最大的一块（对准主体）再均分；长图按长边均分成几页，最多 9 页
const SPLIT = {
  layouts: [['nine', { zh: '九宫格', en: '3 × 3 Grid' }], ['four', { zh: '四宫格', en: '2 × 2 Grid' }], ['triptych', { zh: '横切三张', en: 'Three Across' }], ['pages', { zh: '长图分页', en: 'Pages' }]],
  grids: { nine: [3, 3], four: [2, 2], triptych: [3, 1] },
  // 上次用的切法
  layout: 'nine',
};

function splitPlan(width, height, layout, focus) {
  const w = Math.floor(width), hh = Math.floor(height);
  const none = { region: [0, 0, 0, 0], tiles: [] };
  if (w < 1 || hh < 1) return none;
  const grid = SPLIT.grids[layout];
  if (grid) {
    const [columns, rows] = grid;
    const ratio = columns / rows;
    let cw = w, ch = cw / ratio;
    if (ch > hh) { ch = hh; cw = ch * ratio; }
    cw = Math.min(Math.floor(cw + 0.001), w);
    ch = Math.min(Math.floor(ch + 0.001), hh);
    const cx = focus ? focus[0] + focus[2] / 2 : w / 2, cy = focus ? focus[1] + focus[3] / 2 : hh / 2;
    const x = Math.floor(Math.min(Math.max(cx - cw / 2, 0), w - cw)), y = Math.floor(Math.min(Math.max(cy - ch / 2, 0), hh - ch));
    const side = Math.min(Math.floor(cw / columns), Math.floor(ch / rows));
    if (side < 1) return none;
    const rx = x + Math.floor((cw - side * columns) / 2), ry = y + Math.floor((ch - side * rows) / 2);
    const tiles = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < columns; c++) tiles.push([rx + side * c, ry + side * r, side, side]);
    return { region: [rx, ry, side * columns, side * rows], tiles };
  }
  const vertical = hh >= w, long = vertical ? hh : w, short = vertical ? w : hh;
  const count = Math.min(Math.max(Math.ceil(long / (short * 4 / 3)), 2), 9);
  const tiles = [];
  for (let i = 0; i < count; i++) {
    const start = Math.round(long * i / count), end = Math.round(long * (i + 1) / count);
    tiles.push(vertical ? [0, start, w, end - start] : [start, 0, end - start, hh]);
  }
  return { region: [0, 0, w, hh], tiles };
}

function showSplitImage(file, anchor) {
  const zh = lang === 'zh';
  const source = imageSourceFor(file);
  // 按文件信息里的尺寸算（示例图画得比原图小）
  const dims = L(file.info?.find(([key]) => L(key) === L({ zh: '尺寸', en: 'Dimensions' }))?.[1] || '');
  const found = /(\d+)\s*×\s*(\d+)/.exec(dims);
  const w = found ? Number(found[1]) : source.width, hh = found ? Number(found[2]) : source.height;
  const k = w / source.width;
  // 海边的照片里最吸引注意的是太阳
  const focus = file.key === 'photo' ? [274 * k, 154 * k, 92 * k, 92 * k] : null;
  const long = Math.max(w, hh) / Math.min(w, hh) >= 1.6;
  const layouts = SPLIT.layouts.filter(([id]) => id !== 'pages' || long);
  let layout = long ? 'pages' : (SPLIT.layout === 'pages' ? 'nine' : SPLIT.layout);
  const base = L(file.name).replace(/\.[^.]+$/, '');
  const folderName = () => `${base} ${L(SPLIT.layouts.find(([id]) => id === layout)[1])}`;
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': zh ? '切法' : 'Layout' },
    layouts.map(([id, label]) => h('button', { type: 'button', 'data-id': id, onclick: () => { layout = id; draw(); } }, L(label))));
  const canvas = h('canvas', { role: 'img' });
  const preview = h('div', { class: 'sp-preview' }, canvas);
  const details = h('div', { class: 'detail' });

  // 预览：原图缩小，用不到的部分压暗，每张画上框和编号
  function draw() {
    for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.id === layout));
    const plan = splitPlan(w, hh, layout, focus);
    const scale = Math.min(416 / w, 248 / hh), dpr = 2;
    const pw = Math.round(w * scale), ph = Math.round(hh * scale);
    canvas.width = pw * dpr; canvas.height = ph * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(source, 0, 0, pw, ph);
    const scaled = (r) => r.map((v) => v * scale);
    const [rx, ry, rw, rh] = scaled(plan.region);
    ctx.fillStyle = 'rgba(0, 0, 0, .55)';
    ctx.beginPath(); ctx.rect(0, 0, pw, ph); ctx.rect(rx, ry, rw, rh); ctx.fill('evenodd');
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, .5)'; ctx.shadowBlur = 3;
    ctx.strokeStyle = 'rgba(255, 255, 255, .95)'; ctx.lineWidth = 1.5;
    ctx.fillStyle = '#ffffff'; ctx.font = '600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    plan.tiles.forEach((tile, i) => {
      const [x, y, tw, th] = scaled(tile);
      ctx.strokeRect(x, y, tw, th);
      ctx.fillText(String(i + 1), x + tw / 2, y + th / 2);
    });
    ctx.restore();
    const first = plan.tiles[0];
    const same = plan.tiles.every((t) => Math.abs(t[2] - first[2]) <= 1 && Math.abs(t[3] - first[3]) <= 1);
    const desc = zh ? `切成 ${plan.tiles.length} 张${same ? ` ${first[2]} × ${first[3]}` : ''}` : (same ? `${plan.tiles.length} pieces, ${first[2]} × ${first[3]} each` : `${plan.tiles.length} pieces`);
    details.textContent = zh ? `${desc}，按编号的顺序存在原图旁边的「${folderName()}」文件夹` : `${desc}, saved in order in the “${folderName()}” folder next to the original`;
    canvas.setAttribute('aria-label', details.textContent);
  }

  // 切好：访达里多一个文件夹（同名的已经有了就在后面加 2、3）
  const split = () => {
    const plan = splitPlan(w, hh, layout, focus);
    SPLIT.layout = layout;
    const taken = new Set(allFiles().map((f) => L(f.name)));
    let name = folderName();
    for (let n = 2; taken.has(name); n++) name = `${folderName()} ${n}`;
    const key = `out-${Date.now()}`;
    state.extraFiles.push({ key, kind: 'folder', icon: 'folder', name: { zh: name, en: name }, fresh: true,
      info: [[{ zh: '种类', en: 'Kind' }, { zh: '文件夹', en: 'Folder' }], [{ zh: '大小', en: 'Size' }, { zh: `${plan.tiles.length} 个文件`, en: `${plan.tiles.length} files` }], [{ zh: '修改时间', en: 'Modified' }, { zh: '刚刚', en: 'Just now' }]] });
    state.selected = [key];
    renderWindow();
    showToast(zh ? `切好了 ${plan.tiles.length} 张，存在「${name}」` : `Saved ${plan.tiles.length} pieces in “${name}”`, anchor);
  };
  const el = cardShell({ title: L(P.splitImage.name), subtitle: L(file.name), width: 440, children: [seg, preview, details],
    buttons: [button(zh ? '切好存下' : 'Split and Save', split)] });
  draw();
  presentCard(el, anchor);
}

// 退出 App：示例的几个 App（内存和 CPU 是示例数据，Xcode 正在编译）；Xcode 第一次退出时假装卡住，几秒后换成「强制退出」
const QUIT_APPS = {
  sample: () => [
    { id: 'xcode', name: { zh: 'Xcode', en: 'Xcode' }, memory: 2350, cpu: 186, base: 186, color: ['#4fa8ff', '#1a5fd6'], glyph: 'X', stuck: true },
    { id: 'safari', name: { zh: 'Safari 浏览器', en: 'Safari' }, memory: 1240, cpu: 7.4, base: 7.4, color: ['#5ac8fa', '#0a84ff'], glyph: 'S' },
    { id: 'music', name: { zh: '音乐', en: 'Music' }, memory: 412, cpu: 14.2, base: 14.2, color: ['#ff6b81', '#fa233b'], glyph: '♪' },
    { id: 'mail', name: { zh: '邮件', en: 'Mail' }, memory: 286, cpu: 0.3, base: 0.3, color: ['#6cc4ff', '#1e88ff'], glyph: '✉' },
    { id: 'notes', name: { zh: '备忘录', en: 'Notes' }, memory: 158, cpu: 0, base: 0, color: ['#ffe27a', '#f7c600'], glyph: '✎' },
    { id: 'preview', name: { zh: '预览', en: 'Preview' }, memory: 96, cpu: 0, base: 0, color: ['#9fd2ff', '#3d8bfd'], glyph: '◐' },
  ],
  apps: null,
  sort: 'memory',
};

/** 按内存或 CPU 从多到少排；一样多时比另一项，再按名字 */
function sortQuitApps(apps, by) {
  const keys = by === 'cpu' ? ['cpu', 'memory'] : ['memory', 'cpu'];
  apps.sort((a, b) => {
    for (const key of keys) if (a[key] !== b[key]) return b[key] - a[key];
    return L(a.name).localeCompare(L(b.name));
  });
}

/** 「12%」「3.4%」：不到 10% 带一位小数 */
function formatCPU(percent) {
  if (percent < 0.05) return '0%';
  return percent < 10 ? `${percent.toFixed(1)}%` : `${Math.round(percent)}%`;
}

function showQuitApps(anchor) {
  const zh = lang === 'zh';
  if (!QUIT_APPS.apps || !QUIT_APPS.apps.length) QUIT_APPS.apps = QUIT_APPS.sample();
  const apps = QUIT_APPS.apps;
  // 唤起时在用的 App：看的是网页就是 Safari，看的是备忘录就是备忘录；访达不列出来
  const front = { foreign: 'safari', link: 'notes' }[state.scene] || null;
  const states = {};
  let confirming = false;
  sortQuitApps(apps, QUIT_APPS.sort);
  // 按内存、按 CPU
  const seg = h('div', { class: 'seg', role: 'group', style: 'align-self:flex-start' });
  const drawSeg = () => seg.replaceChildren(...[['memory', { zh: '按内存', en: 'By Memory' }], ['cpu', { zh: '按 CPU', en: 'By CPU' }]].map(([key, label]) =>
    h('button', { type: 'button', 'aria-pressed': String(QUIT_APPS.sort === key), onclick: () => { QUIT_APPS.sort = key; sortQuitApps(apps, key); drawSeg(); render(); } }, L(label))));
  drawSeg();
  const format = (mb) => mb >= 1000 ? `${(mb / 1000).toFixed(mb >= 10000 ? 0 : 1)} GB` : `${mb} MB`;
  const list = h('div', { class: 'qa-list' });
  const footer = h('div', { class: 'qa-foot' });
  const summary = () => {
    const total = apps.reduce((sum, app) => sum + app.memory, 0);
    return zh ? `正在运行 ${apps.length} 个 App，一共占用 ${format(total)} 内存` : `${apps.length} apps running, using ${format(total)} of memory`;
  };
  const el = cardShell({ title: L(P.quitApps.name), subtitle: summary(), width: 420, children: [
    seg,
    list,
    h('div', { class: 'detail' }, zh ? '没存的文稿，App 会先问你要不要存；点了「退出」几秒还没退出的，可以强制退出' : 'Apps ask before closing unsaved documents. If an app hasn’t quit a few seconds after you click Quit, you can force quit it'),
    footer,
  ] });
  const sub = el.querySelector('.card-head .sub');

  function remove(id) {
    const row = list.querySelector(`[data-app="${id}"]`);
    const index = apps.findIndex((app) => app.id === id);
    if (index >= 0) apps.splice(index, 1);
    delete states[id];
    if (row && !reduced()) {
      row.classList.add('gone');
      setTimeout(render, 220);
    } else render();
  }

  function quit(app, force) {
    states[app.id] = 'quitting';
    render();
    if (app.stuck && !force) {
      // 卡住了：等一会儿还在，换成强制退出
      app.stuck = false;
      setTimeout(() => { if (states[app.id] === 'quitting') { states[app.id] = 'stuck'; render(); } }, 2400);
      return;
    }
    setTimeout(() => remove(app.id), force ? 300 : 650);
  }

  function render() {
    if (!el.isConnected && list.childElementCount) return;
    sub.textContent = summary();
    if (!apps.length) {
      list.replaceChildren(h('div', { class: 'qa-empty' }, zh ? '没有别的 App 在运行了' : 'No other apps are running'));
    } else {
      list.replaceChildren(...apps.map((app) => {
        const st = states[app.id] || 'running';
        const action = st === 'quitting' ? h('div', { class: 'spinner' })
          : st === 'stuck' ? button(zh ? '强制退出' : 'Force Quit', () => quit(app, true), { class: 'mbtn danger' })
          : button(zh ? '退出' : 'Quit', () => quit(app, false));
        return h('div', { class: 'qa-row', 'data-app': app.id },
          h('span', { class: 'qa-icon', style: `background: linear-gradient(160deg, ${app.color[0]}, ${app.color[1]})` }, app.glyph),
          h('span', { class: 'qa-name' }, L(app.name)),
          app.id === front ? h('span', { class: 'qa-tag' }, zh ? '在用' : 'Current') : null,
          h('span', { class: 'qa-cpu' + (app.cpu >= 80 ? ' hot' : '') }, formatCPU(app.cpu)),
          h('span', { class: 'qa-mem' }, format(app.memory)),
          h('span', { class: 'qa-act' }, action));
      }));
    }
    const others = apps.filter((app) => app.id !== front);
    if (confirming && others.length) {
      const frontApp = apps.find((app) => app.id === front);
      footer.replaceChildren(
        h('span', { class: 'qa-ask' }, frontApp ? (zh ? `除了「${L(frontApp.name)}」，退出其他 ${others.length} 个 App？` : `Quit the ${others.length} apps other than “${L(frontApp.name)}”?`)
          : (zh ? `退出这 ${others.length} 个 App？` : `Quit these ${others.length} apps?`)),
        button(zh ? '取消' : 'Cancel', () => { confirming = false; render(); }),
        button(zh ? `退出 ${others.length} 个` : `Quit ${others.length}`, () => {
          confirming = false;
          for (const app of others) if ((states[app.id] || 'running') === 'running') { app.stuck = false; quit(app, false); }
        }, { class: 'mbtn default' }));
    } else {
      confirming = false;
      const idle = others.filter((app) => (states[app.id] || 'running') === 'running');
      const other = button(zh ? '退出其他 App' : 'Quit Other Apps', () => { confirming = true; render(); });
      if (!idle.length) other.disabled = true;
      footer.replaceChildren(h('span', { class: 'space' }), other);
    }
  }

  render();
  presentCard(el, anchor);
  // 开着时每 1.5 秒 CPU 变一点；只换数字，不重新排，免得正要点的那一行跑掉
  const timer = setInterval(() => {
    if (!el.isConnected) { clearInterval(timer); return; }
    for (const app of apps) app.cpu = Math.max(0, app.base * (0.8 + Math.random() * 0.4) + (app.base > 1 ? 0 : Math.random() * 0.2));
    for (const row of list.querySelectorAll('.qa-row')) {
      const app = apps.find((item) => item.id === row.dataset.app);
      const cell = row.querySelector('.qa-cpu');
      if (app && cell) { cell.textContent = formatCPU(app.cpu); cell.classList.toggle('hot', app.cpu >= 80); }
    }
  }, 1500);
}
