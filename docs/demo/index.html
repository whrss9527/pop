function showUninstallApp(file, anchor) {
  const zh = lang === 'zh';
  const items = UNINSTALL.items.map(([place, where, size, doubt], index) => ({ index, place, where, size, doubt }));
  const checked = new Set(items.filter((item) => !item.doubt).map((item) => item.index));
  let phase = 'choosing';
  const total = () => items.filter((item) => checked.has(item.index)).reduce((sum, item) => sum + item.size, 0);
  const totalEl = h('div', { class: 'un-total' });
  const header = h('div', { class: 'un-head' },
    h('div', { class: 'fi app un-icon' }, '✎'),
    h('div', { class: 'un-name' }, h('b', null, 'Sketchpad'), h('span', null, `${zh ? '版本' : 'Version'} 3.2.1 · com.example.sketchpad`)),
    h('div', { class: 'un-size' }, totalEl, h('span', null, zh ? `留下的文件 ${items.length - 1} 处` : `${items.length - 1} leftover items`)));
  const body = h('div', { class: 'un-body' });
  const el = cardShell({ title: L(P.uninstallApp.name), subtitle: 'Sketchpad', width: 460, children: [header, body] });

  function render() {
    totalEl.textContent = formatBytes(total());
    if (phase === 'done') {
      const moved = items.filter((item) => checked.has(item.index));
      const freed = moved.reduce((sum, item) => sum + item.size, 0);
      body.replaceChildren(
        h('div', { class: 'td-done' }, zh ? `已把 ${moved.length} 项移到废纸篓，腾出 ${formatBytes(freed)}` : `Moved ${moved.length} items to the Trash, freeing ${formatBytes(freed)}`),
        h('div', { class: 'btns' },
          button(zh ? '打开废纸篓' : 'Open Trash', () => { dismissCard(); showToast(zh ? '在废纸篓里可以把它们放回原处' : 'You can put them back from the Trash', anchor); }),
          button(zh ? '完成' : 'Done', () => dismissCard(), { class: 'mbtn default' })));
      return;
    }
    const list = h('div', { class: 'qa-list un-list' }, items.map((item) => {
      const [title, glyph] = UNINSTALL.places[item.place];
      const box = h('input', { type: 'checkbox', checked: checked.has(item.index), 'aria-label': L(title), disabled: phase === 'working',
        onchange: (event) => { if (event.target.checked) checked.add(item.index); else checked.delete(item.index); render(); } });
      const note = item.doubt ? (zh ? '可能和同一个开发者的别的 App 共用' : 'May be shared with other apps from the same developer') : item.where;
      return h('label', { class: 'qa-row un-row', title: note },
        box, h('span', { class: 'un-glyph' }, icon(glyph)),
        h('span', { class: 'un-where' }, h('span', null, L(title), item.doubt ? h('i', { class: 'un-doubt' }, '?') : null), h('small', null, item.where)),
        h('span', { class: 'qa-mem' }, formatBytes(item.size)));
    }));
    const keepsApp = !checked.has(0);
    const count = checked.size;
    const summary = !count ? (zh ? '勾上要移到废纸篓的项目' : 'Check the items to move to the Trash')
      : keepsApp ? (zh ? `把勾上的 ${count} 项（${formatBytes(total())}）移到废纸篓，App 留着，下次打开就像刚装好一样` : `Moves the ${count} checked items (${formatBytes(total())}) to the Trash and keeps the app, so it starts fresh next time`)
        : (zh ? `把勾上的 ${count} 项（${formatBytes(total())}）移到废纸篓；需要时可以从废纸篓放回原处` : `Moves the ${count} checked items (${formatBytes(total())}) to the Trash. You can put them back from the Trash if needed`);
    const title = keepsApp ? (zh ? '清掉这些文件' : 'Remove These Files') : UNINSTALL.running ? (zh ? '退出并卸载' : 'Quit and Uninstall') : (zh ? '移到废纸篓' : 'Move to Trash');
    const action = button(title, uninstall);
    action.disabled = !count || phase === 'working';
    body.replaceChildren(list,
      UNINSTALL.running && !keepsApp ? h('div', { class: 'un-warn' }, zh ? '「Sketchpad」正在运行，卸载前会先退出它' : '“Sketchpad” is running and will be quit first') : null,
      h('div', { class: 'detail' }, summary),
      h('div', { class: 'btns' }, phase === 'working' ? h('div', { class: 'spinner' }) : null, action));
  }

  function uninstall() {
    phase = 'working';
    render();
    setTimeout(() => {
      UNINSTALL.running = false;
      if (checked.has(0)) {
        UNINSTALL.removed.add(file.key);
        state.selected = [];
        renderWindow();
      }
      phase = 'done';
      render();
    }, UNINSTALL.running && checked.has(0) ? 1400 : 700);
  }

  render();
  presentCard(el, anchor);
}

// 文件编码：每个文件记着内容（换行统一成 \n）、编码和换行，字节按这些现做：GBK 的字节用浏览器的 TextDecoder 反查出来，
// 读的时候也用 TextDecoder，按错的编码读就是真的乱码
const ENCODING = {
  labels: { utf8: 'UTF-8', utf8BOM: { zh: 'UTF-8 带 BOM', en: 'UTF-8 with BOM' }, gb18030: { zh: 'GB18030（GBK）', en: 'GB18030 (GBK)' }, big5: 'Big5', shiftJIS: 'Shift_JIS', eucKR: 'EUC-KR', utf16LE: 'UTF-16 LE', windows1252: { zh: 'Windows 西欧', en: 'Western (Windows)' } },
  decoders: { utf8: 'utf-8', utf8BOM: 'utf-8', gb18030: 'gb18030', big5: 'big5', shiftJIS: 'shift_jis', eucKR: 'euc-kr', utf16LE: 'utf-16le', windows1252: 'windows-1252' },
  readable: ['utf8', 'gb18030', 'big5', 'shiftJIS', 'eucKR', 'utf16LE', 'windows1252'],
  targets: ['utf8', 'utf8BOM', 'gb18030'],
  lineTargets: [['keep', { zh: '不变', en: 'Keep' }], ['lf', { zh: 'LF（Mac、Linux）', en: 'LF (Mac, Linux)' }], ['crlf', { zh: 'CRLF（Windows）', en: 'CRLF (Windows)' }]],
  // 每个文件现在的样子（转过以后跟着变）
  files: {
    orders: { encoding: 'gb18030', eol: 'crlf', text: '订单号,商品,数量,金额\n20260930001,无线鼠标,2,198.00\n20260930002,机械键盘,1,459.00\n20260930003,显示器支架,1,239.00\n' },
    'notes-old': { encoding: 'utf8', eol: 'lf', text: { zh: '# Pop 0.33.0\n- 录屏可以录电脑里的声音\n- 文字转图片的段距更紧凑\n', en: '# Pop 0.33.0\n- Record the Mac’s sound in screen recordings\n' } },
    'subs-zh': { encoding: 'utf8', eol: 'lf', text: '1\n00:00:05,200 --> 00:00:08,600\n大家好，欢迎来到今天的发布会\n' },
    'subs-en': { encoding: 'utf8', eol: 'lf', text: 'WEBVTT\n\n00:00:05.300 --> 00:00:08.500\nHello everyone, welcome to today’s keynote.\n' },
    'notes-new': { encoding: 'utf8', eol: 'lf', text: { zh: '# Pop 0.34.0\n- 录屏可以录电脑里的声音或者麦克风\n- 网页可以存成 Markdown\n', en: '# Pop 0.34.0\n- Save web pages as Markdown\n' } },
  },
  target: 'utf8',
  lines: 'keep',
  gbk: null,
};

// 文字存成 GBK：第一次用时把双字节的码位都解一遍，反查出每个字的两个字节
function encodeGBK(text) {
  if (!ENCODING.gbk) {
    ENCODING.gbk = new Map();
    const decoder = new TextDecoder('gbk');
    for (let a = 0x81; a <= 0xfe; a++) {
      for (let b = 0x40; b <= 0xfe; b++) {
        if (b === 0x7f) continue;
        const ch = decoder.decode(new Uint8Array([a, b]));
        if (ch.length === 1 && ch !== '\uFFFD' && !ENCODING.gbk.has(ch)) ENCODING.gbk.set(ch, [a, b]);
      }
    }
  }
  const out = [];
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code < 0x80) { out.push(code); continue; }
    const pair = ENCODING.gbk.get(ch);
    if (!pair) return null;
    out.push(pair[0], pair[1]);
  }
  return Uint8Array.from(out);
}

// 文件现在的字节
function encodingBytes(info) {
  const body = L(info.text).replace(/\n/g, info.eol === 'crlf' ? '\r\n' : '\n');
  if (info.encoding === 'gb18030') return encodeGBK(body);
  const utf8 = new TextEncoder().encode(body);
  return info.encoding === 'utf8BOM' ? Uint8Array.from([0xef, 0xbb, 0xbf, ...utf8]) : utf8;
}

// 按某种编码读出来的文字；读不了时为 null
function decodeAs(bytes, encoding) {
  try {
    return new TextDecoder(ENCODING.decoders[encoding], { fatal: true, ignoreBOM: false }).decode(bytes);
  } catch (error) {
    return null;
  }
}

function showFileEncoding(files, anchor) {
  const zh = lang === 'zh';
  const label = (id) => L(ENCODING.labels[id]);
  const rows = files.map((file) => {
    if (!ENCODING.files[file.key]) ENCODING.files[file.key] = { encoding: 'utf8', eol: 'lf', text: '' };
    const info = ENCODING.files[file.key];
    return { file, info, source: info.encoding };
  });
  let phase = 'choosing';
  let result = null;
  const list = h('div', { class: 'qa-list fe-list' });
  const body = h('div', { class: 'un-body' });
  const lineLabel = { lf: 'LF', crlf: 'CRLF' };
  const firstLine = (text) => (text.split(/\r\n|\n|\r/).find((line) => line.trim()) || '').trim();
  const text = (row) => decodeAs(encodingBytes(row.info), row.source);
  // 和现在一样就不用转
  const pending = () => rows.filter((row) => text(row) !== null && (row.source !== ENCODING.target || row.info.encoding !== ENCODING.target
    || (ENCODING.lines !== 'keep' && ENCODING.lines !== row.info.eol)));
  const segment = (items, key) => h('div', { class: 'seg', role: 'group' }, items.map(([id, title]) => h('button', { type: 'button', 'data-id': id, 'aria-pressed': String(ENCODING[key] === id),
    onclick: () => { ENCODING[key] = id; render(); } }, L(title))));

  function render() {
    if (phase === 'done') {
      body.replaceChildren(
        h('div', { class: 'td-done' }, zh ? `转好了 ${result.converted.length} 个文件` : `Converted ${result.converted.length} files`),
        result.unchanged ? h('div', { class: 'detail' }, zh ? `有 ${result.unchanged} 个本来就是，没有动` : `${result.unchanged} already matched and were left alone`) : null,
        h('div', { class: 'btns' },
          result.converted.length ? button(zh ? '撤销' : 'Undo', () => {
            for (const [row, before] of result.converted) Object.assign(row.info, before);
            for (const row of rows) row.source = row.info.encoding;
            phase = 'choosing';
            render();
          }) : null,
          button(zh ? '完成' : 'Done', () => dismissCard(), { class: 'mbtn default' })));
      return;
    }
    list.replaceChildren(...rows.map((row) => {
      const decoded = text(row);
      const select = h('select', { class: 'fe-select', 'aria-label': zh ? '按哪种编码读' : 'Read as', title: zh ? '第一行是乱码时，换一种编码读' : 'If the first line looks garbled, read the file with another encoding',
        onchange: (event) => { row.source = event.target.value; render(); } },
        (row.source === 'utf8BOM' ? ['utf8BOM'] : []).concat(ENCODING.readable).map((id) => h('option', { value: id, selected: id === row.source }, label(id))));
      return h('div', { class: 'qa-row fe-row', 'data-file': row.file.key },
        h('span', { class: 'un-glyph' }, icon('doc')),
        h('span', { class: 'un-where' }, h('span', null, L(row.file.name)),
          h('small', { class: decoded === null ? 'fe-bad' : 'fe-line' }, decoded === null ? (zh ? `按 ${label(row.source)} 读不出来` : `Can’t be read as ${label(row.source)}`) : firstLine(decoded))),
        // 编码在右边的选择框里，这里只写换行
        h('span', { class: 'fe-meta' }, decoded === null ? '' : lineLabel[row.info.eol]),
        select);
    }));
    const count = pending().length;
    const summary = !count ? (zh ? '选中的文件已经是这种编码和换行了' : 'The selected files already use this encoding and these line endings')
      : (ENCODING.target === 'utf8BOM' ? (zh ? '带 BOM 的 UTF-8 用 Excel 打开 CSV 不会乱码；' : 'Excel opens CSV files saved as UTF-8 with a BOM correctly. ') : '')
        + (zh ? `会把 ${count} 个文件转成 ${label(ENCODING.target)}，原来的内容记着，转完可以撤销` : `Converts ${count} files to ${label(ENCODING.target)}. The original contents are kept so you can undo`);
    const convert = button(zh ? '转换' : 'Convert', () => {
      phase = 'working';
      render();
      setTimeout(() => {
        const todo = pending();
        result = { converted: todo.map((row) => [row, { encoding: row.info.encoding, eol: row.info.eol, text: row.info.text }]), unchanged: rows.length - todo.length };
        for (const row of todo) {
          // 按选的编码读出来的就是新的内容（读错了就存下乱码，和 App 里一样）
          const decoded = text(row).replace(/^﻿/, '').replace(/\r\n|\r/g, '\n');
          Object.assign(row.info, { encoding: ENCODING.target, text: decoded, eol: ENCODING.lines === 'keep' ? row.info.eol : ENCODING.lines });
          row.source = ENCODING.target;
        }
        phase = 'done';
        render();
      }, 600);
    }, { class: 'mbtn default' });
    convert.disabled = !count || phase === 'working';
    body.replaceChildren(list,
      h('div', { class: 'bt-opts' },
        h('span', null, zh ? '转成' : 'Convert To'), segment(ENCODING.targets.map((id) => [id, ENCODING.labels[id]]), 'target'),
        h('span', null, zh ? '换行' : 'Line Endings'), segment(ENCODING.lineTargets, 'lines')),
      h('div', { class: 'detail' }, summary),
      h('div', { class: 'btns' }, phase === 'working' ? h('div', { class: 'spinner' }) : null, convert));
  }

  const subtitle = rows.length === 1 ? L(rows[0].file.name) : (zh ? `${rows.length} 个文件` : `${rows.length} files`);
  const el = cardShell({ title: L(P.fileEncoding.name), subtitle, width: 440, children: [body] });
  render();
  presentCard(el, anchor);
}

function showBatteryInfo(anchor) {

    [zh ? '循环次数' : 'Cycle Count', zh ? '286 次（设计寿命 1000 次）' : '286 (designed for 1000)'],

// 录音：屏幕上方的小条（示例里没有真的录，音量条跟着一段说话的起伏动）；再用一次「录音」或者点停止就存好
let voiceRecorder = null;

function toggleVoiceRecorder(anchor) {
  if (voiceRecorder && voiceRecorder.recording) { voiceRecorder.stop(); return; }
  if (voiceRecorder) voiceRecorder.close();
  closeRing(false);
  dismissCard(false);
  const zh = lang === 'zh';
  const time = h('span', { class: 'vr-time' }, '00:00');
  const bars = Array.from({ length: 24 }, () => h('i'));
  const pause = h('button', { type: 'button', class: 'vr-btn', title: zh ? '暂停' : 'Pause', 'aria-label': zh ? '暂停' : 'Pause' }, h('span', { class: 'vr-pause' }));
  const stop = h('button', { type: 'button', class: 'vr-btn', title: zh ? '停止并保存' : 'Stop and Save', 'aria-label': zh ? '停止并保存' : 'Stop and Save' }, h('span', { class: 'vr-stop' }));
  const bar = h('div', { class: 'vr-bar recording' }, h('span', { class: 'dot' }), time, h('span', { class: 'vr-bars' }, ...bars), pause, stop);
  layer.append(bar);
  const place = () => Object.assign(bar.style, { left: `${Math.max(8, (stage.clientWidth - bar.offsetWidth) / 2)}px`, top: `${MENUBAR + 8}px` });
  place();
  const levels = new Array(bars.length).fill(0);
  let ticks = 0, paused = false, closeTimer = null, hovering = false;
  const started = new Date();
  const timer = setInterval(() => {
    if (paused) return;
    ticks++;
    // 一段说话的起伏：几个快慢不同的峰，再加一点抖动
    const level = Math.min(1, Math.max(0, 0.12 + 0.7 * Math.abs(Math.sin(ticks * 0.42)) * (0.55 + 0.45 * Math.sin(ticks * 0.11)) + (Math.random() - 0.5) * 0.18));
    levels.shift();
    levels.push(level);
    bars.forEach((el, i) => { el.style.height = `${2 + 16 * levels[i]}px`; });
    const seconds = Math.floor(ticks / 20);
    time.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  }, 50);
  pause.addEventListener('click', () => {
    paused = !paused;
    bar.classList.toggle('recording', !paused);
    pause.replaceChildren(h('span', { class: paused ? 'vr-resume' : 'vr-pause' }));
    pause.title = paused ? (zh ? '接着录' : 'Resume') : (zh ? '暂停' : 'Pause');
    pause.setAttribute('aria-label', pause.title);
  });
  stop.addEventListener('click', () => finish());
  bar.addEventListener('pointerenter', () => { hovering = true; });
  bar.addEventListener('pointerleave', () => { hovering = false; });
  const close = () => { clearInterval(timer); clearTimeout(closeTimer); bar.remove(); if (voiceRecorder === state) voiceRecorder = null; };
  const scheduleClose = () => { closeTimer = setTimeout(() => { if (hovering) scheduleClose(); else close(); }, 10000); };
  function finish() {
    clearInterval(timer);
    state.recording = false;
    const seconds = Math.max(1, Math.floor(ticks / 20));
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = `${started.getFullYear()}-${pad(started.getMonth() + 1)}-${pad(started.getDate())} ${pad(started.getHours())}.${pad(started.getMinutes())}`;
    const name = zh ? `录音 ${stamp}.m4a` : `Recording ${stamp}.m4a`;
    const length = seconds < 60 ? (zh ? `${seconds} 秒` : `${seconds} sec`)
      : seconds % 60 === 0 ? (zh ? `${seconds / 60} 分钟` : `${seconds / 60} min`) : (zh ? `${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒` : `${Math.floor(seconds / 60)} min ${seconds % 60} sec`);
    const where = () => { const r = bar.getBoundingClientRect(); const s0 = stage.getBoundingClientRect(); return { x: r.left - s0.left + r.width / 2, y: r.bottom - s0.top + 6 }; };
    bar.classList.remove('recording');
    bar.classList.add('saved');
    bar.replaceChildren(
      h('span', { class: 'vr-check' }, '✓'),
      h('span', { class: 'vr-file' }, h('b', null, name), h('span', null, zh ? `存进了「下载」，长 ${length}` : `Saved to Downloads, ${length} long`)),
      button(zh ? '在访达中显示' : 'Show in Finder', () => { showToast(L(T.onlyInApp(zh ? '在访达中显示' : 'Show in Finder')), where()); close(); }),
      button(zh ? '转成文字' : 'Transcribe', () => { const at = where(); close(); runTranscribe({ name }, at); }),
      h('button', { type: 'button', class: 'vr-close', title: zh ? '关闭' : 'Close', 'aria-label': zh ? '关闭' : 'Close', onclick: () => close() }, '×'));
    place();
    scheduleClose();
  }
  const state = { recording: true, stop: finish, close };
  voiceRecorder = state;
}

// 磁盘测速：示例的启动磁盘和一块移动固态硬盘；开始以后先写后读，数字跟着跳（示例里不真的读写），测完可以复制
const DISK_SPEED = {
  selected: 'mac', size: '1gb',
  volumes: [
    { id: 'mac', name: 'Macintosh HD', info: { zh: 'APFS · 内置 · 可用 312.5 GB，共 994.7 GB', en: 'APFS · Internal · 312.5 GB available of 994.7 GB' }, write: 2834, read: 3121 },
    { id: 't7', name: 'T7 Shield', info: { zh: 'ExFAT · 外接 · 可用 1.2 TB，共 2 TB', en: 'ExFAT · External · 1.2 TB available of 2 TB' }, write: 921, read: 1012 },
  ],
  results: {},
};

function showDiskSpeed(anchor) {
  const zh = lang === 'zh';
  const D = DISK_SPEED;
  const sizes = [['256mb', '256 MB', 1.6], ['1gb', '1 GB', 3.2], ['4gb', '4 GB', 5.6]];
  const run = { phase: 'idle', current: 0, fraction: 0, timer: 0 };
  const volume = () => D.volumes.find((v) => v.id === D.selected) || D.volumes[0];
  const select = h('select', { class: 'fe-select', 'aria-label': zh ? '磁盘' : 'Disk', onchange: () => { D.selected = select.value; draw(); } },
    D.volumes.map((v) => h('option', { value: v.id, selected: v.id === D.selected }, v.name)));
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': zh ? '测试文件' : 'Test File', title: zh ? '测试文件越大，结果越接近长时间拷大文件的速度' : 'The bigger the test file, the closer the result is to copying large files for a long time' });
  const info = h('div', { class: 'ds-info' });
  const tile = (key) => h('div', { class: 'ds-tile' });
  const writeTile = tile('write');
  const readTile = tile('read');
  const bar = h('progress', { class: 'ds-progress', max: '1', value: '0' });
  const foot = h('div', { class: 'ds-foot' });
  const number = (mb) => mb >= 100 ? Math.round(mb).toLocaleString('en-US') : mb.toFixed(1);
  function fill(el, title, symbol, value, on) {
    el.className = 'ds-tile' + (on ? ' on' : '');
    el.replaceChildren(h('span', null, icon(symbol), title), h('b', null, value == null ? '—' : number(value), h('i', null, 'MB/s')));
  }
  function draw() {
    const v = volume();
    const result = D.results[`${v.id}-${D.size}`];
    const running = run.phase === 'write' || run.phase === 'read';
    select.disabled = running;
    seg.replaceChildren(...sizes.map(([id, title]) => h('button', { type: 'button', 'aria-pressed': String(D.size === id), disabled: running,
      onclick: () => { D.size = id; draw(); } }, title)));
    info.textContent = L(v.info);
    fill(writeTile, zh ? '写入' : 'Write', 'dsWrite', run.phase === 'write' ? run.current : running ? run.write : result && result.write, run.phase === 'write');
    fill(readTile, zh ? '读取' : 'Read', 'dsRead', run.phase === 'read' ? run.current : result && !running ? result.read : null, run.phase === 'read');
    bar.hidden = !running;
    bar.value = run.fraction;
    const buttons = [];
    if (result && !running) buttons.push(button(zh ? '复制结果' : 'Copy Result', () => copyText(
      `${v.name}${zh ? '（' : ' ('}${L(v.info)}${zh ? '）' : ')'}\n${zh ? '写入' : 'Write'} ${number(result.write)} MB/s\n${zh ? '读取' : 'Read'} ${number(result.read)} MB/s\n${zh ? '测试文件' : 'Test file'} ${sizes.find((x) => x[0] === D.size)[1]}`, null, anchor)));
    buttons.push(running ? button(zh ? '停止' : 'Stop', stop) : button(result ? (zh ? '再测一次' : 'Test Again') : (zh ? '开始测速' : 'Start Test'), start, { class: 'mbtn default' }));
    foot.replaceChildren(h('span', null, zh ? '先写后读，绕过系统缓存；测完删掉测试文件' : 'Writes, then reads, bypassing the system cache. The test file is deleted afterwards'), ...buttons);
  }
  function stop() {
    clearInterval(run.timer);
    Object.assign(run, { phase: 'idle', current: 0, fraction: 0, write: null });
    delete D.results[`${volume().id}-${D.size}`];
    draw();
  }
  function start() {
    const v = volume();
    const seconds = sizes.find((x) => x[0] === D.size)[2];
    delete D.results[`${v.id}-${D.size}`];
    Object.assign(run, { phase: 'write', current: 0, fraction: 0, write: null });
    const began = performance.now();
    clearInterval(run.timer);
    run.timer = setInterval(() => {
      if (!el.isConnected) { clearInterval(run.timer); return; }
      const t = (performance.now() - began) / 1000 / seconds;
      const jitter = 1 + (Math.random() - 0.5) * 0.06;
      if (t < 0.5) {
        run.phase = 'write';
        run.current = v.write * Math.min(1, 0.55 + t * 2.4) * jitter;
        run.fraction = t;
      } else if (t < 1) {
        if (run.write == null) run.write = v.write;
        run.phase = 'read';
        run.current = v.read * Math.min(1, 0.55 + (t - 0.5) * 2.4) * jitter;
        run.fraction = t;
      } else {
        clearInterval(run.timer);
        Object.assign(run, { phase: 'done', current: 0, fraction: 1 });
        D.results[`${v.id}-${D.size}`] = { write: v.write * (0.985 + Math.random() * 0.03), read: v.read * (0.985 + Math.random() * 0.03) };
      }
      draw();
    }, 120);
    draw();
  }
  const el = cardShell({ title: zh ? '磁盘测速' : 'Disk Speed', width: 380, children: [
    h('div', { class: 'ds-top' }, select, seg), info, h('div', { class: 'ds-tiles' }, writeTile, readTile), bar, foot,
  ] });
  draw();
  presentCard(el, anchor);
}

const WORLD_TIME = { cities: ['beijing', 'london', 'newYork', 'sanFrancisco', 'tokyo'], shift: 0, adding: false, search: '' };
const WT_FORMATS = new Map();

function wtFormat(zone, options) {
  const key = zone + JSON.stringify(options);
  if (!WT_FORMATS.has(key)) {
    try { WT_FORMATS.set(key, new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: zone }, options))); }
    catch (error) { WT_FORMATS.set(key, new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'UTC' }, options))); }
  }
  return WT_FORMATS.get(key);
}

// 那个时区里的年月日、几点几分、星期几（0 是星期日）
function wtParts(ms, zone) {
  const parts = {};
  for (const part of wtFormat(zone, { hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', weekday: 'short' }).formatToParts(new Date(ms))) parts[part.type] = part.value;
  return { y: Number(parts.year), m: Number(parts.month), d: Number(parts.day), h: Number(parts.hour) % 24, min: Number(parts.minute),
    wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(parts.weekday) };
}

// 比 UTC 快多少分钟
function wtOffset(ms, zone) {
  const p = wtParts(ms, zone);
  return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.min) - Math.floor(ms / 60000) * 60000) / 60000);
}

function wtOffsetText(ms, zone) {
  const offset = wtOffset(ms, zone);
  if (!offset) return 'UTC';
  const minutes = Math.abs(offset);
  return `UTC${offset > 0 ? '+' : '−'}${Math.floor(minutes / 60)}${minutes % 60 ? ':' + String(minutes % 60).padStart(2, '0') : ''}`;
}

function wtIsDST(ms, zone) {
  const year = wtParts(ms, zone).y;
  return wtOffset(ms, zone) > Math.min(wtOffset(Date.UTC(year, 0, 1), zone), wtOffset(Date.UTC(year, 6, 1), zone));
}

// PDT、BST 这类缩写；只有「GMT+8」这种的时候不写
function wtAbbreviation(ms, zone) {
  for (const locale of ['en-US', 'en-GB']) {
    try {
      const name = new Intl.DateTimeFormat(locale, { timeZone: zone, timeZoneName: 'short' }).formatToParts(new Date(ms)).find((part) => part.type === 'timeZoneName')?.value;
      if (name && /^[A-Z]{2,5}$/.test(name) && name !== 'UTC' && name !== 'GMT') return name;
    } catch (error) { return null; }
  }
  return null;
}

function wtTime(ms, zone) {
  const p = wtParts(ms, zone);
  return `${String(p.h).padStart(2, '0')}:${String(p.min).padStart(2, '0')}`;
}

function wtDate(ms, zone) {
  const p = wtParts(ms, zone);
  return lang === 'zh' ? `${p.m}月${p.d}日周${'日一二三四五六'[p.wd]}` : wtFormat(zone, { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(ms));
}

function wtDayNumber(ms, zone) {
  const p = wtParts(ms, zone);
  return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 86400000);
}

function wtLocalZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai'; } catch (error) { return 'Asia/Shanghai'; }
}

function wtCity(id) {
  return WT_CITIES.find((city) => city.id === id) || null;
}

// 代表一个时区的城市：表里第一个用这个时区的，没有的话用时区标识里的城市名
function wtRepresentative(zone) {
  const city = WT_CITIES.find((c) => c.zone === zone);
  if (city) return city;
  const name = (zone.split('/').pop() || zone).replace(/_/g, ' ');
  return { id: 'tz:' + zone, zone, name: { zh: name, en: name }, keys: name.toLowerCase() };
}

function wtSearch(query) {
  const needle = query.trim().toLowerCase();
  if (!needle) return [];
  const words = (city) => [city.name.zh, city.name.en.toLowerCase(), city.zone.toLowerCase(), ...city.keys.split(' ')];
  const open = WT_CITIES.filter((city) => !WORLD_TIME.cities.includes(city.id));
  const prefixed = open.filter((city) => words(city).some((word) => word.startsWith(needle)));
  const contained = needle.length < 2 ? [] : open.filter((city) => !prefixed.includes(city) && words(city).some((word) => word.includes(needle)));
  return prefixed.concat(contained).slice(0, 6);
}

// 本地那一天里，所有时区都在 9:00–18:00 之间的第一段（15 分钟一格）
function wtOverlap(ms, zones, local) {
  const p = wtParts(ms, local);
  const day = Date.UTC(p.y, p.m - 1, p.d) - wtOffset(ms, local) * 60000;
  let start = null;
  for (let step = 0; step <= 96; step++) {
    const moment = day + step * 900000;
    const working = step < 96 && zones.every((zone) => { const q = wtParts(moment, zone); const minute = q.h * 60 + q.min; return minute >= 540 && minute < 1080; });
    if (working && start == null) start = moment;
    else if (!working && start != null) return { start, end: moment };
  }
  return null;
}

// 生成图表：和 App 里一样认表格（第一行是表头、第一列是名字），按月份排的先画成折线；用 SVG 画柱状图、条形图、折线图、饼图
const CHART_COLORS = ['#007aff', '#ff9500', '#34c759', '#af52de', '#ff2d55', '#30b0c7', '#ffcc00', '#5856d6', '#00c7be', '#a2845e', '#8e8e93', '#ff6b9e'];
const CHART_STATE = { values: true };
const CHART_KINDS = [['bar', { zh: '柱状图', en: 'Column' }], ['horizontal', { zh: '条形图', en: 'Bar' }], ['line', { zh: '折线图', en: 'Line' }], ['pie', { zh: '饼图', en: 'Pie' }]];

function tableText() {
  const t = TABLE[lang];
  return [t.head, ...t.rows].map((row) => row.join('\t')).join('\n');
}

function chartData(text) {
  const rows = text.split('\n').map((line) => line.split('\t'));
  const [head, ...body] = rows;
  return { labels: body.map((row) => row[0]), series: head.slice(1).map((name, i) => ({ name, values: body.map((row) => Number(row[i + 1])) })) };
}

// 坐标轴的刻度：1、2、2.5、5 乘 10 的几次方
function chartScale(min, max, ticks) {
  const raw = (max - min) / ticks || 1;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * power).find((s) => s >= raw) || raw;
  return { lo: Math.floor(min / step) * step, hi: Math.ceil(max / step) * step || step, step };
}

function chartSVG(data, kind, showValues) {
  const W = 428, H = 230;
  const out = [];
  const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (v) => v.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const color = (i) => CHART_COLORS[i % CHART_COLORS.length];
  if (kind === 'pie') {
    const values = data.series[0].values;
    const total = values.reduce((a, b) => a + b, 0) || 1;
    const cx = 112, cy = H / 2, r = 104, r0 = 52;
    const at = (angle, radius) => [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)].map((n) => n.toFixed(2));
    let angle = -Math.PI / 2;
    values.forEach((value, i) => {
      const sweep = (value / total) * Math.PI * 2;
      const a0 = angle + 0.012, a1 = angle + sweep - 0.012, large = a1 - a0 > Math.PI ? 1 : 0;
      const [x0, y0] = at(a0, r), [x1, y1] = at(a1, r), [x2, y2] = at(a1, r0), [x3, y3] = at(a0, r0);
      out.push(`<path d="M${x0} ${y0}A${r} ${r} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z" fill="${color(i)}"/>`);
      if (showValues && value / total >= 0.05) {
        const [tx, ty] = at(angle + sweep / 2, (r + r0) / 2);
        out.push(`<text class="pct" x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central">${Math.round((value / total) * 100)}%</text>`);
      }
      angle += sweep;
    });
    data.labels.forEach((label, i) => {
      const y = cy - (data.labels.length - 1) * 9 + i * 18;
      out.push(`<circle cx="246" cy="${y}" r="4" fill="${color(i)}"/><text x="256" y="${y}" dominant-baseline="central">${esc(label)}</text>`);
    });
    return { viewBox: `0 0 ${W} ${H}`, html: out.join('') };
  }
  const all = data.series.flatMap((s) => s.values);
  const scale = chartScale(Math.min(0, ...all), Math.max(0, ...all), 4);
  const n = data.labels.length, m = data.series.length;
  if (kind === 'horizontal') {
    const left = Math.min(90, Math.max(...data.labels.map((l) => l.length)) * 7 + 14), right = 34, top = 6, bottom = 18;
    const plotW = W - left - right, plotH = H - top - bottom, rowH = plotH / n, barH = (rowH * 0.68) / m;
    const x = (v) => left + ((v - scale.lo) / (scale.hi - scale.lo)) * plotW;
    for (let t = scale.lo; t <= scale.hi + 1e-9; t += scale.step) {
      out.push(`<line class="grid" x1="${x(t)}" y1="${top}" x2="${x(t)}" y2="${top + plotH}"/><text x="${x(t)}" y="${H - 4}" text-anchor="middle">${fmt(t)}</text>`);
    }
    data.labels.forEach((label, i) => {
      out.push(`<text x="${left - 6}" y="${top + (i + 0.5) * rowH}" text-anchor="end" dominant-baseline="central">${esc(label)}</text>`);
      data.series.forEach((series, s) => {
        const v = series.values[i], y = top + i * rowH + rowH * 0.16 + s * barH;
        const x0 = x(Math.min(v, 0)), x1 = x(Math.max(v, 0));
        out.push(`<rect x="${x0}" y="${y}" width="${Math.max(x1 - x0, 1)}" height="${barH}" rx="2" fill="${color(s)}"/>`);
        if (showValues) out.push(`<text class="val" x="${(v < 0 ? x0 - 3 : x1 + 3)}" y="${y + barH / 2}" text-anchor="${v < 0 ? 'end' : 'start'}" dominant-baseline="central">${fmt(v)}</text>`);
      });
    });
    return { viewBox: `0 0 ${W} ${H}`, html: out.join('') };
  }
  const left = 34, right = 8, top = 14, bottom = 22;
  const plotW = W - left - right, plotH = H - top - bottom, groupW = plotW / n;
  const y = (v) => top + ((scale.hi - v) / (scale.hi - scale.lo)) * plotH;
  for (let t = scale.lo; t <= scale.hi + 1e-9; t += scale.step) {
    out.push(`<line class="${t === 0 ? 'axis' : 'grid'}" x1="${left}" y1="${y(t)}" x2="${W - right}" y2="${y(t)}"/><text x="${left - 5}" y="${y(t)}" text-anchor="end" dominant-baseline="central">${fmt(t)}</text>`);
  }
  data.labels.forEach((label, i) => out.push(`<text x="${left + (i + 0.5) * groupW}" y="${H - 6}" text-anchor="middle">${esc(label)}</text>`));
  if (kind === 'line') {
    data.series.forEach((series, s) => {
      const points = series.values.map((v, i) => [left + (i + 0.5) * groupW, y(v)]);
      out.push(`<polyline points="${points.map((p) => p.join(',')).join(' ')}" fill="none" stroke="${color(s)}" stroke-width="2" stroke-linejoin="round"/>`);
      points.forEach(([px, py], i) => {
        out.push(`<circle cx="${px}" cy="${py}" r="3" fill="${color(s)}"/>`);
        if (showValues) out.push(`<text class="val" x="${px}" y="${py - 7}" text-anchor="middle">${fmt(series.values[i])}</text>`);
      });
    });
  } else {
    const barW = (groupW * 0.68) / m;
    data.labels.forEach((label, i) => data.series.forEach((series, s) => {
      const v = series.values[i], bx = left + i * groupW + groupW * 0.16 + s * barW;
      const y0 = y(Math.max(v, 0)), y1 = y(Math.min(v, 0));
      out.push(`<rect x="${bx}" y="${y0}" width="${barW}" height="${Math.max(y1 - y0, 1)}" rx="2" fill="${color(s)}"/>`);
      if (showValues) out.push(`<text class="val" x="${bx + barW / 2}" y="${v < 0 ? y1 + 9 : y0 - 3}" text-anchor="middle">${fmt(v)}</text>`);
    }));
  }
  return { viewBox: `0 0 ${W} ${H}`, html: out.join('') };
}

function showChart(content, anchor) {
  const zh = lang === 'zh';
  const original = chartData(content.text || tableText());
  const kinds = CHART_KINDS.filter(([id]) => id !== 'pie' || original.series.length === 1);
  const o = { kind: 'line', sorted: false, title: '' };
  const svg = s('svg', { class: 'ch-canvas', role: 'img', 'aria-label': zh ? '图表' : 'Chart', preserveAspectRatio: 'xMidYMid meet' });
  const legend = h('div', { class: 'ch-legend' });
  const seg = h('div', { class: 'seg ch-seg', role: 'group', 'aria-label': zh ? '样子' : 'Style' });
  const opts = h('div', { class: 'ch-opts' });
  const title = h('input', { class: 'ch-title', type: 'text', placeholder: zh ? '标题（可以不填，存成图片时写在上面）' : 'Title (optional, shown on the saved image)',
    'aria-label': zh ? '标题' : 'Title', oninput: () => { o.title = title.value; } });
  const canSort = () => o.kind !== 'line' && original.labels.length > 2;
  function data() {
    if (!o.sorted || !canSort()) return original;
    const order = original.labels.map((_, i) => i).sort((a, b) => original.series[0].values[b] - original.series[0].values[a] || a - b);
    return { labels: order.map((i) => original.labels[i]), series: original.series.map((series) => ({ name: series.name, values: order.map((i) => series.values[i]) })) };
  }
  function draw() {
    const d = data();
    const chart = chartSVG(d, o.kind, CHART_STATE.values);
    svg.setAttribute('viewBox', chart.viewBox);
    svg.innerHTML = chart.html;
    legend.hidden = o.kind === 'pie' || d.series.length < 2;
    legend.replaceChildren(...d.series.map((series, i) => h('span', null, h('i', { style: `background:${CHART_COLORS[i]}` }), series.name)));
    seg.replaceChildren(...kinds.map(([id, name]) => h('button', { type: 'button', 'aria-pressed': String(o.kind === id), onclick: () => { o.kind = id; draw(); } }, L(name))));
    const check = (label, on, change) => h('label', null, h('input', { type: 'checkbox', checked: on, onchange: (event) => change(event.target.checked) }), label);
    opts.replaceChildren(...[
      check(zh ? '显示数值' : 'Show Values', CHART_STATE.values, (on) => { CHART_STATE.values = on; draw(); }),
      canSort() ? check(zh ? '从大到小' : 'Largest First', o.sorted, (on) => { o.sorted = on; draw(); }) : null,
    ].filter(Boolean));
  }
  draw();
  const name = () => o.title.trim() || (zh ? '图表' : 'Chart');
  presentCard(cardShell({ title: zh ? '生成图表' : 'Chart', subtitle: zh ? `${original.labels.length} 项 · ${original.series.length} 组数` : `${original.labels.length} items · ${original.series.length} series`,
    width: 460, children: [title, svg, legend, seg, opts],
    buttons: [
      button(zh ? '存到「下载」' : 'Save to Downloads', () => showToast(L({ zh: `已存到「下载」：${name()}.png`, en: `Saved to Downloads: ${name()}.png` }), anchor)),
      button(zh ? '复制图片' : 'Copy Image', () => showToast(zh ? '已复制图片' : 'Image copied', anchor), { class: 'mbtn default' }),
    ] }), anchor);
}

// 表格转换：制表符分隔的表格转成 Markdown 表格、CSV、JSON
function showTableConvert(content, anchor) {
  const rowsOf = (content.text || tableText()).split('\n').map((line) => line.split('\t'));
  const [head, ...body] = rowsOf;
  const markdown = [`| ${head.join(' | ')} |`, `|${head.map(() => ' --- ').join('|')}|`, ...body.map((row) => `| ${row.join(' | ')} |`)].join('\n');
  const csv = rowsOf.map((row) => row.join(',')).join('\n');
  const json = `[\n${body.map((row) => `  {${head.map((key, i) => `${JSON.stringify(key)}: ${JSON.stringify(row[i])}`).join(', ')}}`).join(',\n')}\n]`;
  const list = rows([['Markdown', markdown], ['CSV', csv], ['JSON', json]], { anchor });
  list.classList.add('pre');
  presentCard(cardShell({ title: L(P.tableConvert.name), width: 420, children: [list] }), anchor);
}

// 数字统计：多行时每行取最后一个数（这张表里是「成本」那一列）
function showNumberStats(content, anchor) {
  const values = (content.text || tableText()).split('\n').map((line) => (line.match(/-?\d[\d,]*(?:\.\d+)?(?!.*\d)/) || [])[0]).filter(Boolean).map((v) => Number(v.replace(/,/g, '')));
  const sorted = [...values].sort((a, b) => a - b);
  const sum = values.reduce((a, b) => a + b, 0);
  const middle = Math.floor(sorted.length / 2);
  const median = sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
  const fmt = (v) => String(Math.round(v * 100) / 100);
  presentCard(cardShell({ title: L(P.numberStats.name), children: [rows([
    [{ zh: '合计', en: 'Sum' }, fmt(sum)], [{ zh: '平均', en: 'Average' }, fmt(sum / values.length)], [{ zh: '中位数', en: 'Median' }, fmt(median)],
    [{ zh: '最大', en: 'Max' }, fmt(sorted[sorted.length - 1])], [{ zh: '最小', en: 'Min' }, fmt(sorted[0])], [{ zh: '个数', en: 'Count' }, String(values.length)],
  ], { anchor })] }), anchor);
}

// 分辨率：示例的 MacBook Pro（主显示器）和一台 Studio Display。外接的换了以后要在 15 秒内点「保留」，
// 不点或者关掉卡片就换回原来的；内建的换了就算。关掉再打开还记着
const RESOLUTION = {
  selected: 'builtin',
  displays: [
    { id: 'builtin', name: { zh: '内建显示器', en: 'Built-in Display' }, builtIn: true, main: true, current: '1512x982', rate: 120, rates: [120, 60, 50, 48],
      sizes: [[1147, 745], [1352, 878], [1512, 982, 'default'], [1728, 1117], [1800, 1169]] },
    { id: 'studio', name: { zh: 'Studio Display', en: 'Studio Display' }, builtIn: false, main: false, current: '2048x1152', rate: 60, rates: [60],
      sizes: [[1280, 720, 'blurry'], [1600, 900], [2048, 1152], [2560, 1440, 'default'], [2880, 1620], [5120, 2880]] },
  ],
  pending: null,
  timer: 0,
};

function resolutionStop() {
  clearInterval(RESOLUTION.timer);
  RESOLUTION.timer = 0;
  RESOLUTION.pending = null;
}

// 换回等着确认的那台原来的大小和刷新率
function resolutionRevert() {
  const pending = RESOLUTION.pending;
  if (!pending) return;
  const display = RESOLUTION.displays.find((d) => d.id === pending.display);
  if (display) Object.assign(display, pending.previous);
  resolutionStop();
}

function showResolution(anchor) {
  const zh = lang === 'zh';
  const R = RESOLUTION;
  // 上一张卡片关掉时还在等确认：换回去
  resolutionRevert();
  const seg = h('div', { class: 'seg rs-seg', role: 'group', 'aria-label': zh ? '显示器' : 'Display' });
  const list = h('div', { class: 'rs-list', role: 'radiogroup', 'aria-label': zh ? '看起来像' : 'Looks like' });
  const rateBox = h('label', { class: 'rs-rate' });
  const mainBox = h('div', { class: 'rs-main-box' });
  const pendingBox = h('div');
  const done = button(zh ? '完成' : 'Done', () => { resolutionStop(); dismissCard(); }, { class: 'mbtn default rs-done' });
  const current = () => R.displays.find((d) => d.id === R.selected) || R.displays[0];

  function choose(display, size, rate) {
    if (display.current === size && display.rate === rate) return;
    // 另一台还在等确认：能点到这里说明看得见，那台就留着
    if (R.pending && R.pending.display !== display.id) resolutionStop();
    const previous = R.pending ? R.pending.previous : { current: display.current, rate: display.rate };
    display.current = size;
    display.rate = rate;
    if (display.builtIn || (previous.current === size && previous.rate === rate)) {
      resolutionStop();
    } else {
      clearInterval(R.timer);
      R.pending = { display: display.id, previous, remaining: 15 };
      R.timer = setInterval(() => {
        if (!el.isConnected) { resolutionRevert(); return; }
        R.pending.remaining -= 1;
        if (R.pending.remaining <= 0) resolutionRevert();
        draw();
      }, 1000);
    }
    draw();
  }

  function draw() {
    const display = current();
    seg.hidden = R.displays.length < 2;
    seg.replaceChildren(...R.displays.map((d) => h('button', { type: 'button', 'aria-pressed': String(d.id === display.id),
      onclick: () => { R.selected = d.id; draw(); } }, L(d.name))));
    list.replaceChildren(...display.sizes.map(([width, height, flag]) => {
      const size = `${width}x${height}`;
      const on = display.current === size;
      return h('button', { type: 'button', role: 'radio', 'aria-checked': String(on), class: 'rs-row', onclick: () => choose(display, size, display.rate) },
        h('b', null, `${width} × ${height}`),
        flag === 'default' ? h('i', null, zh ? '默认' : 'Default') : null,
        flag === 'blurry' ? h('i', { class: 'warn', title: zh ? '这个大小没有 HiDPI 模式，文字会发虚' : 'This size has no HiDPI mode, so text looks blurry' }, zh ? '低分辨率' : 'Low resolution') : null,
        on ? h('span', { class: 'sd-check' }, '✓') : null);
    }));
    // 这个大小有几种刷新率时才让选
    rateBox.hidden = display.rates.length < 2;
    rateBox.replaceChildren(h('span', null, zh ? '刷新率' : 'Refresh Rate'),
      h('select', { class: 'fe-select', 'aria-label': zh ? '刷新率' : 'Refresh Rate', onchange: (event) => choose(display, display.current, Number(event.target.value)) },
        display.rates.map((rate) => h('option', { value: String(rate), selected: rate === display.rate }, `${rate} Hz`))));
    mainBox.hidden = R.displays.length < 2;
    mainBox.replaceChildren(display.main
      ? h('div', { class: 'rs-main' }, icon('rsMenubar'), zh ? '主显示器：菜单栏和程序坞在这台上' : 'Main display: the menu bar and Dock are on this one')
      : button(zh ? '设为主显示器' : 'Make Main Display', () => { R.displays.forEach((d) => { d.main = d.id === display.id; }); draw(); },
        { class: 'mbtn rs-main-btn', title: zh ? '把菜单栏和程序坞挪到这台显示器上' : 'Move the menu bar and Dock to this display' }));
    const pending = R.pending;
    pendingBox.hidden = !pending;
    pendingBox.replaceChildren(pending ? h('div', { class: 'rs-pending', role: 'alert' }, icon('timer'),
      h('span', null, zh ? `保留这个分辨率吗？${pending.remaining} 秒后换回原来的` : `Keep this resolution? Switching back in ${pending.remaining} s`),
      button(zh ? '换回去' : 'Switch Back', () => { resolutionRevert(); draw(); }),
      button(zh ? '保留' : 'Keep', () => { resolutionStop(); draw(); }, { class: 'mbtn default' })) : '');
    done.hidden = !!pending;
  }

  const el = cardShell({ title: L(P.resolution.name), width: 360, children: [
    seg, h('div', { class: 'rs-title' }, zh ? '看起来像' : 'Looks like'), list, rateBox, mainBox, pendingBox,
  ], buttons: [
    button(zh ? '显示器设置' : 'Display Settings', () => { resolutionStop(); showToast(L(T.onlyInApp(zh ? '显示器设置' : 'Display Settings')), anchor); }),
    done,
  ] });
  draw();
  presentCard(el, anchor);
}

// 加密打包：填名字、两遍密码、加密强度；做好以后访达里多一个 .dmg（示例里不真的加密）
function showEncryptFiles(files, anchor) {
  const zh = lang === 'zh';
  const sizeOf = (file) => { const row = file.info.find(([key]) => L(key) === L({ zh: '大小', en: 'Size' })); return row ? L(row[1]) : null; };
  const first = files[0];
  const isFolder = files.length === 1 && first.kind === 'folder';
  const defaultName = files.length === 1 ? (isFolder ? L(first.name) : L(first.name).replace(/\.[^.]+$/, '')) : (zh ? `${files.length} 项` : `${files.length} items`);
  const o = { strength: 'aes256', trash: false, phase: 'editing' };
  const contents = files.length === 1 ? `${L(first.name)}${sizeOf(first) ? (zh ? `，一共 ${sizeOf(first).replace(/（.*/, '')}` : `, ${sizeOf(first).replace(/ \(.*/, '')} in total`) : ''}` : (zh ? `${files.length} 项` : `${files.length} items`);
  const name = h('input', { class: 'fp-search en-input', type: 'text', value: defaultName, 'aria-label': zh ? '名字' : 'Name', oninput: () => draw() });
  const password = h('input', { class: 'fp-search en-input', type: 'password', 'aria-label': zh ? '密码' : 'Password', autocomplete: 'new-password', oninput: () => draw() });
  const confirm = h('input', { class: 'fp-search en-input', type: 'password', 'aria-label': zh ? '再输一遍' : 'Confirm', autocomplete: 'new-password', oninput: () => draw(),
    onkeydown: (event) => { if (event.key === 'Enter') start(); } });
  const seg = h('div', { class: 'seg', role: 'group' });
  const hint = h('div', { class: 'en-hint' });
  const trash = h('label', { class: 'sub-check' }, h('input', { type: 'checkbox', onchange: (event) => { o.trash = event.target.checked; } }), zh ? '做好后把原文件移到废纸篓' : 'Move the originals to the Trash afterwards');
  const go = button(zh ? '加密打包' : 'Encrypt', () => start(), { class: 'mbtn default' });
  const body = h('div', { class: 'en-body' });
  const form = h('div', { class: 'en-form' },
    h('div', { class: 'sub-grid' },
      h('span', null, zh ? '名字' : 'Name'), h('div', null, name, h('i', { class: 'en-ext' }, '.dmg')),
      h('span', null, zh ? '密码' : 'Password'), h('div', null, password),
      h('span', null, zh ? '再输一遍' : 'Confirm'), h('div', null, confirm),
      h('span', null, zh ? '加密强度' : 'Encryption'), h('div', null, seg)),
    hint, trash,
    h('div', { class: 'sub-foot' }, h('span', null, zh ? '存在原来的文件夹里' : 'Saved in the same folder'), go));

  function check() {
    const p = password.value;
    if (p.length < 4) return [zh ? '密码至少 4 位' : 'The password needs at least 4 characters', true];
    if (p !== confirm.value) return [zh ? '两次输入的密码不一样' : 'The passwords don’t match', true];
    const kinds = [/\p{L}/u.test(p), /\p{N}/u.test(p), /[^\p{L}\p{N}]/u.test(p)].filter(Boolean).length;
    if (p.length < 8 || kinds < 2) return [zh ? '密码有点简单：8 位以上，字母、数字、符号混着用更安全' : 'This password is simple. 8 or more characters mixing letters, numbers and symbols are safer.', false];
    return null;
  }

  function start() {
    const result = check();
    if (o.phase !== 'editing' || (result && result[1])) return;
    o.phase = 'working';
    draw();
    setTimeout(() => {
      const base = (name.value.trim() || (zh ? '加密' : 'Encrypted')).replace(/[/:]/g, '-');
      let file = `${base}.dmg`;
      for (let n = 2; FILES.concat(state.extraFiles).some((f) => L(f.name) === file); n += 1) file = `${base} ${n}.dmg`;
      const key = `dmg-${Date.now()}`;
      state.extraFiles.push({ key, kind: 'other', icon: 'text', tag: 'DMG', name: { zh: file, en: file }, fresh: true,
        info: [[{ zh: '种类', en: 'Kind' }, { zh: '磁盘映像', en: 'Disk Image' }], [{ zh: '大小', en: 'Size' }, '1.1 MB'], [{ zh: '修改时间', en: 'Modified' }, { zh: '刚刚', en: 'Just now' }]] });
      // 原文件移到废纸篓：访达里不再显示
      if (o.trash) {
        for (const f of files) UNINSTALL.removed.add(f.key);
        state.extraFiles = state.extraFiles.filter((f) => !files.some((g) => g.key === f.key));
      }
      state.selected = [key];
      password.value = '';
      confirm.value = '';
      o.phase = 'done';
      o.file = file;
      renderWindow();
      draw();
    }, 1200);
  }

  function draw() {
    seg.replaceChildren(...[['aes256', 'AES-256'], ['aes128', 'AES-128']].map(([id, title]) => h('button', { type: 'button', 'aria-pressed': String(o.strength === id),
      onclick: () => { o.strength = id; draw(); } }, title)));
    const result = password.value ? check() : null;
    hint.textContent = result ? result[0] : '';
    hint.className = 'en-hint' + (result ? (result[1] ? ' bad' : ' warn') : '');
    const blocked = !password.value || (result && result[1]);
    go.disabled = blocked || o.phase !== 'editing';
    go.textContent = o.phase === 'working' ? (zh ? '正在加密…' : 'Encrypting…') : (zh ? '加密打包' : 'Encrypt');
    for (const input of [name, password, confirm]) input.disabled = o.phase !== 'editing';
    if (o.phase === 'done') {
      body.replaceChildren(
        h('div', { class: 'td-done' }, zh ? `做好了「${o.file}」（1.1 MB）` : `Created “${o.file}” (1.1 MB)`),
        h('div', { class: 'detail' }, zh ? '在任何一台 Mac 上双击它、输入密码就能打开。密码忘了就打不开了，记好它' : 'Double-click it on any Mac and enter the password to open it. Without the password it can’t be opened, so keep it safe.'),
        h('div', { class: 'btns' }, button(zh ? '在访达中显示' : 'Show in Finder', () => dismissCard()), button(zh ? '完成' : 'Done', () => dismissCard(), { class: 'mbtn default' })));
    } else if (!body.contains(form)) {
      body.replaceChildren(form);
    }
  }

  const el = cardShell({ title: L(P.encryptFiles.name), subtitle: contents, width: 400, children: [body] });
  draw();
  presentCard(el, anchor);
  setTimeout(() => password.focus(), 50);
}

function showFontPreview(content, anchor) {

  function menu(font, button) {
    el.querySelector('.menu-pop')?.remove();
    const items = [
      [zh ? '复制字体名' : 'Copy Font Name', () => copyText(font.name, null, anchor)],
      [zh ? '复制 PostScript 名' : 'Copy PostScript Name', () => copyText(font.ps, null, anchor)],
      [zh ? '复制 CSS' : 'Copy CSS', () => copyText(`font-family: "${font.name}";`, null, anchor)],
      [zh ? '复制成图片' : 'Copy as Image', () => showToast(L(T.onlyInApp(zh ? '复制成图片' : 'Copy as Image')), anchor)],
    ];
    const pop = h('div', { class: 'menu-pop glass', role: 'menu' }, items.map(([label, action]) => h('button', { type: 'button', role: 'menuitem', onclick: () => { pop.remove(); action(); } }, label)));
    const r = button.getBoundingClientRect();
    const c = el.getBoundingClientRect();
    pop.style.left = `${Math.max(8, r.right - c.left - 170)}px`;
    pop.style.top = `${r.bottom - c.top + 4}px`;
    el.append(pop);
  }

  function draw() {
    sizeLabel.textContent = String(FONT_STATE.size);
    seg.replaceChildren(...filters.map(([id, title]) => h('button', { type: 'button', 'data-id': id, 'aria-pressed': String(o.filter === id),
      onclick: () => { o.filter = id; draw(); } }, L(title))));
    const fonts = shown();
    list.replaceChildren(...fonts.map((font) => {
      const favorite = FONT_STATE.favorites.has(font.name);
      const more = h('button', { class: 'icon-btn fp-more', type: 'button', title: zh ? '更多' : 'More', 'aria-label': `${zh ? '更多' : 'More'} ${font.name}`, onclick: (event) => { event.stopPropagation(); menu(font, more); } }, '⋯');
      const row = h('div', { class: 'fp-row' },
        h('div', { class: 'fp-head' }, h('b', null, display(font)), display(font) !== font.name ? h('span', null, font.name) : null,
          h('i', null, zh ? `${font.styles} 种样式` : `${font.styles} styles`), h('span', { class: 'space' }),
          h('button', { class: 'icon-btn fp-star' + (favorite ? ' on' : ''), type: 'button', title: favorite ? (zh ? '取消收藏' : 'Remove from Favorites') : (zh ? '加到收藏' : 'Add to Favorites'),
            'aria-pressed': String(favorite), onclick: () => { if (favorite) FONT_STATE.favorites.delete(font.name); else FONT_STATE.favorites.add(font.name); draw(); } }, favorite ? '★' : '☆'),
          more),
        h('div', { class: 'fp-sample', style: `font-family: ${font.css}; font-size: ${FONT_STATE.size}px` }, o.text));
      row.addEventListener('contextmenu', (event) => { event.preventDefault(); menu(font, more); });
      return row;
    }));
    summary.textContent = !fonts.length && o.only ? (zh ? '没有能完整显示这段文字的字体，取消「只看能显示的」再看看' : 'No font can show all of this text. Uncheck “Only fonts that can show it” to see more.')
      : o.only ? (zh ? `${fonts.length} 种字体能完整显示这段文字` : `${fonts.length} fonts can show all of this text`) : (zh ? `${fonts.length} 种字体` : `${fonts.length} fonts`);
  }

  el = cardShell({ title: L(P.fontPreview.name), width: 480, children: [
    textInput,
    h('div', { class: 'fp-bar' }, h('span', { class: 'fp-a small' }, 'A'), sizeInput, h('span', { class: 'fp-a' }, 'A'), sizeLabel, h('span', { class: 'space' }), search),
    h('div', { class: 'fp-bar' }, seg, only),
    list,
    summary,
  ] });
  el.addEventListener('click', (event) => { if (!event.target.closest('.menu-pop, .fp-more')) el.querySelector('.menu-pop')?.remove(); });
  draw();
  presentCard(el, anchor);
}

// 字幕工具：示例字幕真的按选项处理（调时间、换帧率、清理、合成双语、转格式），预览跟着变；存好以后可以撤销
const SUBS = {
  'subs-zh': { format: 'srt', cues: [[5.2, 8.6, '大家好，欢迎来到今天的发布会'], [8.9, 12.4, '<i>先看一下这一年我们做了什么</i>'], [12.8, 16.1, '长按右键，圆盘就出来了'],
    [16.5, 19.8, '[掌声]'], [20.2, 23.6, '往一个方向划一下再松开，就能翻译、搜索、截图']] },
  'subs-en': { format: 'vtt', cues: [[5.3, 8.5, 'Hello everyone, welcome to today’s keynote.'], [8.9, 12.3, 'Let’s look back at what we did this year.'],
    [12.9, 16.0, 'Press and hold the right button to bring up the ring.'], [16.4, 19.9, '(APPLAUSE)'], [20.3, 23.5, 'Flick in one direction and let go to translate, search or take a screenshot.']] },
};
const SUB_RATES = [['none', { zh: '不换帧率', en: 'No change' }, 1], ['film23to25', '23.976 → 25', 23.976 / 25], ['pal25to23', '25 → 23.976', 25 / 23.976],
  ['film24to25', '24 → 25', 24 / 25], ['pal25to24', '25 → 24', 25 / 24]];
const SUB_OUTPUTS = [['srt', 'SRT'], ['vtt', 'WebVTT'], ['lrc', 'LRC'], ['txt', { zh: '纯文字', en: 'Plain Text' }]];
const SUB_TAGS = /<\/?[A-Za-z][^>\n]*>|<\d+:\d+(?:[.:]\d+)?>|\{[^}\n]*\}/g;
const SUB_NOTES = /\[[^\]\n]*\]|\([^)\n]*\)|（[^）\n]*）|【[^】\n]*】|♪[^♪\n]*♪/g;

function subTime(seconds, separator = ',') {
  const t = Math.max(0, Math.round(seconds * 1000));
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  return `${pad(Math.floor(t / 3600000))}:${pad(Math.floor(t / 60000) % 60)}:${pad(Math.floor(t / 1000) % 60)}${separator}${pad(t % 1000, 3)}`;
}

function subLyricTime(seconds) {
  const t = Math.max(0, Math.round(seconds * 100));
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(Math.floor(t / 6000))}:${pad(Math.floor(t / 100) % 60)}.${pad(t % 100)}`;
}

function subClean(cues, tags, notes) {
  if (!tags && !notes) return cues;
  return cues.map(([start, end, text]) => {
    let value = text;
    if (tags) value = value.replace(SUB_TAGS, '');
    if (notes) value = value.replace(SUB_NOTES, '');
    return [start, end, value.split('\n').map((line) => line.trim()).filter(Boolean).join('\n')];
  }).filter(([, , text]) => text);
}

function subRetime(cues, shift, factor) {
  return cues.map(([start, end, text]) => [start * factor + shift, end * factor + shift, text]).filter(([, end]) => end > 0)
    .map(([start, end, text]) => [Math.max(start, 0), end, text]);
}

function subMerge(first, second) {
  const overlap = (a, b) => Math.max(0, Math.min(a[1], b[1]) - Math.max(a[0], b[0]));
  const length = (c) => Math.max(c[1] - c[0], 0);
  const line = (text) => text.split('\n').map((part) => part.trim()).join(' ');
  const partners = new Map();
  const alone = [];
  for (const cue of second) {
    let best = -1;
    first.forEach((candidate, index) => { if (best < 0 || overlap(candidate, cue) > overlap(first[best], cue)) best = index; });
    if (best >= 0 && overlap(first[best], cue) > 0 && overlap(first[best], cue) >= Math.min(length(first[best]), length(cue)) * 0.3) {
      partners.set(best, (partners.get(best) || []).concat([cue]));
    } else {
      alone.push(cue);
    }
  }
  const merged = first.map((cue, index) => {
    const lower = (partners.get(index) || []).map((c) => line(c[2])).join(' ');
    return [cue[0], cue[1], lower ? `${line(cue[2])}\n${lower}` : line(cue[2])];
  }).concat(alone.map((c) => [c[0], c[1], line(c[2])]));
  return merged.sort((a, b) => a[0] - b[0]);
}

function subRender(cues, format) {
  if (format === 'vtt') return 'WEBVTT\n\n' + cues.map(([start, end, text]) => `${subTime(start, '.')} --> ${subTime(end, '.')}\n${text}\n`).join('\n');
  if (format === 'lrc') return cues.map(([start, , text]) => `[${subLyricTime(start)}]${text.replace(/\n/g, ' ')}`).join('\n') + '\n';
  if (format === 'txt') return cues.map(([, , text]) => text.replace(/\n/g, ' ')).join('\n') + '\n';
  return cues.map(([start, end, text], index) => `${index + 1}\n${subTime(start)} --> ${subTime(end)}\n${text}\n`).join('\n');
}

function subDuration(seconds) {
  const total = Math.round(seconds);
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

function showSubtitles(files, anchor) {
  const zh = lang === 'zh';
  const sources = files.filter((file) => SUBS[file.key]).slice(0, 2);
  if (!sources.length) return;
  const o = { shift: 0, rate: 'none', tags: false, notes: false, output: SUBS[sources[0].key].format === 'vtt' ? 'vtt' : 'srt', merge: sources.length === 2, top: 0, saved: null };
  const base = (file) => L(file.name).replace(/\.[^.]+$/, '');
  const processed = (file) => {
    const tags = o.tags || o.output === 'txt' || o.output === 'lrc';
    const factor = SUB_RATES.find(([id]) => id === o.rate)[2];
    return subRetime(subClean(SUBS[file.key].cues, tags, o.notes), o.shift, factor);
  };
  const merging = () => o.merge && sources.length === 2;
  const mergedName = () => {
    const a = base(sources[0]);
    const b = base(sources[1]);
    let common = '';
    while (common.length < Math.min(a.length, b.length) && a[common.length] === b[common.length]) common += a[common.length];
    common = common.replace(/[\s._\-（(]+$/, '');
    return `${common || a}${zh ? ' 双语' : ' bilingual'}`;
  };
  const outputs = () => {
    if (merging()) {
      const top = sources[o.top];
      const bottom = sources[1 - o.top];
      return [{ name: `${mergedName()}.${o.output}`, cues: subMerge(processed(top), processed(bottom)), replaces: null }];
    }
    return sources.map((file) => SUBS[file.key].format === o.output
      ? { name: L(file.name), cues: processed(file), replaces: file }
      : { name: `${base(file)}.${o.output}`, cues: processed(file), replaces: null });
  };
  const describe = (file) => {
    const cues = SUBS[file.key].cues;
    const format = SUBS[file.key].format === 'vtt' ? 'WebVTT' : SUBS[file.key].format.toUpperCase();
    return [format, zh ? `${cues.length} 句` : `${cues.length} lines`, `${subDuration(Math.min(...cues.map((c) => c[0])))} – ${subDuration(Math.max(...cues.map((c) => c[1])))}`, 'UTF-8'].join(' · ');
  };
  const number = (value) => String(Math.round(Math.abs(value) * 1000) / 1000);
  const shiftText = () => Math.abs(o.shift) < 0.0005 ? (zh ? '不调' : 'No shift')
    : o.shift > 0 ? (zh ? `推后 ${number(o.shift)} 秒` : `${number(o.shift)} s later`) : (zh ? `提前 ${number(o.shift)} 秒` : `${number(o.shift)} s earlier`);

  const preview = h('div', { class: 'sub-preview' });
  const shiftInput = h('input', { type: 'number', step: '0.1', value: '0', class: 'sub-num', 'aria-label': zh ? '提前或推后几秒' : 'Seconds to shift',
    oninput: () => { const value = parseFloat(shiftInput.value); o.shift = Number.isFinite(value) ? value : 0; changed(false); } });
  const shiftLabel = h('span', { class: 'sub-hint' });
  const step = (delta) => { o.shift = Math.round((o.shift + delta) * 1000) / 1000; shiftInput.value = String(o.shift); changed(false); };
  const rateSelect = h('select', { class: 'fe-select', 'aria-label': zh ? '帧率' : 'Frame Rate', onchange: () => { o.rate = rateSelect.value; changed(); } },
    SUB_RATES.map(([id, title]) => h('option', { value: id }, L(title))));
  const check = (key, label) => h('label', { class: 'sub-check' }, h('input', { type: 'checkbox', onchange: (event) => { o[key] = event.target.checked; changed(); } }), label);
  const topSelect = h('select', { class: 'fe-select', 'aria-label': zh ? '上面一行' : 'Top line', onchange: () => { o.top = Number(topSelect.value); changed(); } },
    sources.map((file, index) => h('option', { value: String(index) }, L(file.name))));
  const mergeBox = check('merge', zh ? '合成一份' : 'Merge into one');
  mergeBox.querySelector('input').checked = o.merge;
  const outputSeg = h('div', { class: 'seg', role: 'group' });
  const foot = h('div', { class: 'sub-foot' });

  function changed(redrawSeg = true) {
    o.saved = null;
    draw(redrawSeg);
  }

  function save() {
    const written = [];
    for (const item of outputs()) {
      if (item.replaces) {
        const before = SUBS[item.replaces.key].cues;
        SUBS[item.replaces.key].cues = item.cues;
        item.replaces.fresh = true;
        written.push({ name: item.name, undo: () => { SUBS[item.replaces.key].cues = before; item.replaces.fresh = false; } });
      } else {
        const key = `sub-${Date.now()}-${written.length}`;
        let name = item.name;
        const taken = () => FILES.concat(state.extraFiles).some((file) => L(file.name) === name);
        for (let n = 2; taken(); n += 1) name = item.name.replace(/(\.[^.]+)$/, ` ${n}$1`);
        SUBS[key] = { format: o.output === 'txt' ? 'txt' : o.output, cues: item.cues };
        const kind = o.output === 'txt' ? { subtitle: false, tag: 'TXT' } : { subtitle: o.output !== 'lrc', tag: o.output.toUpperCase() };
        state.extraFiles.push({ key, kind: 'textFile', subtitle: kind.subtitle, icon: 'text', tag: kind.tag, name: { zh: name, en: name }, fresh: true,
          info: [[{ zh: '种类', en: 'Kind' }, o.output.toUpperCase()], [{ zh: '修改时间', en: 'Modified' }, { zh: '刚刚', en: 'Just now' }]] });
        written.push({ name, key, undo: () => { state.extraFiles = state.extraFiles.filter((file) => file.key !== key); delete SUBS[key]; } });
      }
    }
    o.saved = written;
    renderWindow();
    draw(false);
  }

  function draw(redrawSeg = true) {
    shiftLabel.textContent = shiftText();
    const cues = (outputs()[0] || { cues: [] }).cues.slice(0, 4);
    preview.replaceChildren(...cues.map(([start, , text]) => h('div', null, h('code', null, subTime(start)), h('span', null, text))));
    if (redrawSeg) {
      outputSeg.replaceChildren(...SUB_OUTPUTS.map(([id, title]) => h('button', { type: 'button', 'data-id': id, 'aria-pressed': String(o.output === id),
        onclick: () => { o.output = id; changed(); } }, L(title))));
    }
    topSelect.disabled = !o.merge;
    if (o.saved) {
      const names = o.saved.map((item) => (zh ? `「${item.name}」` : `“${item.name}”`)).join(zh ? '、' : ', ');
      const replaced = o.saved.some((item) => !item.key);
      foot.replaceChildren(h('span', null, replaced ? (zh ? `改好了${names}，存成 UTF-8` : `Updated ${names} and saved it as UTF-8`) : (zh ? `存好了${names}` : `Saved ${names}`)),
        button(zh ? '撤销' : 'Undo', () => { for (const item of o.saved) item.undo(); o.saved = null; renderWindow(); draw(false); }),
        button(zh ? '完成' : 'Done', () => dismissCard(), { class: 'mbtn default' }));
    } else {
      const hint = merging() ? (zh ? '另存一份双语字幕' : 'Saves a new bilingual file')
        : outputs().every((item) => item.replaces) ? (zh ? '直接改原文件，可以撤销' : 'Changes the original file; you can undo')
          : (zh ? '另存一份，原文件不动' : 'Saves a copy; the original stays as it is');
      foot.replaceChildren(h('span', null, hint), button(zh ? '存好' : 'Save', save, { class: 'mbtn default' }));
    }
  }

  const rows = [
    [zh ? '时间' : 'Timing', h('div', null, button('−', () => step(-0.1), { 'aria-label': zh ? '提前 0.1 秒' : '0.1 s earlier' }), shiftInput,
      button('+', () => step(0.1), { 'aria-label': zh ? '推后 0.1 秒' : '0.1 s later' }), shiftLabel)],
    [zh ? '帧率' : 'Frame Rate', h('div', null, rateSelect)],
    [zh ? '清理' : 'Clean Up', h('div', null, check('tags', zh ? '去掉样式标签' : 'Remove style tags'), check('notes', zh ? '去掉听障说明' : 'Remove hearing-impaired descriptions'))],
  ];
  if (sources.length === 2) rows.push([zh ? '双语' : 'Bilingual', h('div', null, mergeBox, topSelect)]);
  rows.push([zh ? '存成' : 'Save As', h('div', null, outputSeg)]);
  const el = cardShell({ title: L(P.subtitles.name), subtitle: sources.length === 1 ? L(sources[0].name) : (zh ? '2 份字幕' : '2 subtitle files'), width: 460, children: [
    h('div', { class: 'sub-files' }, sources.map((file) => h('div', null, h('b', null, L(file.name)), h('span', null, describe(file))))),
    preview,
    h('div', { class: 'sub-grid' }, rows.flatMap(([label, control]) => [h('span', null, label), control])),
    foot,
  ] });
  draw();
  presentCard(el, anchor);
}

// 媒体信息：示例视频和录音的编码、画面、音轨（示例数据）；「发布会.mp4」是手机拍的，带着拍摄地点，可以去掉位置另存一份
function showMediaInfo(file, anchor) {
  const zh = lang === 'zh';
  const audioOnly = file.kind === 'audio';
  const original = file.key === 'video';
  const small = /720p/.test(L(file.name));
  const head = audioOnly ? ['M4A', '32:10', '18.6 MB', '77 kbps']
    : [L(file.name).toLowerCase().endsWith('.mov') ? 'QuickTime' : 'MP4', '12:48', small ? '112 MB' : '248 MB', small ? '1.2 Mbps' : '2.6 Mbps'];
  const sections = [];
  if (!audioOnly) {
    sections.push([{ zh: '视频', en: 'Video' }, [
      [{ zh: '编码格式', en: 'Codec' }, 'H.264'],
      [{ zh: '画面', en: 'Picture' }, small ? '1280 × 720 · 720p' : '1920 × 1080 · 1080p'],
      [{ zh: '帧率', en: 'Frame Rate' }, { zh: '30 帧/秒', en: '30 fps' }],
      [{ zh: '码率', en: 'Bit Rate' }, small ? '1.1 Mbps' : '2.4 Mbps'],
      [{ zh: '动态范围', en: 'Dynamic Range' }, 'SDR'],
      [{ zh: '色彩', en: 'Color' }, { zh: 'BT.709 · 8 位', en: 'BT.709 · 8-bit' }],
    ]]);
  }
  sections.push([{ zh: '音频', en: 'Audio' }, [
    [{ zh: '编码格式', en: 'Codec' }, 'AAC'],
    [{ zh: '声道', en: 'Channels' }, audioOnly ? { zh: '单声道 · 48 kHz', en: 'Mono · 48 kHz' } : { zh: '立体声 · 48 kHz', en: 'Stereo · 48 kHz' }],
    [{ zh: '码率', en: 'Bit Rate' }, audioOnly ? '64 kbps' : '128 kbps'],
  ]]);
  if (original) {
    sections.push([{ zh: '信息', en: 'Details' }, [
      [{ zh: '设备', en: 'Device' }, 'Apple iPhone 16 Pro'],
      [{ zh: '拍摄时间', en: 'Taken' }, '2026-08-30 19:00'],
      [{ zh: '拍摄地点', en: 'Location' }, '31.2397, 121.4998', true],
    ]]);
  } else if (file.key === 'audio') {
    sections.push([{ zh: '信息', en: 'Details' }, [[{ zh: '创建时间', en: 'Created' }, '2026-09-29 15:48']]]);
  }
  const headline = head.join(' · ');
  const text = [L(file.name), headline].concat(sections.map(([title, list]) => `${L(title)}${zh ? '：' : ': '}${list.map(([label, value]) => `${L(label)} ${L(value)}`).join(' · ')}`)).join('\n');
  const thumb = fileIcon(file.icon, file.tag);
  thumb.classList.add('un-icon');
  const children = [
    h('div', { class: 'un-head' }, thumb, h('div', { class: 'un-name' }, h('b', null, L(file.name)), h('span', { class: 'mi-head' }, headline))),
    h('div', { class: 'mi-list' }, sections.map(([title, list]) => h('div', { class: 'mi-sec' }, h('span', null, L(title)),
      h('div', { class: 'ai-grid' }, list.flatMap(([label, value, warn]) => [h('span', null, L(label)), h('b', { class: warn ? 'warn' : null }, L(value))]))))),
  ];
  if (original) {
    children.push(h('div', { class: 'mi-note' }, h('span', null, zh ? '这个文件里记着拍摄地点，发给别人前可以去掉' : 'This file records where it was shot. You can remove the location before sharing it.'),
      h('div', null,
        button(zh ? '在地图中查看' : 'Show in Maps', () => showToast(L(T.onlyInApp(zh ? '在地图中查看' : 'Show in Maps')), anchor)),
        button(zh ? '去掉位置另存一份' : 'Save a Copy Without Location', () => {
          showToast(zh ? '正在另存…' : 'Saving a copy…', anchor);
          setTimeout(() => addOutputFile(file, { suffix: zh ? ' 无位置' : ' without location', ext: 'mp4', icon: 'video', kind: 'video' }, anchor,
            (name) => L({ zh: `已另存为「${name}」，画面和声音没有重新编码`, en: `Saved as “${name}”. The video and sound weren’t re-encoded.` })), 1000);
        }))));
  }
  const el = cardShell({ title: L(P.mediaInfo.name), subtitle: L(file.name), width: 440, children, buttons: [
    button(zh ? '在访达中显示' : 'Show in Finder', () => dismissCard()),
    button(zh ? '复制信息' : 'Copy Info', () => copyText(text, zh ? '已复制' : 'Copied', anchor), { class: 'mbtn default' }),
  ] });
  presentCard(el, anchor);
}

// App 信息：示例 App 的芯片、签名、公证……（示例数据，和 App 里 CI 截图用的一样）
function showAppInfo(anchor) {

  const rows = [
    [{ zh: '芯片', en: 'Architecture' }, { zh: '通用（Apple 芯片和 Intel）', en: 'Universal (Apple silicon and Intel)' }],
    [{ zh: '最低系统', en: 'Minimum macOS' }, 'macOS 12.0'],
    [{ zh: '签名', en: 'Signature' }, { zh: 'Developer ID：Example Studio（ABCDE12345）', en: 'Developer ID: Example Studio (ABCDE12345)' }],
    [{ zh: '公证', en: 'Notarization' }, { zh: '已公证', en: 'Notarized' }],
    [{ zh: '沙盒', en: 'Sandbox' }, { zh: '不在沙盒里', en: 'Not sandboxed' }],

// 朗读存成音频：先提示正在存，再按字数估个长度（中文一秒四个字，外文一秒两个半词），提示存进「下载」的文件名
function speakToFile(text, anchor) {
  const zh = lang === 'zh';
  const clean = (text || '').replace(/\s+/g, ' ').trim();
  const head = clean.length > 12 ? `${clean.slice(0, 12).trim()}…` : clean;
  const name = `${zh ? '朗读' : 'Speech'} ${head}.m4a`;
  const han = (clean.match(/[㐀-鿿]/g) || []).length;
  const words = clean.replace(/[㐀-鿿]/g, ' ').split(/\s+/).filter(Boolean).length;
  const seconds = Math.max(1, Math.round(han / 4 + words / 2.5));
  const length = seconds < 60 ? (zh ? `${seconds} 秒` : `${seconds} s`) : (zh ? `${Math.floor(seconds / 60)} 分 ${seconds % 60} 秒` : `${Math.floor(seconds / 60)} min ${seconds % 60} s`);
  showToast(zh ? '正在存成音频…' : 'Saving as audio…', anchor);
  setTimeout(() => showToast(zh ? `存好了「${name}」，长 ${length}` : `Saved “${name}” (${length} long)`, anchor), 1200);
}

const SIMILAR = {

function drawBeach(ctx, sun, shift) {
  const sky = ctx.createLinearGradient(0, 0, 0, 100);
  sky.addColorStop(0, '#ffb36b'); sky.addColorStop(1, '#7a8cff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, 160, 100);
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(85 + shift, 160 - 160 * sun - 15, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#29459e'; ctx.fillRect(0, 100, 160, 60);
}

function drawCat(ctx) {
  ctx.fillStyle = '#ede6d6'; ctx.fillRect(0, 0, 160, 160);
  ctx.fillStyle = '#f29a40';
  ctx.beginPath(); ctx.ellipse(80, 92, 45, 42, 0, 0, Math.PI * 2); ctx.fill();
  for (const x of [42, 92]) { ctx.beginPath(); ctx.moveTo(x, 65); ctx.lineTo(x + 13, 25); ctx.lineTo(x + 26, 65); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = '#262626';
  ctx.beginPath(); ctx.ellipse(64, 84, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(96, 84, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
}
