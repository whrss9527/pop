<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop 试玩</title>
<style>
/* 布局：一行介绍和开关，下面是一整块能点的 Mac 桌面；桌面里的圆盘、卡片按 App 的尺寸和动画参数还原 */
:root {
  --page: #f1f2f8;
  --surface: #ffffff;
  --ink: #161927;
  --ink-2: #5a6074;
  --line: rgba(22, 25, 39, .12);
  --chip: rgba(22, 25, 39, .06);
  --brand: #5668ff;
  --brand-ink: #ffffff;

  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, .2);
  --label: rgba(0, 0, 0, .86);
  --label-2: rgba(60, 60, 67, .66);
  --label-3: rgba(60, 60, 67, .34);
  --fill: rgba(120, 120, 128, .16);
  --fill-2: rgba(120, 120, 128, .09);
  --hover: rgba(0, 0, 0, .05);
  --sep: rgba(60, 60, 67, .16);
  --btn: rgba(255, 255, 255, .72);
  --btn-hover: rgba(255, 255, 255, .92);
  --btn-press: rgba(225, 225, 232, .9);
  --btn-stroke: rgba(0, 0, 0, .12);
  --field: rgba(255, 255, 255, .78);
  --field-stroke: rgba(0, 0, 0, .16);
  --glass: rgba(246, 246, 250, .6);
  --sheen-top: rgba(255, 255, 255, .22);
  --sheen-bottom: rgba(255, 255, 255, .02);
  --glass-hi: rgba(255, 255, 255, .8);
  --glass-lo: rgba(255, 255, 255, .1);
  --glass-stroke: rgba(0, 0, 0, .12);
  --glass-shadow: 0 10px 30px rgba(16, 20, 44, .24), 0 2px 6px rgba(16, 20, 44, .1);
  --hub-fill: rgba(0, 0, 0, .045);
  --hub-stroke: rgba(0, 0, 0, .1);
  --win: #ffffff;
  --win-bar: #f4f4f7;
  --win-side: #ececf1;
  --win-text: #1d1d1f;
  --win-text-2: #6e6e73;
  --menubar: rgba(255, 255, 255, .46);
  --menubar-ink: #111114;
  --sel: #b3d7ff;
  --note-on: rgba(255, 199, 0, .38);
  --pin-bg: #fffdf5;
  --pin-ink: #1d1d1f;
  --rec: #ff3b30;
  --wall-mode: light;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --serif: "New York", "Iowan Old Style", "Palatino Linotype", Georgia, "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0e14; --surface: #252733; --ink: #eceef7; --ink-2: #9ca2b6; --line: rgba(236, 238, 247, .14); --chip: rgba(236, 238, 247, .08);
    --brand: #7f8cff; --brand-ink: #0d0e14;
    --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, .26); --label: rgba(255, 255, 255, .9); --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
    --fill: rgba(120, 120, 128, .34); --fill-2: rgba(120, 120, 128, .2); --hover: rgba(255, 255, 255, .07); --sep: rgba(84, 84, 88, .6);
    --btn: rgba(255, 255, 255, .14); --btn-hover: rgba(255, 255, 255, .2); --btn-press: rgba(255, 255, 255, .1); --btn-stroke: rgba(255, 255, 255, .08);
    --field: rgba(0, 0, 0, .22); --field-stroke: rgba(255, 255, 255, .14);
    --glass: rgba(38, 38, 44, .6); --sheen-top: rgba(255, 255, 255, .08); --sheen-bottom: rgba(255, 255, 255, 0); --glass-hi: rgba(255, 255, 255, .34); --glass-lo: rgba(255, 255, 255, .04); --glass-stroke: rgba(0, 0, 0, .5);
    --glass-shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --hub-fill: rgba(255, 255, 255, .06); --hub-stroke: rgba(255, 255, 255, .12);
    --win: #1e1e21; --win-bar: #2a2a2e; --win-side: #252528; --win-text: #f2f2f7; --win-text-2: #98989f;
    --menubar: rgba(18, 18, 24, .42); --menubar-ink: #f5f5f7; --sel: #3f638b; --note-on: rgba(255, 199, 0, .3);
    --pin-bg: #2c2c30; --pin-ink: #f2f2f7; --rec: #ff453a; --wall-mode: dark;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0e14; --surface: #252733; --ink: #eceef7; --ink-2: #9ca2b6; --line: rgba(236, 238, 247, .14); --chip: rgba(236, 238, 247, .08);
  --brand: #7f8cff; --brand-ink: #0d0e14;
  --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, .26); --label: rgba(255, 255, 255, .9); --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
  --fill: rgba(120, 120, 128, .34); --fill-2: rgba(120, 120, 128, .2); --hover: rgba(255, 255, 255, .07); --sep: rgba(84, 84, 88, .6);
  --btn: rgba(255, 255, 255, .14); --btn-hover: rgba(255, 255, 255, .2); --btn-press: rgba(255, 255, 255, .1); --btn-stroke: rgba(255, 255, 255, .08);
  --field: rgba(0, 0, 0, .22); --field-stroke: rgba(255, 255, 255, .14);
  --glass: rgba(38, 38, 44, .6); --sheen-top: rgba(255, 255, 255, .08); --sheen-bottom: rgba(255, 255, 255, 0); --glass-hi: rgba(255, 255, 255, .34); --glass-lo: rgba(255, 255, 255, .04); --glass-stroke: rgba(0, 0, 0, .5);
  --glass-shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --hub-fill: rgba(255, 255, 255, .06); --hub-stroke: rgba(255, 255, 255, .12);
  --win: #1e1e21; --win-bar: #2a2a2e; --win-side: #252528; --win-text: #f2f2f7; --win-text-2: #98989f;
  --menubar: rgba(18, 18, 24, .42); --menubar-ink: #f5f5f7; --sel: #3f638b; --note-on: rgba(255, 199, 0, .3);
  --pin-bg: #2c2c30; --pin-ink: #f2f2f7; --rec: #ff453a; --wall-mode: dark;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.page { max-width: 1140px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 30px; display: flex; flex-direction: column; gap: 14px; }
.intro { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.intro .logo { width: 46px; height: 46px; flex: none; }
.intro .text { flex: 1; min-width: 220px; }
.intro h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 750; letter-spacing: -.01em; text-wrap: balance; }
.intro h1 span { color: var(--ink-2); font-weight: 500; margin-left: 8px; font-size: 15px; letter-spacing: 0; }
.intro p { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 64ch; }
.switch { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 2px; }
.switch button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font-size: 12.5px; padding: 4px 11px; border-radius: 7px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.switch button:focus-visible, .scenes button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.scenes { display: flex; gap: 6px; flex-wrap: wrap; }
.scenes button { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; padding: 5px 12px 5px 9px; border-radius: 999px; cursor: pointer; }
.scenes button svg { width: 16px; height: 16px; color: var(--ink-2); }
.scenes button[aria-selected="true"] { background: var(--brand); border-color: transparent; color: var(--brand-ink); }
.scenes button[aria-selected="true"] svg { color: currentColor; }

.hint { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-2); }
.hint b { color: var(--ink); font-weight: 600; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 12px; }
.foot a { color: var(--brand); text-decoration: none; font-weight: 600; }
.foot a:hover { text-decoration: underline; }
.foot .blurb { flex: 1; min-width: 240px; }

/* ---------- 桌面 ---------- */
.stage { position: relative; height: clamp(560px, 62vw, 690px); border-radius: 16px; overflow: hidden; isolation: isolate; background: #9aa8e8; color: var(--label);
  box-shadow: 0 22px 56px -16px rgba(18, 22, 60, .38), 0 0 0 1px var(--line); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; cursor: default; outline: none; }
.stage:focus-visible { box-shadow: 0 0 0 3px var(--brand), 0 22px 56px -16px rgba(18, 22, 60, .38); }
.stage canvas.wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px; font-size: 12.5px; color: var(--menubar-ink); background: var(--menubar);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); z-index: 3; white-space: nowrap; }
.menubar .app { font-weight: 700; }
.menubar .menus { display: flex; gap: 18px; overflow: hidden; }
.menubar .right { margin-left: auto; display: flex; gap: 13px; align-items: center; }
.menubar svg { width: 15px; height: 15px; display: block; }
.menubar .pop-status { width: 16px; height: 16px; }
@media (max-width: 720px) { .menubar .menus { display: none; } }

.desk { position: absolute; right: 16px; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 1; transition: opacity .35s ease; }
.desk.hidden { opacity: 0; pointer-events: none; }
.desk .item { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; line-height: 1.25; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); transition: opacity .4s ease, transform .4s ease; }
.desk .item.gone { opacity: 0; transform: scale(.6); }
.desk .item .thumb { width: 52px; height: 52px; }

.win { position: absolute; left: clamp(12px, 5%, 64px); right: clamp(12px, 15%, 190px); top: 44px; bottom: 24px; background: var(--win); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; z-index: 2; color: var(--win-text);
  box-shadow: 0 24px 54px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .28); }
.win .bar { height: 46px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--win-bar); border-bottom: 1px solid var(--sep); }
.lights { display: flex; gap: 8px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.bar .nav { display: flex; gap: 14px; color: var(--win-text-2); flex: none; }
.bar .nav svg { width: 15px; height: 15px; display: block; }
.bar .title { font-size: 13px; font-weight: 600; flex: none; }
.addr { flex: 1; min-width: 0; height: 28px; border-radius: 8px; background: var(--fill-2); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--win-text-2); white-space: nowrap; overflow: hidden; padding: 0 10px; }
.addr span { overflow: hidden; text-overflow: ellipsis; }
.win .content { flex: 1; min-height: 0; overflow: hidden; position: relative; }

.article { max-width: 620px; margin: 0 auto; padding: 34px 30px; font-family: var(--serif); font-size: 17px; line-height: 1.7; }
.article h2 { font: 700 28px/1.2 var(--font); margin: 0 0 6px; letter-spacing: -.012em; text-wrap: balance; }
.article .meta { font: 13px/1.4 var(--font); color: var(--win-text-2); margin-bottom: 20px; }
.article p { margin: 0 0 14px; }
.sel { background: var(--sel); border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.notes { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); height: 100%; }
.notes .side { background: var(--win-side); border-right: 1px solid var(--sep); padding: 12px 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.note-item { padding: 8px 10px; border-radius: 8px; }
.note-item b { display: block; font-size: 13px; }
.note-item span { color: var(--win-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.note-item.on { background: var(--note-on); }
.note { padding: 22px 28px; font-size: 14.5px; line-height: 1.75; overflow: hidden; }
.note h3 { margin: 0 0 8px; font-size: 20px; }
.note p { margin: 0 0 8px; }
.note .url { word-break: break-all; }
@media (max-width: 720px) { .notes { grid-template-columns: 1fr; } .notes .side { display: none; } }

.finder { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); height: 100%; }
.finder .side { background: var(--win-side); border-right: 1px solid var(--sep); padding: 12px 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 1px; }
.finder .side .h { font-size: 11px; font-weight: 600; color: var(--win-text-2); padding: 4px 10px; }
.finder .side .it { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; }
.finder .side .it svg { width: 15px; height: 15px; color: var(--accent); }
.finder .side .it.on { background: var(--fill); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px 6px; padding: 18px; align-content: start; overflow: hidden; }
.file { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; font-size: 12px; line-height: 1.3; text-align: center; }
.file .thumb { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; }
.file .name { max-width: 92px; padding: 1px 5px; border-radius: 5px; word-break: break-all; }
.file.on .thumb { background: var(--fill); }
.file.on .name { background: var(--accent); color: #fff; }
.file.fresh { animation: fresh .5s cubic-bezier(.2, .9, .3, 1.2); }
/* 隐藏文件淡一些，和访达里一样 */
.file.hidden-file .thumb, .file.hidden-file .name { opacity: .5; }
.finder-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.finder-main .files { flex: 1; min-height: 0; }
.statusbar { flex: none; font-size: 11px; color: var(--win-text-2); padding: 6px 14px; border-top: 1px solid var(--sep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes fresh { from { opacity: 0; transform: scale(.6); } }
@media (max-width: 720px) { .finder { grid-template-columns: 1fr; } .finder .side { display: none; } }

/* 文件图标 */
.fi { position: relative; width: 48px; height: 58px; }
.fi.doc { background: #fff; border-radius: 3px 12px 3px 3px; box-shadow: 0 1px 3px rgba(0, 0, 0, .25), inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.fi.doc::after { content: ""; position: absolute; right: 0; top: 0; width: 12px; height: 12px; background: linear-gradient(225deg, transparent 50%, #dcdce2 50%); border-radius: 0 12px 0 3px; }
.fi.doc .tag { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font: 700 9px/1 var(--font); color: #fff; padding: 2px 4px; border-radius: 3px; letter-spacing: .02em; }
.fi.doc .wave { position: absolute; inset: 14px 9px 22px; display: flex; align-items: center; gap: 2px; }
.fi.doc .wave i { flex: 1; background: #8e8e93; border-radius: 1px; }
.fi.photo { width: 58px; height: 44px; border-radius: 3px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); background: linear-gradient(180deg, #ffb36b 0%, #ff8a7a 34%, #7a8cff 58%, #3553c9 60%, #2a3f8f 100%); overflow: hidden; }
.fi.photo::after { content: ""; position: absolute; left: 50%; top: 42%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #fff3c4; box-shadow: 0 0 10px #ffe08a; }
.fi.video { width: 58px; height: 40px; border-radius: 4px; background: linear-gradient(135deg, #2c2c34, #111); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); display: grid; place-items: center; }
.fi.video::before { content: ""; border-left: 12px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px; }
.fi.video .strip { position: absolute; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(90deg, #fff 0 3px, transparent 3px 7px); opacity: .5; }
.fi.video .strip.t { top: 2px; } .fi.video .strip.b { bottom: 2px; }
.fi.shot { width: 44px; height: 58px; border-radius: 6px; background: #f2f2f7; box-shadow: 0 1px 3px rgba(0, 0, 0, .3), inset 0 0 0 .5px rgba(0, 0, 0, .15); display: flex; flex-direction: column; gap: 5px; padding: 9px 5px; }
.fi.shot i { display: block; height: 7px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12); width: 70%; }
.fi.shot i:nth-child(2) { align-self: flex-end; background: #0a84ff; width: 62%; }
.fi.folder { width: 60px; height: 46px; }
.fi.folder::before { content: ""; position: absolute; left: 0; top: 0; width: 26px; height: 10px; background: #5aa9f4; border-radius: 4px 4px 0 0; }
.fi.folder::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; bottom: 0; background: linear-gradient(#7cc1ff, #4a9ff0); border-radius: 3px 5px 5px 5px; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.fi.disk { width: 54px; height: 40px; border-radius: 7px; background: linear-gradient(#f4f4f6, #c9c9cf); box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 -3px 0 rgba(0, 0, 0, .1); }
.fi.disk::after { content: ""; position: absolute; right: 8px; bottom: 9px; width: 5px; height: 5px; border-radius: 50%; background: #34c759; }

/* ---------- 浮层 ---------- */
.layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.layer > * { pointer-events: auto; }
.layer > .ring, .layer > .rec-frame, .layer > .click-dot, .layer > .loupe { pointer-events: none; }

.glass { position: relative; background: linear-gradient(180deg, var(--sheen-top), var(--sheen-bottom)), var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-stroke); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, var(--glass-hi), var(--glass-lo) 58%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.ring { position: absolute; left: 0; top: 0; }
.ring .disc { position: absolute; inset: 0; border-radius: 50%; }
.ring .hl { position: absolute; inset: 0; overflow: visible; }
.slot { position: absolute; left: 50%; top: 50%; width: 66px; height: 40px; margin: -20px 0 0 -33px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--label); transition: color .18s ease; }
.slot svg { width: 21px; height: 22px; flex: none; }
.slot .n { font-size: 10.5px; line-height: 13px; max-width: 66px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.active { color: var(--accent); }
.slot.active .n { font-weight: 600; }
.slot .empty { width: 5px; height: 5px; border-radius: 50%; background: var(--label-3); margin-top: 17px; }
.hub { position: absolute; left: 50%; top: 50%; border-radius: 50%; background: var(--hub-fill); box-shadow: inset 0 0 0 1px var(--hub-stroke); }
.hub svg { position: absolute; inset: 0; overflow: visible; }
.hub .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 5px; }
.hub .t { font-size: 10px; font-weight: 500; line-height: 1.25; color: var(--label-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.hub .t.fn { font-size: 11px; font-weight: 600; color: var(--accent); }
.hub .t.fn.off { color: var(--label-2); }
.hub .d { font-size: 9px; line-height: 1.2; color: var(--label-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hub .label.swap { animation: swap .2s ease-out; }
@keyframes swap { from { opacity: .2; } }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--label-3); border-top-color: var(--label-2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.card { position: absolute; left: 0; top: 0; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; color: var(--label); font-size: 13px; line-height: 1.4; cursor: default; }
.card-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card-head b { font-size: 13px; font-weight: 700; white-space: nowrap; }
.card-head .sub { font-size: 10.5px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

// 顶上的图标：一圈 8 格，最上面那格最亮
(() => {
  const ring = $('#logo-ring');
  for (let i = 0; i < 8; i++) {
    const a0 = (-90 - 22.5 + i * 45 + 3) * Math.PI / 180;
    const a1 = (-90 + 22.5 + i * 45 - 3) * Math.PI / 180;
    const r0 = 10, r1 = 22;
    const p = (r, a) => `${32 + r * Math.cos(a)} ${32 + r * Math.sin(a)}`;
    ring.append(s('path', { d: `M${p(r0, a0)} L${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)}Z`, opacity: i === 0 ? '1' : '.42' }));
  }
})();

const easeIn = (p) => p * p;
const easeOut = (p) => 1 - (1 - p) * (1 - p);

const running = new Set();
const dirty = new Set();
let frame = 0;
let lastTime = 0;

// 一个会动的数：弹簧（和 SwiftUI 的 spring(response:dampingFraction:) 一样）或者定时的缓动
class Anim {
  constructor(value, owner) { this.value = value; this.target = value; this.velocity = 0; this.owner = owner; this.kind = null; }
  spring(target, [response, damping], delay = 0) {
    this.kind = 'spring'; this.target = target; this.delay = delay;
    this.k = (2 * Math.PI / response) ** 2; this.c = 4 * Math.PI * damping / response;
    this.eps = Math.max(Math.abs(target - this.value) * 0.0008, 0.0004);
    start(this);
    return this;
  }
  tween(target, duration, ease = easeOut, delay = 0) {
    this.kind = 'tween'; this.from = this.value; this.target = target; this.duration = Math.max(duration, 0.001); this.elapsed = 0; this.ease = ease; this.delay = delay; this.velocity = 0;
    start(this);
    return this;
  }
  set(value) { this.value = value; this.target = value; this.velocity = 0; this.kind = null; running.delete(this); if (this.owner) dirty.add(this.owner); return this; }
  step(dt) {
    if (this.delay > 0) { this.delay -= dt; if (this.delay > 0) return true; dt = -this.delay; this.delay = 0; }
    if (this.kind === 'tween') {
      this.elapsed += dt;
      const p = Math.min(this.elapsed / this.duration, 1);
      this.value = this.from + (this.target - this.from) * this.ease(p);
      return p < 1;
    }
    let left = dt;
    while (left > 0) {
      const step = Math.min(left, 1 / 600);
      const acceleration = -this.k * (this.value - this.target) - this.c * this.velocity;
      this.velocity += acceleration * step;
      this.value += this.velocity * step;
      left -= step;
    }
    if (Math.abs(this.value - this.target) < this.eps && Math.abs(this.velocity) < this.eps * 12) {
      this.value = this.target; this.velocity = 0;
      return false;
    }
    return true;
  }
}

function start(anim) {
  running.add(anim);
  if (anim.owner) dirty.add(anim.owner);
  if (!frame) { lastTime = performance.now(); frame = requestAnimationFrame(tick); }

function tick(now) {

  frame = running.size ? requestAnimationFrame(tick) : 0;
}

function loadInstalled() {
  try {
    const saved = JSON.parse(localStorage.getItem('pop-demo-plugins') || 'null');
    if (Array.isArray(saved)) return new Set(saved.filter((id) => PACKAGES.some((pkg) => pkg.id === id)));
  } catch (error) { /* 读不到就用默认的 */ }
  return new Set(DEFAULT_INSTALLED);
}

function saveInstalled() {
  try { localStorage.setItem('pop-demo-plugins', JSON.stringify([...state.installed])); } catch (error) { /* 存不了就只管这一次 */ }
}

  return !pkg || state.installed.has(pkg.id);
}

// 系统操作里的「换成深色/浅色模式」：演示里换的是这个页面
function setTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
}

function isDark() {
  return getComputedStyle(document.documentElement).getPropertyValue('--wall-mode').trim() === 'dark';
}

// 壁纸画在画布上：取色时直接从这里读像素
const WALLS = {
  light: { base: '#dfe5fb', blobs: [[0.12, 0.18, 0.75, '#9fb4ff'], [0.88, 0.12, 0.62, '#f7b3d9'], [0.72, 0.95, 0.72, '#a6e6dc'], [0.18, 0.96, 0.6, '#c3b2ff'], [0.52, 0.45, 0.35, '#e9ecff']] },
  dark: { base: '#10122a', blobs: [[0.12, 0.18, 0.75, '#2b3a9c'], [0.88, 0.12, 0.62, '#6a2a72'], [0.72, 0.95, 0.72, '#0e5a61'], [0.18, 0.96, 0.6, '#3c2a88'], [0.52, 0.45, 0.35, '#1b1f4a']] },
};

function drawWall() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const width = stage.clientWidth, height = stage.clientHeight;
  wall.width = Math.round(width * ratio); wall.height = Math.round(height * ratio);
  const ctx = wall.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  const theme = WALLS[isDark() ? 'dark' : 'light'];
  ctx.fillStyle = theme.base;
  ctx.fillRect(0, 0, width, height);
  const size = Math.max(width, height);
  for (const [x, y, r, color] of theme.blobs) {
    const gradient = ctx.createRadialGradient(x * width, y * height, 0, x * width, y * height, r * size);
    gradient.addColorStop(0, color);
    gradient.addColorStop(1, color + '00');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }
}

function wallColorAt(x, y) {
  const ratio = wall.width / Math.max(stage.clientWidth, 1);
  const px = clamp(Math.round(x * ratio), 0, wall.width - 1), py = clamp(Math.round(y * ratio), 0, wall.height - 1);
  const data = wall.getContext('2d', { willReadFrequently: true }).getImageData(px, py, 1, 1).data;
  return [data[0], data[1], data[2]];
}

  switch (state.scene) {

      const text = ARTICLE[lang].selected;

      if (/[A-Za-z]/.test(text)) kinds.push('latin');

    case 'link':
      return { kinds: ['text', 'url', 'latin'], text: LINK.url, summary: L(T.linkKind) };
    case 'files': {
      const files = selectedFiles();
      const file = files[0];
      if (files.length === 1) return { kinds: ['files', file.kind], file, files, summary: L(file.name) };
      const kinds = ['files'];
      if (files.length === 2 && files.every((f) => f.kind === 'textFile')) kinds.push('twoTextFiles');
      if (files.length === 2 && files.every((f) => f.kind === 'imageFile')) kinds.push('twoImageFiles');

// ---------- 圆盘 ----------
class Ring {
  constructor(x, y, mode, content) {
    this.mode = mode;
    this.content = content;
    this.count = LAYOUT.length;
    this.inner = 38;
    this.outer = 124 + Math.max(this.count - 8, 0) * 12;
    this.labelR = (this.inner + this.outer) / 2;
    this.stepRad = 2 * Math.PI / this.count;
    this.hlR = Math.max(Math.min(2 * this.labelR * Math.sin(this.stepRad / 2) * 0.47, (this.outer - this.inner) / 2 - 4), 12);
    this.span = Math.min(360 / this.count * 0.62, 42);
    this.hovered = null;
    this.committed = null;
    this.loading = true;
    this.phase = 'entering';
    const width = stage.clientWidth, height = stage.clientHeight, margin = this.outer + 6;
    this.cx = width < margin * 2 ? width / 2 : clamp(x, margin, width - margin);
    this.cy = height - MENUBAR < margin * 2 ? (height + MENUBAR) / 2 : clamp(y, MENUBAR + margin, height - margin);
    this.anchor = { x, y };
    this.slots = LAYOUT.map((id, index) => ({ id, index, info: P[id], enabled: false }));
    this.build();
    this.open();
    // App 里读取选中内容要一小会儿，读到之前格子是半透明的
    this.loadTimer = setTimeout(() => this.loaded(), 160);
  }

  build() {
    const d = this.outer * 2;
    this.el = h('div', { class: 'ring', style: `width:${d}px;height:${d}px;transform:translate(${this.cx - this.outer}px,${this.cy - this.outer}px)` });
    this.disc = h('div', { class: 'disc glass' });
    const svg = s('svg', { class: 'hl', viewBox: `0 0 ${d} ${d}`, width: d, height: d });
    const defs = s('defs');
    const filter = s('filter', { id: 'ring-glow', x: '-50%', y: '-50%', width: '200%', height: '200%' });
    filter.append(s('feGaussianBlur', { stdDeviation: '2.6' }));
    defs.append(filter);
    svg.append(defs);
    this.hlGroup = s('g');
    const c = this.outer;
    this.hlFill = s('circle', { cx: c + this.labelR, cy: c, r: this.hlR });
    this.hlStroke = s('circle', { cx: c + this.labelR, cy: c, r: this.hlR, fill: 'none', 'stroke-width': '1' });
    const R = this.outer - 5, half = this.span / 2 * Math.PI / 180;
    const arc = `M${c + R * Math.cos(-half)} ${c + R * Math.sin(-half)} A${R} ${R} 0 0 1 ${c + R * Math.cos(half)} ${c + R * Math.sin(half)}`;
    this.arcGlow = s('path', { d: arc, fill: 'none', 'stroke-width': '4', 'stroke-linecap': 'round', filter: 'url(#ring-glow)' });
    this.arc = s('path', { d: arc, fill: 'none', 'stroke-width': '3', 'stroke-linecap': 'round' });
    this.hlGroup.append(this.hlFill, this.hlStroke, this.arcGlow, this.arc);
    svg.append(this.hlGroup);
    this.hlSvg = svg;
    this.slotEls = this.slots.map((slot) => {
      const angle = Math.PI / 2 - slot.index * this.stepRad;
      slot.dx = Math.cos(angle) * this.labelR;
      slot.dy = -Math.sin(angle) * this.labelR;
      return h('div', { class: 'slot' }, slot.info ? [icon(slot.info.icon), h('span', { class: 'n' }, L(slot.info.name))] : h('span', { class: 'empty' }));
    });
    const hubD = this.inner * 2 - 4;
    this.hubD = hubD;
    this.hub = h('div', { class: 'hub', style: `width:${hubD}px;height:${hubD}px;margin:${-hubD / 2}px 0 0 ${-hubD / 2}px` });
    const hubSvg = s('svg', { viewBox: `0 0 ${hubD} ${hubD}`, width: hubD, height: hubD });
    this.dotGroup = s('g');
    this.dot = s('circle', { cx: hubD / 2 + hubD / 2 - 6, cy: hubD / 2, r: 2.5 });
    this.dotGroup.append(this.dot);
    hubSvg.append(this.dotGroup);
    this.label = h('div', { class: 'label' });
    this.hub.append(hubSvg, this.label);
    this.el.append(this.disc, svg, ...this.slotEls, this.hub);
    layer.append(this.el);

    this.a = {
      disc: new Anim(reduced() ? 1 : 0.3, this), discO: new Anim(0, this), hub: new Anim(reduced() ? 1 : 0.5, this), hubO: new Anim(0, this),
      angle: new Anim(-90, this), hl: new Anim(0, this),
      slots: this.slots.map(() => ({ reach: new Anim(reduced() ? 1 : 0.12, this), scale: new Anim(reduced() ? 1 : 0.55, this), o: new Anim(0, this), act: new Anim(1, this), vis: new Anim(0.45, this) })),
    };
    this.updateLabel(false);
    this.updateColors();
    this.render();
  }

  open() {
    this.phase = 'shown';
    const a = this.a;
    a.disc.spring(1, M.ringOpen);
    a.discO.spring(1, M.ringOpen);
    a.hub.spring(1, M.ringOpen, 0.04);
    a.hubO.spring(1, M.ringOpen, 0.04);
    a.slots.forEach((slot, i) => {
      const delay = reduced() ? 0 : i * M.stagger;
      slot.reach.spring(1, M.ringOpen, delay);
      slot.scale.spring(1, M.ringOpen, delay);
      slot.o.spring(1, M.ringOpen, delay);
    });
  }

  loaded() {
    this.loading = false;
    this.slots.forEach((slot, i) => {
      slot.enabled = canHandle(slot.info, this.content);
      this.a.slots[i].vis.tween(slot.enabled ? 1 : 0.3, M.content);
    });
    this.updateLabel(true);
    this.updateColors();
    if (this.pendingRun != null) {
      const index = this.pendingRun;
      this.pendingRun = null;
      if (this.slots[index].enabled) this.commitAndRun(index);
    }
  }

  render() {
    const a = this.a;
    this.disc.style.transform = `scale(${a.disc.value})`;
    this.disc.style.opacity = clamp(a.discO.value, 0, 1);
    this.hlGroup.setAttribute('transform', `rotate(${a.angle.value} ${this.outer} ${this.outer})`);
    this.hlSvg.style.opacity = clamp(a.hl.value * a.discO.value, 0, 1);
    this.dotGroup.setAttribute('transform', `rotate(${a.angle.value} ${this.hubD / 2} ${this.hubD / 2})`);
    this.dot.style.opacity = clamp(a.hl.value, 0, 1);
    this.hub.style.transform = `scale(${a.hub.value})`;
    this.hub.style.opacity = clamp(a.hubO.value, 0, 1);
    this.slots.forEach((slot, i) => {
      const anim = a.slots[i];
      const el = this.slotEls[i];
      el.style.transform = `translate(${slot.dx * anim.reach.value}px, ${slot.dy * anim.reach.value}px) scale(${anim.scale.value * anim.act.value})`;
      el.style.opacity = clamp(anim.o.value, 0, 1) * clamp(anim.vis.value, 0, 1);
    });
  }

  // 指针位置（桌面坐标）指向哪一格：只看方向，落在圆心的空白区里不选
  slotAt(point, reach) {
    const dx = point.x - this.cx, dy = this.cy - point.y;
    const distance = Math.hypot(dx, dy);
    if (distance < this.inner) return null;
    if (reach && distance > reach) return undefined;
    let theta = Math.PI / 2 - Math.atan2(dy, dx);
    theta %= 2 * Math.PI;
    if (theta < 0) theta += 2 * Math.PI;
    return Math.floor((theta + this.stepRad / 2) / this.stepRad) % this.count;
  }

  // 点击模式下只在圆盘附近选；按住划的时候整个屏幕都算
  pointer(point) {
    if (this.phase !== 'shown' || this.committed != null) return;
    const index = this.slotAt(point, this.mode === 'click' ? this.outer + 44 : 0);
    this.setHovered(index === undefined ? null : index);
  }

  setHovered(index) {
    if (index === this.hovered || this.committed != null) return;
    const previous = this.hovered;
    if (index != null) {
      const target = -90 + index * 360 / this.count;
      if (previous == null) {
        // 高亮从无到有：直接出现在目标格上，不从上次的位置滑过来
        this.a.angle.set(target);
        this.a.hl.tween(1, 0.12);
      } else {
        const near = this.a.angle.target;
        this.a.angle.spring(target + 360 * Math.round((near - target) / 360), M.hover);
      }
    } else {
      this.a.hl.tween(0, 0.12);
    }
    this.hovered = index;
    this.slots.forEach((slot, i) => {
      const active = i === index && slot.enabled && !this.loading;
      this.a.slots[i].act.spring(active ? 1.12 : 1, M.hover);
    });
    this.updateColors();
    this.updateLabel(true);
  }

  updateColors() {
    const index = this.hovered;
    const slot = index != null ? this.slots[index] : null;
    const enabled = !!(slot && slot.enabled && !this.loading);
    const tint = enabled ? 'var(--accent)' : 'var(--label)';
    const committed = this.committed != null;
    Object.assign(this.hlFill.style, { fill: tint, fillOpacity: enabled ? (committed ? '0.34' : '0.2') : '0.1' });
    Object.assign(this.hlStroke.style, { stroke: tint, strokeOpacity: enabled ? '0.4' : '0.22' });
    Object.assign(this.arc.style, { stroke: tint, strokeOpacity: enabled ? '1' : '0.35' });
    Object.assign(this.arcGlow.style, { stroke: 'var(--accent)', strokeOpacity: enabled ? '0.7' : '0' });
    this.dot.style.fill = enabled ? 'var(--accent)' : 'var(--label-3)';
    this.slotEls.forEach((el, i) => el.classList.toggle('active', (i === index && this.slots[i].enabled && !this.loading) || i === this.committed));
  }

  updateLabel(animated) {
    let content;
    if (this.loading) {
      content = [h('div', { class: 'spinner', title: L(T.reading) })];
    } else if (this.hovered == null) {
      content = [h('div', { class: 't' }, this.content.summary)];
    } else {
      const slot = this.slots[this.hovered];
      if (!slot.info) {
        content = [h('div', { class: 't fn off' }, L(T.emptySlot)), h('div', { class: 'd' }, L(T.emptySlotHint))];
      } else {
        content = [h('div', { class: 't fn' + (slot.enabled ? '' : ' off') }, L(slot.info.name))];
        if (!slot.enabled) content.push(h('div', { class: 'd' }, unavailableHint(slot.info, this.content)));
      }
    }
    this.label.replaceChildren(...content);
    this.label.style.width = `${this.hubD - 10}px`;
    this.label.style.margin = '0 auto';
    if (animated) {
      this.label.classList.remove('swap');
      void this.label.offsetWidth;
      this.label.classList.add('swap');
    }
  }

  // 点击模式：点一格执行，点圆心关掉，点远处也关掉
  click(point) {
    const index = this.slotAt(point, this.outer + 44);
    if (index === undefined) { closeRing(); return; }
    if (index == null) { closeRing(); return; }
    this.setHovered(index);
    if (this.loading) { this.pendingRun = index; return; }
    if (this.slots[index].enabled) this.commitAndRun(index);
  }

  // 按住划的时候松开：指着能用的格子就执行，否则留着圆盘改用点选
  release(point) {
    this.pointer(point);
    const index = this.hovered;
    if (index != null && this.loading) { this.pendingRun = index; this.mode = 'click'; return; }
    if (index != null && this.slots[index].enabled) { this.commitAndRun(index); return; }
    this.mode = 'click';
  }

  commitAndRun(index) {
    if (this.committed != null) return;
    if (this.hovered !== index) this.setHovered(index);
    this.committed = index;
    this.slots.forEach((slot, i) => {
      if (i === index) this.a.slots[i].act.spring(1.2, M.commit);
      else this.a.slots[i].vis.tween(this.a.slots[i].vis.target * 0.35, M.content);
    });
    this.updateColors();
    const id = this.slots[index].id;
    setTimeout(() => runPlugin(id, this.content, this.anchor, this), 110);
  }

  close(animated = true) {
    if (this.phase === 'leaving') return;
    clearTimeout(this.loadTimer);
    this.phase = 'leaving';
    const a = this.a;
    const duration = animated ? M.exit : 0.001;
    if (!reduced()) a.disc.tween(1.05, duration, easeIn);
    a.discO.tween(0, duration, easeIn);
    a.hubO.tween(0, duration, easeIn);
    a.slots.forEach((slot) => {
      if (!reduced()) slot.reach.tween(1.1, duration, easeIn);
      slot.o.tween(0, duration, easeIn);
    });
    setTimeout(() => this.el.remove(), duration * 1000 + 30);
  }
}

let ring = null;

function openRing(x, y, mode) {
  closeRing(false);
  dismissCard(false);
  ring = new Ring(x, y, mode, currentContent());
}

function closeRing(animated = true) {
  if (!ring) return;
  ring.close(animated);
  ring = null;
}

// ---------- 卡片、提示、贴图 ----------
let card = null;

class Floating {
  constructor(el, anchor, kind) {
    this.el = el;
    this.anchor = anchor;
    this.kind = kind;
    this.scale = new Anim(reduced() ? 1 : (kind === 'toast' ? 0.8 : 0.9), this);
    this.opacity = new Anim(0, this);
    layer.append(el);
    this.place();
    this.render();
    const spring = kind === 'toast' ? M.toastOpen : M.cardOpen;
    this.scale.spring(1, spring);
    this.opacity.spring(1, spring);
    if (kind === 'card' && 'ResizeObserver' in window) {
      this.observer = new ResizeObserver(() => this.reclamp());
      this.observer.observe(el);
    }
  }

  // 卡片放在指针右下方，放不下就换到左边、上面；从离指针最近的那个角长出来
  place() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const el = this.el;
    if (this.kind === 'card') {
      const wanted = Number(el.dataset.width || 380);
      el.style.width = `${Math.min(wanted, W - 16)}px`;
    }
    const w = el.offsetWidth, hgt = el.offsetHeight;
    const gap = this.kind === 'toast' ? 0 : 24;
    const { x: ax, y: ay } = this.anchor;
    let x = ax + gap, right = true;
    if (x + w > W - 8) { x = ax - gap - w; right = false; }
    let y = this.kind === 'toast' ? ay + 18 : ay + gap, below = true;
    if (y + hgt > H - 8) { y = ay - gap - hgt; below = false; }
    this.x = clamp(x, 8, Math.max(8, W - 8 - w));
    this.y = clamp(y, MENUBAR + 8, Math.max(MENUBAR + 8, H - 8 - hgt));
    this.below = below;
    this.bottom = this.y + hgt;
    el.style.transformOrigin = this.kind === 'toast' ? 'center' : `${right ? 'left' : 'right'} ${below ? 'top' : 'bottom'}`;
  }

  // 内容变了（翻译出来了、换了一页）：贴着原来的边长高，出了桌面再往回挪
  reclamp() {
    if (this.closing) return;
    const H = stage.clientHeight;
    const hgt = this.el.offsetHeight;
    let y = this.below ? this.y : this.bottom - hgt;
    y = clamp(y, MENUBAR + 8, Math.max(MENUBAR + 8, H - 8 - hgt));
    if (y !== this.y) { this.y = y; this.render(); }
    if (!this.below) this.bottom = this.y + hgt;
  }

  render() {
    this.el.style.transform = `translate(${this.x}px, ${this.y}px) scale(${this.scale.value})`;
    this.el.style.opacity = clamp(this.opacity.value, 0, 1);
  }

  close(animated = true) {
    if (this.closing) return;
    this.closing = true;
    this.observer?.disconnect();
    const duration = animated ? M.exit : 0.001;
    if (!reduced()) this.scale.tween(this.kind === 'toast' ? 0.9 : 0.96, duration, easeIn);
    this.opacity.tween(0, duration, easeIn);
    this.el.style.pointerEvents = 'none';
    setTimeout(() => { this.el.remove(); this.onClosed?.(); }, duration * 1000 + 30);
  }
}

function presentCard(el, anchor, options = {}) {
  closeRing();
  dismissCard(false);
  dismissToast(false);
  card = new Floating(el, anchor, 'card');
  card.onKey = options.onKey;
  card.onClosed = options.onClosed;
  if (options.focus && !matchMedia('(pointer: coarse)').matches) setTimeout(() => options.focus.focus({ preventScroll: true }), 60);
  return card;
}

function dismissCard(animated = true) {
  if (!card) return;
  const closing = card;
  card = null;
  closing.close(animated);
}

let toast = null;
let toastTimer = 0;

function showToast(message, anchor) {
  dismissCard();
  closeRing();
  dismissToast(false);
  const el = h('div', { class: 'toast glass', role: 'status' }, message);
  toast = new Floating(el, anchor || defaultAnchor(), 'toast');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => dismissToast(true), M.toast * 1000 + 300);
}

function dismissToast(animated = true) {
  if (!toast) return;
  const closing = toast;
  toast = null;
  closing.close(animated);
}

function defaultAnchor() {
  const target = stage.querySelector('[data-selection]');
  const box = stage.getBoundingClientRect();
  if (target) {
    const r = target.getBoundingClientRect();
    return { x: r.left - box.left + Math.min(r.width / 2, 160), y: r.top - box.top + r.height / 2 };
  }
  return { x: stage.clientWidth * 0.42, y: stage.clientHeight * 0.45 };
}

// 卡片的外框：标题、副标题、关闭按钮，内容，说明，一排按钮
function cardShell({ title, subtitle, width = 380, children = [], detail, buttons = [] }) {
  const close = h('button', { class: 'x', type: 'button', title: L(T.close), 'aria-label': L(T.close), onclick: () => dismissCard() }, icon('close', { stroke: 'none' }));
  const el = h('div', { class: 'card glass', role: 'dialog', 'aria-label': title, 'data-width': width },
    h('div', { class: 'card-head' }, h('b', null, title), subtitle ? h('span', { class: 'sub' }, subtitle) : null, close),
    children,
    detail ? h('div', { class: 'detail' }, detail) : null,
    buttons.length ? h('div', { class: 'btns' }, buttons) : null);
  return el;
}

function button(label, onclick, extra) {
  return h('button', Object.assign({ class: 'mbtn', type: 'button', onclick }, extra || {}), label);
}

function copyText(text, message, anchor) {
  try { navigator.clipboard?.writeText(text).catch(() => {}); } catch (error) { /* 不让写剪贴板也照样提示 */ }
  showToast(message || L(T.copied), anchor);
}

// 标签那一列按最长的标签算（英文的比中文长），76～150 像素
const measure = document.createElement('canvas').getContext('2d');
function labelColumn(labels) {
  measure.font = `10.5px ${getComputedStyle(document.body).fontFamily}`;
  return Math.round(clamp(Math.max(0, ...labels.map((label) => measure.measureText(label).width)) + 2, 76, 150));
}

function rows(list, options = {}) {

}

// 贴图：贴在屏幕最前面，拖动移动，双击关闭
function pinToScreen(content, anchor) {
  dismissCard();
  const el = h('div', { class: 'pin' + (content.image ? ' img' : ''), title: L(T.pinHint) }, content.image ? h('img', { src: content.image, alt: '' }) : content.text);
  layer.append(el);
  const W = stage.clientWidth, H = stage.clientHeight;
  let width = el.offsetWidth, height = el.offsetHeight;
  let x = clamp(anchor.x + 30, 8, W - width - 8), y = clamp(anchor.y + 30, MENUBAR + 8, H - height - 8);
  el.style.left = `${x}px`; el.style.top = `${y}px`;
  const image = el.querySelector('img');
  if (image && !image.complete) image.addEventListener('load', () => {
    width = el.offsetWidth; height = el.offsetHeight;
    x = clamp(x, 8, W - width - 8); y = clamp(y, MENUBAR + 8, H - height - 8);
    el.style.left = `${x}px`; el.style.top = `${y}px`;
  }, { once: true });
  let drag = null;
  el.addEventListener('pointerdown', (event) => { event.stopPropagation(); drag = { id: event.pointerId, dx: event.clientX - x, dy: event.clientY - y }; el.setPointerCapture(event.pointerId); });
  el.addEventListener('pointermove', (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    x = clamp(event.clientX - drag.dx, -width + 40, W - 40); y = clamp(event.clientY - drag.dy, MENUBAR, H - 30);
    el.style.left = `${x}px`; el.style.top = `${y}px`;
  });
  el.addEventListener('pointerup', () => { drag = null; });
  el.addEventListener('dblclick', () => el.remove());
  const hint = () => showToast(L(T.pinHint), { x: x + width / 2 - 60, y: y + height + 6 });
  if (image && !image.complete) image.addEventListener('load', hint, { once: true });
  else hint();
}

// 翻译卡片：换目标语言、换引擎、几家对比；联网的引擎一边收一边显示
function showTranslation(text, anchor) {
  const article = ARTICLE[lang];
  const known = text && text.includes(article.selected);
  const model = { target: article.targets[0][0], mode: 'system', cache: {} };
  const engines = [['system', { zh: '系统', en: 'System' }], ['ai', 'AI'], ['deepL', 'DeepL']];
  const title = L(P.translate.name);
  const pair = () => `${article.source} → ${article.targets.find(([id]) => id === model.target)[1]}`;
  const sub = h('span', { class: 'sub' });
  const menuButton = h('button', { class: 'menu-btn', type: 'button', 'aria-haspopup': 'menu' });
  const seg = h('div', { class: 'seg', role: 'group' });
  const result = h('div');
  const actions = h('div', { class: 'btns' });
  const source = h('div', { class: 'muted clamp3', style: 'font-size:12px' }, text);
  const el = cardShell({ title, children: [h('div', { class: 'toolbar' }, menuButton, h('span', { class: 'space' }), seg), source, h('div', { class: 'rule' }), result, actions] });
  el.querySelector('.card-head b').after(sub);

  function translated(engine) {
    if (!known) return null;
    return article.results[model.target][engine];
  }

  function phase(engine) {
    const key = `${model.target}:${engine}`;
    if (!model.cache[key]) {
      const entry = { state: 'working', text: '' };
      model.cache[key] = entry;
      const full = translated(engine);
      if (full == null) {
        setTimeout(() => { entry.state = 'failed'; refresh(); }, 500);
      } else if (engine === 'ai') {
        // 联网的 AI 一边收一边显示
        let shown = 0;
        const timer = setInterval(() => {
          shown = Math.min(full.length, shown + Math.max(1, Math.round(full.length / 28)));
          entry.state = shown >= full.length ? 'done' : 'partial';
          entry.text = full.slice(0, shown);
          if (entry.state === 'done') clearInterval(timer);
          refresh();
        }, 45);
      } else {
        setTimeout(() => { entry.state = 'done'; entry.text = full; refresh(); }, engine === 'system' ? 420 : 640);
      }
    }
    return model.cache[key];
  }

  function resultView(engine, compact) {
    const entry = phase(engine);
    if (entry.state === 'working') return h('div', { class: 'busy fade-in' }, h('div', { class: 'spinner' }), lang === 'zh' ? '翻译中…' : 'Translating…');
    if (entry.state === 'failed') return h('div', { class: 'muted fade-in', style: 'font-size:12px' }, lang === 'zh' ? '演示页没有联网，只能翻译示例里选中的那句话。' : 'The demo is offline and can only translate the sample sentence.');
    return h('div', { class: 'body' + (entry.state === 'partial' ? ' muted' : ' fade-in') + (compact ? ' clamp3' : '') }, entry.text);
  }

  let drawn = false;
  function refresh() {
    // 卡片关掉以后，还在跑的翻译回来了也不用画
    if (drawn && !el.isConnected) return;
    drawn = true;
    sub.textContent = pair();
    menuButton.replaceChildren(L({ zh: `译成${article.targets.find(([id]) => id === model.target)[1]}`, en: `To ${article.targets.find(([id]) => id === model.target)[1]}` }), icon('chevron', { 'stroke-width': '2.4' }));
    seg.replaceChildren(...engines.map(([id, label]) => h('button', { type: 'button', 'aria-pressed': String(model.mode === id), onclick: () => { model.mode = id; refresh(); } }, L(label))),
      h('button', { type: 'button', 'aria-pressed': String(model.mode === 'compare'), onclick: () => { model.mode = 'compare'; refresh(); } }, lang === 'zh' ? '对比' : 'Compare'));
    if (model.mode === 'compare') {
      result.replaceChildren(h('div', { class: 'cmp' }, engines.map(([id, label]) => {
        const entry = phase(id);
        return h('div', null,
          h('div', { class: 'cmp-h' }, L(label), h('span', { class: 'space' }), entry.state === 'done' ? h('button', { class: 'link-btn', type: 'button', onclick: () => copyText(entry.text, null, anchor) }, L(T.copy)) : null),
          resultView(id, true));
      })));
    } else {
      result.replaceChildren(resultView(model.mode, false));
    }
    const current = model.mode === 'compare' ? null : phase(model.mode);
    const buttons = [];
    if (current && current.state === 'done') {
      buttons.push(button(lang === 'zh' ? '复制译文' : 'Copy Translation', () => copyText(current.text, null, anchor)));
      buttons.push(button(lang === 'zh' ? '贴到屏幕' : 'Pin to Screen', () => pinToScreen({ text: current.text }, anchor)));
      buttons.push(button(lang === 'zh' ? '朗读' : 'Speak', () => speak(current.text, null, model.target)));
    }
    buttons.push(button(L(T.more), () => showChooser(currentContent(), anchor)));
    actions.replaceChildren(...buttons);
  }

  menuButton.addEventListener('click', (event) => {
    event.stopPropagation();
    const existing = el.querySelector('.menu-pop');
    if (existing) { existing.remove(); return; }
    const pop = h('div', { class: 'menu-pop glass', role: 'menu' }, article.targets.map(([id, name]) => h('button', { type: 'button', role: 'menuitem', disabled: id === model.target, onclick: () => { model.target = id; pop.remove(); refresh(); } }, name)));
    pop.style.left = `${menuButton.offsetLeft}px`;
    pop.style.top = `${menuButton.offsetTop + menuButton.offsetHeight + 4}px`;
    el.append(pop);
  });
  el.addEventListener('click', (event) => { if (!event.target.closest('.menu-pop, .menu-btn')) el.querySelector('.menu-pop')?.remove(); });
  refresh();
  presentCard(el, anchor);
}

function speak(text, anchor, language) {
  try {
    if (window.speechSynthesis) {
      if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = { 'zh-Hans': 'zh-CN', 'zh-Hant': 'zh-TW', ja: 'ja-JP', en: 'en-US', fr: 'fr-FR' };
      utterance.lang = voices[language] || (/[\u4e00-\u9fff]/.test(text) ? 'zh-CN' : 'en-US');
      speechSynthesis.speak(utterance);
      if (anchor) showToast(lang === 'zh' ? '正在朗读，再用一次就停止' : 'Speaking; use it again to stop', anchor);
      return;
    }
  } catch (error) { /* 浏览器不能朗读时照样提示 */ }
  if (anchor) showToast(L(T.onlyInApp(L(P.speak.name))), anchor);
}

// 「全部功能」：列出能处理当前内容的功能，可以搜索（拼音首字母也行）
function showChooser(content, anchor) {
  const all = ORDER.map((id) => P[id]).filter((info) => info && info.id !== 'allPlugins' && isInstalledFunction(info.id) && canHandle(info, content));
  let results = all;
  // 这台 Mac 上没装的插件包：搜索时也列出来，点一下装上，装好就用
  let packages = [];
  const installing = new Set(), installed = new Set();
  let selection = 0;
  const input = h('input', { class: 'search', type: 'search', placeholder: lang === 'zh' ? '搜索功能，比如 fy 找到翻译' : 'Search actions', 'aria-label': lang === 'zh' ? '搜索功能' : 'Search actions', autocomplete: 'off', spellcheck: 'false' });
  const list = h('div', { class: 'list', role: 'listbox', style: `height:${Math.min(300, stage.clientHeight - 190)}px` });
  const highlight = h('div', { class: 'sel-bg' });
  const hl = { y: new Anim(0, null), hgt: new Anim(0, null) };
  const hlOwner = { render() { highlight.style.transform = `translateY(${hl.y.value}px)`; highlight.style.height = `${hl.hgt.value}px`; } };
  hl.y.owner = hlOwner; hl.hgt.owner = hlOwner;

  function run(info) { dismissCard(); setTimeout(() => runPlugin(info.id, content, anchor), 40); }

  // 已装的功能直接用，没装的插件包先装上
  function activate(index) {
    if (results[index]) run(results[index]);
    else if (packages[index - results.length]) install(packages[index - results.length]);
  }

  // 下载、装上；装好时还开着「全部功能」，能处理当前内容就直接用，处理不了就提示装好了
  function install(pkg) {
    if (installing.has(pkg.id) || installed.has(pkg.id)) return;
    installing.add(pkg.id);
    draw();
    setTimeout(() => {
      installing.delete(pkg.id);
      installed.add(pkg.id);
      state.installed.add(pkg.id);
      saveInstalled();
      if (!card || card.el !== el) return;
      draw();
      const fn = pkg.functions.find((id) => P[id] && canHandle(P[id], content));
      setTimeout(() => {
        if (!card || card.el !== el) return;
        if (fn) run(P[fn]);
        else showToast(L({ zh: `装好了「${pkg.name.zh}」`, en: `Installed “${pkg.name.en}”` }), anchor);
      }, 350);
    }, reduced() ? 300 : 700 + Math.random() * 900);
  }

  function draw() {
    const rowsEls = results.map((info, index) => h('div', { class: 'lrow', role: 'option', 'aria-selected': String(index === selection), onclick: () => run(info) },
      icon(info.icon), h('div', { class: 'tt' }, h('div', { class: 'a' }, L(info.name)), h('div', { class: 'b' }, L(info.summary))),
      index < 9 ? h('span', { class: 'kbd' }, `⌘${index + 1}`) : null));
    const pkgEls = packages.map((pkg, offset) => h('div', { class: 'lrow pkg', role: 'option', 'aria-selected': String(results.length + offset === selection), onclick: () => install(pkg) },
      icon(pkg.icon), h('div', { class: 'tt' }, h('div', { class: 'a' }, L(pkg.name)), h('div', { class: 'b' }, L(pkg.summary))),
      installed.has(pkg.id) ? icon('check', { class: 'ok' }) : installing.has(pkg.id) ? h('span', { class: 'spinner' })
        : h('span', { class: 'badge' }, `${lang === 'zh' ? '安装' : 'Install'} · ${formatBytes(pkg.download)}`)));
    const items = pkgEls.length ? [...rowsEls, h('div', { class: 'lhead' }, lang === 'zh' ? '没装的插件 · 点一下装上就能用' : 'Not installed · click to install and use'), ...pkgEls] : rowsEls;
    list.replaceChildren(highlight, ...(items.length ? items : [h('div', { class: 'empty-list' }, lang === 'zh' ? '没有匹配的功能' : 'No matching actions')]));
    moveHighlight(false);
  }

  function moveHighlight(animated) {
    const row = list.querySelectorAll('.lrow')[selection];
    highlight.style.display = row ? '' : 'none';
    if (!row) return;
    if (animated && !reduced()) { hl.y.spring(row.offsetTop, M.selection); hl.hgt.spring(row.offsetHeight, M.selection); }
    else { hl.y.set(row.offsetTop); hl.hgt.set(row.offsetHeight); hlOwner.render(); }
    const top = row.offsetTop, bottom = top + row.offsetHeight;
    if (top < list.scrollTop) list.scrollTop = top - 4;
    else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight + 4;
  }

  input.addEventListener('input', () => {
    const query = input.value.trim().toLowerCase();
    results = query ? all.filter((info) => [info.name.zh, info.name.en.toLowerCase(), info.keys, info.summary.zh, info.summary.en.toLowerCase()].some((key) => key.includes(query))) : all;
    packages = query ? PACKAGES.filter((pkg) => (!state.installed.has(pkg.id) || installed.has(pkg.id)) && [pkg.name.zh, pkg.name.en.toLowerCase(), pkg.summary.zh, pkg.summary.en.toLowerCase(), pkg.id.toLowerCase(),
      ...pkg.functions.map((fn) => fn.toLowerCase()), ...pkg.functions.map((fn) => P[fn]?.keys || '')].some((key) => key.includes(query))) : [];
    selection = 0;
    draw();
  });

  const el = cardShell({ title: L(P.allPlugins.name), subtitle: lang === 'zh' ? '↑↓ 选择 · ⏎ 执行' : '↑↓ Choose · ⏎ Run', children: [input, list] });
  presentCard(el, anchor, {
    focus: input,
    onKey(event) {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        const count = results.length + packages.length;
        if (!count) return true;
        selection = clamp(selection + (event.key === 'ArrowDown' ? 1 : -1), 0, count - 1);
        list.querySelectorAll('.lrow').forEach((row, i) => row.setAttribute('aria-selected', String(i === selection)));
        moveHighlight(true);
        return true;
      }
      if (event.key === 'Enter') { activate(selection); return true; }
      if ((event.metaKey || event.ctrlKey) && /^[1-9]$/.test(event.key)) { const info = results[Number(event.key) - 1]; if (info) run(info); return true; }
      return false;
    },
  });
  draw();
}

// 快捷键一览：当前 App 的菜单按顶层菜单分组；可以搜索，⇥ 在「有快捷键」和「全部」之间切换，点一项让那个 App 执行
function showMenuShortcuts(anchor) {
  const data = MENUS[appKey()][lang];
  const appName = data[0][0];
  const items = [];
  const walk = (entries, path, top) => {
    for (const [title, shortcut, extra] of entries) {
      if (Array.isArray(extra)) walk(extra, path.concat(title), top);
      else items.push({ title, top, path: path.concat(title), sub: path.slice(1).join(' › '), shortcut: shortcut || '', enabled: extra !== false });
    }
  };
  for (const [top, entries] of data) walk(entries, [top], top);
  const withShortcut = items.filter((item) => item.shortcut).length;
  let scope = withShortcut ? 'shortcuts' : 'all';
  let results = [];
  let selection = 0;
  const input = h('input', { class: 'search', type: 'search', placeholder: lang === 'zh' ? '搜索菜单和快捷键' : 'Search menus and shortcuts', 'aria-label': lang === 'zh' ? '搜索菜单和快捷键' : 'Search menus and shortcuts', autocomplete: 'off', spellcheck: 'false', style: 'flex:1 1 170px;min-width:0' });
  const seg = h('div', { class: 'seg', role: 'group' });
  const list = h('div', { class: 'list', role: 'listbox', style: `height:${Math.max(Math.min(320, stage.clientHeight - 210), 160)}px` });
  const highlight = h('div', { class: 'sel-bg' });
  const hl = { y: new Anim(0, null), hgt: new Anim(0, null) };
  const hlOwner = { render() { highlight.style.transform = `translateY(${hl.y.value}px)`; highlight.style.height = `${hl.hgt.value}px`; } };
  hl.y.owner = hlOwner; hl.hgt.owner = hlOwner;

  function run(item) {
    if (!item.enabled) return;
    dismissCard();
    flashMenu(item.top);
    setTimeout(() => showToast(L({ zh: `已让「${appName}」执行「${item.title}」`, en: `${appName} ran “${item.title}”` }), anchor), 260);
  }

  function refilter() {
    const query = input.value.toLowerCase().replace(/\s+/g, '');
    results = items.filter((item) => (scope === 'all' || item.shortcut) && (!query || [item.title, item.path.join('›'), item.shortcut].some((key) => key.toLowerCase().replace(/\s+/g, '').includes(query))));
    selection = 0;
    draw();
  }

  function setScope(next) { scope = next; refilter(); }

  function draw() {
    seg.replaceChildren(
      h('button', { type: 'button', 'aria-pressed': String(scope === 'shortcuts'), onclick: () => setScope('shortcuts') }, lang === 'zh' ? `有快捷键（${withShortcut}）` : `Shortcuts (${withShortcut})`),
      h('button', { type: 'button', 'aria-pressed': String(scope === 'all'), onclick: () => setScope('all') }, lang === 'zh' ? `全部（${items.length}）` : `All (${items.length})`));
    const els = [];
    results.forEach((item, index) => {
      if (index === 0 || results[index - 1].top !== item.top) els.push(h('div', { class: 'lhead' }, item.top));
      els.push(h('div', { class: 'lrow' + (item.enabled ? '' : ' off'), role: 'option', 'aria-selected': String(index === selection), 'aria-disabled': item.enabled ? null : 'true',
        title: item.enabled ? item.path.join(' › ') : (lang === 'zh' ? '现在用不了' : 'Not available right now'), onclick: () => run(item) },
        h('div', { class: 'tt' }, h('div', { class: 'a' }, item.title), item.sub ? h('div', { class: 'b' }, item.sub) : null),
        item.shortcut ? h('span', { class: 'keycap' }, item.shortcut) : null));
    });
    const empty = input.value.trim() ? (lang === 'zh' ? '没有匹配的菜单项' : 'No matching menu items') : (lang === 'zh' ? '这个 App 的菜单里没有快捷键' : 'This app’s menus have no shortcuts');
    list.replaceChildren(highlight, ...(els.length ? els : [h('div', { class: 'empty-list' }, empty)]));
    list.scrollTop = 0;
    moveHighlight(false);
  }

  function moveHighlight(animated) {
    const row = list.querySelectorAll('.lrow')[selection];
    highlight.style.display = row ? '' : 'none';
    if (!row) return;
    if (animated && !reduced()) { hl.y.spring(row.offsetTop, M.selection); hl.hgt.spring(row.offsetHeight, M.selection); }
    else { hl.y.set(row.offsetTop); hl.hgt.set(row.offsetHeight); hlOwner.render(); }

  input.addEventListener('input', refilter);

  presentCard(el, anchor, {
    focus: input,
    onKey(event) {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        if (!results.length) return true;
        selection = clamp(selection + (event.key === 'ArrowDown' ? 1 : -1), 0, results.length - 1);
        list.querySelectorAll('.lrow').forEach((row, i) => row.setAttribute('aria-selected', String(i === selection)));

      if (event.key === 'Tab') { setScope(scope === 'shortcuts' ? 'all' : 'shortcuts'); return true; }
      return false;
    },
  });
  refilter();
}

// 文字转图片：按 App 的排版参数画（宽 540 点、按 2 倍像素画，边距 36、字号 17、行距 0.55 倍、段后 0.3 倍）
function renderTextImage(text, style) {
  const colors = { paper: ['#ffffff', '#212126'], warm: ['#faf2e0', '#3d3326'], night: ['#1c1f24', '#dee0e6'] }[style];
  const width = 540, margin = 36, size = 17, scale = 2;
  const font = `${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif`;
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  const maxWidth = width - margin * 2;
  const lines = [];
  for (const paragraph of text.split('\n')) {
    const tokens = paragraph.match(/[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]|[^\s\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]+\s*|\s+/g) || [''];
    let line = '';
    for (const token of tokens) {
      if (measure.measureText(line + token).width <= maxWidth || !line) { line += token; continue; }
      lines.push({ text: line.trimEnd(), end: false });
      line = token.trimStart();
    }
    lines.push({ text: line, end: true });
  }
  const lineHeight = size * 1.2, spacing = size * 0.55, paragraphGap = size * 0.3;
  let height = margin * 2;
  lines.forEach((line, i) => { height += lineHeight + (i < lines.length - 1 ? spacing + (line.end ? paragraphGap : 0) : 0); });
  const canvas = document.createElement('canvas');
  canvas.width = width * scale; canvas.height = Math.ceil(height * scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = colors[0]; ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = colors[1]; ctx.font = font; ctx.textBaseline = 'top';
  let y = margin;
  lines.forEach((line) => { ctx.fillText(line.text, margin, y + (lineHeight - size) / 2); y += lineHeight + spacing + (line.end ? paragraphGap : 0); });
  return canvas.toDataURL('image/png');
}

// 按画布的像素算（不管缩放）：每一格填上这一格的平均色
function pixelateCanvas(ctx, x, y, w, hh, block) {
  const image = ctx.getImageData(x, y, w, hh);
  const data = image.data;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let by = 0; by < hh; by += block) {
    for (let bx = 0; bx < w; bx += block) {
      let r = 0, g = 0, b = 0, n = 0;
      for (let yy = by; yy < Math.min(by + block, hh); yy++) {
        for (let xx = bx; xx < Math.min(bx + block, w); xx++) {
          const i = (yy * w + xx) * 4;
          r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
        }
      }
      ctx.fillStyle = `rgb(${Math.round(r / n)}, ${Math.round(g / n)}, ${Math.round(b / n)})`;
      ctx.fillRect(x + bx, y + by, Math.min(block, w - bx), Math.min(block, hh - by));
    }
  }
  ctx.restore();
}

function renderChat(allText, plain) {
  const chat = CHAT[lang];
  const scale = 2, width = 380, height = 236;
  const canvas = document.createElement('canvas');
  canvas.width = width * scale; canvas.height = height * scale;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.scale(scale, scale);
  ctx.fillStyle = '#f2f2f7'; ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, 40);
  ctx.fillStyle = '#d1d1d6'; ctx.fillRect(0, 40, width, 1);
  const font = '15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
  ctx.font = '600 ' + font; ctx.fillStyle = '#1c1c1e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(chat.title, width / 2, 21);
  ctx.textAlign = 'left'; ctx.font = font;
  const regions = [];
  chat.lines.forEach(([side, before, secret, after, kind], i) => {
    const text = before + secret + after;
    const w = ctx.measureText(text).width + 24, y = 58 + i * 58;
    const x = side === 'left' ? 14 : width - 14 - w;
    ctx.fillStyle = side === 'left' ? '#ffffff' : '#0a84ff';
    ctx.beginPath(); ctx.roundRect(x, y, w, 38, 12); ctx.fill();
    ctx.fillStyle = side === 'left' ? '#1c1c1e' : '#ffffff';
    ctx.fillText(text, x + 12, y + 20);
    if (allText) regions.push([x + 8, y + 8, w - 16, 22, 'text']);
    else regions.push([x + 12 + ctx.measureText(before).width - 3, y + 9, ctx.measureText(secret).width + 6, 22, kind]);
  });
  if (!plain) for (const [x, y, w, hh] of regions) {
    pixelateCanvas(ctx, Math.round(x * scale), Math.round(y * scale), Math.round(w * scale), Math.round(hh * scale), Math.max(16, Math.round(hh * scale / 2.5)));
  }
  return { png: canvas.toDataURL('image/png'), kinds: regions.map((r) => r[4]), canvas };
}

function renderBeach(asCanvas) {
  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 480;
  const ctx = canvas.getContext('2d');
  const sky = ctx.createLinearGradient(0, 0, 0, 480);
  [[0, '#ffb36b'], [0.34, '#ff8a7a'], [0.58, '#7a8cff'], [0.6, '#3553c9'], [1, '#2a3f8f']].forEach(([stop, color]) => sky.addColorStop(stop, color));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, 640, 480);

// ---------- 框选、取色、录屏 ----------
let picker = null;

function stagePoint(event) {
  const box = stage.getBoundingClientRect();
  return { x: event.clientX - box.left, y: event.clientY - box.top };
}

// 框选一块区域：截图识字、没选中内容时的贴图
function startRegionPicker(purpose, anchor) {
  closeRing(false);
  dismissCard(false);
  const el = h('div', { class: 'picker dim' });
  const tip = h('div', { class: 'tip glass' }, lang === 'zh' ? '拖出一块区域，Esc 取消' : 'Drag to select an area, Esc to cancel');
  const area = h('div', { class: 'area', hidden: true });
  const size = h('div', { class: 'size', hidden: true });
  el.append(tip, area, size);
  stage.append(el);
  let start = null;
  const finish = (rect) => {
    el.remove();
    picker = null;
    if (!rect) return;
    const center = { x: rect.x + rect.w / 2, y: rect.y + rect.h / 2 };
    if (purpose === 'ocr') {
      const text = textInRect(rect);
      if (!text) showToast(lang === 'zh' ? '没有识别到文字' : 'No text found', center);
      else showOCRResult(text, { x: rect.x + rect.w, y: rect.y + rect.h }, L(P.screenshotOCR.name));
    } else if (purpose === 'beautify') {
      captureStage(rect).then((canvas) => showBeautify(canvas, `${canvas.width} × ${canvas.height}`, { x: rect.x + rect.w, y: rect.y + rect.h }));
    } else {
      pinToScreen({ text: textInRect(rect) || (lang === 'zh' ? '（这块区域里没有文字）' : '(no text in this area)') }, center);
    }
  };
  el.addEventListener('pointerdown', (event) => { event.stopPropagation(); start = stagePoint(event); el.setPointerCapture(event.pointerId); el.classList.remove('dim'); area.hidden = false; size.hidden = false; update(start); });
  const update = (point) => {
    const x = Math.min(start.x, point.x), y = Math.min(start.y, point.y), w = Math.abs(point.x - start.x), hh = Math.abs(point.y - start.y);
    Object.assign(area.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${hh}px` });
    size.textContent = `${Math.round(w * 2)} × ${Math.round(hh * 2)}`;
    Object.assign(size.style, { left: `${x}px`, top: `${Math.max(MENUBAR + 2, y - 24)}px` });
    return { x, y, w, h: hh };
  };
  el.addEventListener('pointermove', (event) => { if (start) update(stagePoint(event)); });
  el.addEventListener('pointerup', (event) => { if (!start) return; const rect = update(stagePoint(event)); start = null; finish(rect.w > 6 && rect.h > 6 ? rect : null); });
  picker = { cancel: () => finish(null), key: () => false };
}

// 识别区域里的文字：逐个字看它在不在框里，按行拼起来
function textInRect(rect) {
  const box = stage.getBoundingClientRect();
  const lines = [];
  const walker = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT, { acceptNode: (node) => node.parentElement.closest('.layer, .menubar .right, .picker') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const range = document.createRange();
  while (walker.nextNode()) {
    const node = walker.currentNode;
    const text = node.nodeValue;
    for (let i = 0; i < text.length; i++) {
      range.setStart(node, i); range.setEnd(node, i + 1);
      const r = range.getClientRects()[0];
      if (!r || !r.width) continue;
      const cx = r.left + r.width / 2 - box.left, cy = r.top + r.height / 2 - box.top;
      if (cx < rect.x || cx > rect.x + rect.w || cy < rect.y || cy > rect.y + rect.h) continue;
      let line = lines.find((l) => Math.abs(l.y - cy) < r.height * 0.5);
      if (!line) { line = { y: cy, chars: [] }; lines.push(line); }
      line.chars.push({ x: cx, ch: text[i] });
    }
  }
  return lines.sort((a, b) => a.y - b.y).map((line) => line.chars.sort((a, b) => a.x - b.x).map((c) => c.ch).join('').replace(/\s+/g, ' ').trim()).filter(Boolean).join('\n');
}

// 取色：放大镜跟着指针，点一下取色
function startColorPicker(anchor) {
  closeRing(false);
  dismissCard(false);
  const el = h('div', { class: 'picker' });
  const loupe = h('div', { class: 'loupe' }, h('span', { class: 'hex' }));
  el.append(h('div', { class: 'tip glass' }, lang === 'zh' ? '点一下取色，Esc 取消' : 'Click to pick a color, Esc to cancel'), loupe);
  stage.append(el);
  const colorAt = (event) => {
    el.style.pointerEvents = 'none';
    const target = document.elementFromPoint(event.clientX, event.clientY);
    el.style.pointerEvents = '';
    let node = target;
    while (node && node !== stage && stage.contains(node)) {
      const color = getComputedStyle(node).backgroundColor;
      const match = color.match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?/);
      if (match && (match[4] === undefined || Number(match[4]) > 0.5)) return [Number(match[1]), Number(match[2]), Number(match[3])].map(Math.round);
      node = node.parentElement;
    }
    const point = stagePoint(event);
    return wallColorAt(point.x, point.y);
  };
  const hex = (rgb) => '#' + rgb.map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  const move = (event) => {
    const point = stagePoint(event);
    const rgb = colorAt(event);
    loupe.style.left = `${point.x}px`; loupe.style.top = `${point.y}px`;
    loupe.style.background = hex(rgb);
    loupe.firstChild.textContent = hex(rgb);
    return rgb;
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    const rgb = move(event);
    const point = stagePoint(event);
    el.remove();
    picker = null;
    const value = hex(rgb);
    const [r, g, b] = rgb.map((v) => v / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    let hue = 0, sat = 0;
    if (max !== min) {
      const d = max - min;
      sat = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      hue = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      hue *= 60;
    }
    try { navigator.clipboard?.writeText(value).catch(() => {}); } catch (error) { /* 照样显示 */ }
    presentCard(cardShell({ title: L(P.colorPicker.name), children: [h('div', { class: 'swatch', style: `background:${value}` }), rows([['HEX', value], ['RGB', `rgb(${rgb.join(', ')})`], ['HSL', `hsl(${Math.round(hue)}, ${Math.round(sat * 100)}%, ${Math.round(l * 100)}%)`]], { anchor: point })],

  });

}

// 录屏：先选区域（拖出一块、单击一个窗口、回车整个屏幕），再录，停止后弹出结果卡片
function startRecordPicker(anchor, mode = 'record') {

  };
  const inside = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  const pixels = (r) => { let w = Math.round(r.w * 2), hh = Math.round(r.h * 2); const k = Math.min(1, 3840 / w, 2160 / hh); w = Math.round(w * k / 2) * 2; hh = Math.round(hh * k / 2) * 2; return [w, hh]; };

          button(lang === 'zh' ? '打开' : 'Open', () => showToast(L(T.onlyInApp(lang === 'zh' ? '打开' : 'Open')), where)),
          button(lang === 'zh' ? '在访达中显示' : 'Show in Finder', () => showToast(L(T.onlyInApp(lang === 'zh' ? '在访达中显示' : 'Show in Finder')), where)),

// 大字显示：选中的文字铺满桌面，字号按桌面大小算；点一下或按任意键关闭

// 显示按键：按下带 ⌘、⌃ 的组合键和回车、方向键这些特殊键时，在桌面下方（录屏时在录的区域下边）显示出来；
// 连着按同一个组合显示「⌘Z ×3」，停一会儿淡出。普通打字（字母、数字、只带 ⇧ 或 ⌥ 的符号）不显示
let keycaps = null;
const SPECIAL_KEYS = { Enter: '↩', Tab: '⇥', ' ': '␣', Backspace: '⌫', Delete: '⌦', Escape: '⎋', ArrowLeft: '←', ArrowRight: '→', ArrowDown: '↓', ArrowUp: '↑', Home: '↖', End: '↘', PageUp: '⇞', PageDown: '⇟' };
const CODE_KEYS = { Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`' };

function keystrokeText(event) {
  const special = SPECIAL_KEYS[event.key] || (/^F([1-9]|1[0-2])$/.test(event.key) ? event.key : null);
  const command = event.metaKey, control = event.ctrlKey, option = event.altKey, shift = event.shiftKey;
  if (!special && !command && !control) return null;
  if (event.key === ' ' && !command && !control && !option) return null;
  // 按的是哪个键（不管 ⇧ 打出的是什么）：⇧⌘4 写成「⇧⌘4」不写成「⇧⌘$」
  const code = event.code || '';
  const key = special || (/^Key[A-Z]$/.test(code) ? code.slice(3) : /^(Digit|Numpad)[0-9]$/.test(code) ? code.slice(-1) : CODE_KEYS[code])
    || (event.key.length === 1 ? event.key.toUpperCase() : null);
  if (!key) return null;
  return (control ? '⌃' : '') + (option ? '⌥' : '') + (shift ? '⇧' : '') + (command ? '⌘' : '') + key;
}

// 开始显示；已经在显示的换到 area 下边（area 为空就是整个桌面）
function startKeycaps(area) {
  if (keycaps) { keycaps.move(area); return; }
  const el = h('div', { class: 'keycaps gone', 'aria-hidden': 'true' });
  stage.append(el);
  let last = null;
  let hideTimer = 0;
  const hide = () => { el.classList.add('gone'); last = null; };
  const place = () => {
    const a = keycaps.area || { x: 0, y: 0, w: stage.clientWidth, h: stage.clientHeight };
    el.style.left = `${a.x + a.w / 2}px`;
    el.style.top = `${a.y + a.h - el.offsetHeight - 22}px`;
  };
  keycaps = {
    area,
    key(event) {
      // 按住不放的重复只让它多显示一会儿
      if (event.repeat) {
        if (last) { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 1600); }
        return;
      }
      const text = keystrokeText(event);
      if (!text) return;
      const now = performance.now();
      last = last && last.text === text && now - last.time <= 1500 ? { text, count: last.count + 1, time: now } : { text, count: 1, time: now };
      el.textContent = last.count > 1 ? `${text} ×${last.count}` : text;
      el.classList.remove('gone');
      place();
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hide, 1600);
    },
    move(next) { keycaps.area = next; place(); },
    stop() { clearTimeout(hideTimer); el.remove(); keycaps = null; },
  };
}

function toggleKeystrokes(anchor) {
  if (keycaps) {
    keycaps.stop();
    showToast(lang === 'zh' ? '不再显示按键' : 'Stopped showing keystrokes', anchor);
    return;
  }
  startKeycaps(null);
  showToast(lang === 'zh' ? '开始显示按下的组合键，再用一次就关闭' : 'Showing the shortcuts you press; use it again to turn it off', anchor);
}

// 屏幕画笔：桌面上盖一层画布，上方一条工具栏。按住 ⇧ 画直线、正方形、正圆和 45° 的箭头；
// 可以让笔迹几秒后自动消失，也可以让鼠标穿过画布去点下面的东西。Esc 或再用一次结束
let pen = null;
const PEN_TOOLS = [
  ['pen', 'penScribble', { zh: '画笔', en: 'Pen' }, 'p'],
  ['highlighter', 'highlighter', { zh: '荧光笔', en: 'Highlighter' }, 'h'],
  ['arrow', 'arrowTool', { zh: '箭头', en: 'Arrow' }, 'a'],
  ['rectangle', 'rectTool', { zh: '方框', en: 'Rectangle' }, 'r'],
  ['ellipse', 'ellipseTool', { zh: '椭圆', en: 'Ellipse' }, 'o'],
];
const PEN_COLORS = ['#ee3833', '#ffd60a', '#33c759', '#007aff', '#ffffff'];
const PEN_FADE_DELAY = 2500;
const PEN_FADE = 600;

// 按住 ⇧ 时的终点：方框、椭圆取长的一边画成正的，箭头转到最近的 45° 方向
function penConstrain(start, point, tool) {
  const dx = point.x - start.x, dy = point.y - start.y;
  if (tool === 'rectangle' || tool === 'ellipse') {
    const side = Math.max(Math.abs(dx), Math.abs(dy));
    return { x: start.x + (dx < 0 ? -side : side), y: start.y + (dy < 0 ? -side : side) };
  }
  if (tool === 'arrow') {
    const length = Math.hypot(dx, dy), step = Math.PI / 4, angle = Math.round(Math.atan2(dy, dx) / step) * step;
    return { x: start.x + Math.cos(angle) * length, y: start.y + Math.sin(angle) * length };
  }
  return point;
}

function togglePen() {
  if (pen) { pen.stop(); return; }
  closeRing(false);
  dismissCard(false);
  const model = { tool: 'pen', color: 0, strokes: [], current: null, fades: false, through: false };
  const canvas = h('canvas', { class: 'pen-canvas' });
  const bar = h('div', { class: 'pen-bar', role: 'toolbar', 'aria-label': L(P.screenPen.name), onpointerdown: (event) => event.stopPropagation() });
  stage.append(canvas, bar);
  const ctx = canvas.getContext('2d');
  let frame = 0;
  const alphaOf = (stroke, now) => {
    if (!model.fades || stroke.done == null) return 1;
    const t = now - stroke.done - PEN_FADE_DELAY;
    return t <= 0 ? 1 : Math.max(0, 1 - t / PEN_FADE);
  };
  const meaningful = (stroke) => {
    const a = stroke.points[0], b = stroke.points[stroke.points.length - 1];
    if (stroke.tool === 'pen' || stroke.tool === 'highlighter') return stroke.points.length > 1;
    if (stroke.tool === 'arrow') return Math.hypot(b.x - a.x, b.y - a.y) >= 4;
    return Math.abs(b.x - a.x) >= 3 && Math.abs(b.y - a.y) >= 3;
  };
  function drawStroke(stroke, alpha) {
    const points = stroke.points, a = points[0], b = points[points.length - 1];
    const highlight = stroke.tool === 'highlighter';
    const width = highlight ? 22 : 5;
    ctx.save();
    ctx.globalAlpha = alpha * (highlight ? 0.4 : 1);
    ctx.strokeStyle = PEN_COLORS[stroke.color];
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if (!highlight) { ctx.shadowColor = 'rgba(0, 0, 0, .35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1; }
    ctx.beginPath();
    if (stroke.tool === 'pen' || highlight) {
      ctx.moveTo(a.x, a.y);
      for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
    } else if (stroke.tool === 'rectangle') {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), hh = Math.abs(b.y - a.y);
      if (ctx.roundRect) ctx.roundRect(x, y, w, hh, width); else ctx.rect(x, y, w, hh);
    } else if (stroke.tool === 'ellipse') {
      ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2, Math.abs(b.y - a.y) / 2, 0, 0, Math.PI * 2);
    } else {
      // 箭头：一条线加上终点处的两撇
      const angle = Math.atan2(b.y - a.y, b.x - a.x), head = Math.max(width * 4, 12);
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      for (const offset of [Math.PI * 5 / 6, -Math.PI * 5 / 6]) {
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + Math.cos(angle + offset) * head, b.y + Math.sin(angle + offset) * head);
      }
    }
    ctx.stroke();
    ctx.restore();
  }
  function draw() {
    const ratio = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const now = performance.now();
    for (const stroke of model.strokes) drawStroke(stroke, alphaOf(stroke, now));
    if (model.current) drawStroke(model.current, 1);
  }
  const resize = () => {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(stage.clientWidth * ratio);
    canvas.height = Math.round(stage.clientHeight * ratio);
    draw();
  };
  // 自动消失：一直重画，淡没了的去掉
  function tick() {
    frame = 0;
    if (!model.fades || !model.strokes.length) return;
    const now = performance.now(), before = model.strokes.length;
    model.strokes = model.strokes.filter((stroke) => alphaOf(stroke, now) > 0);
    if (model.strokes.length !== before) render();
    draw();
    frame = requestAnimationFrame(tick);
  }
  const kick = () => { if (!frame && model.fades && model.strokes.length) frame = requestAnimationFrame(tick); };
