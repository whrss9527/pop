// 整理文件夹：「下载」第一层的文件按类型或月份归进子文件夹；文件夹、隐藏文件不动；可以撤销
const TIDY = {
  kinds: [
    ['images', { zh: '图像', en: 'Images' }, 'imageConvert'], ['videos', { zh: '视频', en: 'Videos' }, 'videoConvert'], ['audio', { zh: '音频', en: 'Audio' }, 'transcribe'],
    ['documents', { zh: '文档', en: 'Documents' }, 'doc'], ['archives', { zh: '压缩包', en: 'Archives' }, 'zip'], ['installers', { zh: '安装包', en: 'Installers' }, 'download'],
    ['others', { zh: '其他', en: 'Other' }, 'folder'],
  ],
  mode: 'kind',
};

function tidyKind(file) {
  switch (file.kind) {
    case 'imageFile': return 'images';
    case 'video': return 'videos';
    case 'audio': return 'audio';
    case 'pdf': case 'textFile': return 'documents';
    case 'zip': return 'archives';
    default: return file.icon === 'gif' ? 'images' : 'others';
  }
}

// 按月份时看修改时间（没有的算这个月）
function tidyMonth(file) {
  for (const [, value] of file.info || []) {
    const found = /(\d{4})-(\d{2})-\d{2}/.exec(L(value));
    if (found) return `${found[1]}-${found[2]}`;
  }
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

// 按拍摄日期时看照片、视频的拍摄时间；没有的不动
function tidyTaken(file) {
  const row = (file.info || []).find(([label]) => L(label) === L({ zh: '拍摄时间', en: 'Taken' }));
  const found = row && /(\d{4})-(\d{2})-\d{2}/.exec(L(row[1]));
  return found ? `${found[1]}-${found[2]}` : null;
}

function tidyPlan(mode) {
  const files = allFiles().filter((file) => file.kind !== 'folder' && file.kind !== 'app' && !file.hidden && !String(file.key).startsWith('tidy-'));
  const groups = new Map();
  for (const file of files) {
    const id = mode === 'kind' ? tidyKind(file) : mode === 'taken' ? tidyTaken(file) : tidyMonth(file);
    if (!id) continue;
    if (!groups.has(id)) {
      const kind = TIDY.kinds.find(([k]) => k === id);
      groups.set(id, { id, name: kind ? kind[1] : { zh: id, en: id }, icon: kind ? kind[2] : mode === 'taken' ? 'cameraBubble' : 'clock', keys: [] });
    }
    groups.get(id).keys.push(file.key);
  }
  const order = mode === 'kind' ? TIDY.kinds.map(([k]) => k) : [...groups.keys()].sort().reverse();
  return order.filter((id) => groups.has(id)).map((id) => groups.get(id));
}

function showTidyFolder(anchor) {
  const zh = lang === 'zh';
  const folderName = zh ? '下载' : 'Downloads';
  if (!tidyPlan('kind').length) {
    showToast(zh ? `「${folderName}」里没有要整理的文件` : `Nothing to tidy in “${folderName}”`, anchor);
    return;
  }
  let mode = TIDY.mode;
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': zh ? '整理方式' : 'Sort' },
    [['kind', { zh: '按类型', en: 'By Type' }], ['month', { zh: '按月份', en: 'By Month' }], ['taken', { zh: '按拍摄日期', en: 'By Date Taken' }]].map(([id, label]) => h('button', { type: 'button', 'data-id': id, onclick: () => { mode = id; TIDY.mode = id; draw(); } }, L(label))));
  const body = h('div', { class: 'td-body' });
  const btns = h('div', { class: 'btns' });
  const el = cardShell({ title: L(P.tidyFolder.name), subtitle: folderName, width: 400, children: [body, btns] });

  function draw() {
    for (const b of seg.children) b.setAttribute('aria-pressed', String(b.dataset.id === mode));
    const plan = tidyPlan(mode);
    const count = plan.reduce((sum, group) => sum + group.keys.length, 0);
    body.replaceChildren(seg,
      h('div', { class: 'td-list' }, plan.map((group) => h('div', { class: 'td-row' }, h('span', { class: 'td-icon' }, icon(group.icon)), h('span', { class: 'td-name' }, L(group.name)),
        h('span', { class: 'td-count' }, zh ? `${group.keys.length} 个` : String(group.keys.length))))),
      h('div', { class: 'detail' }, mode === 'taken'
        ? (count ? (zh ? `会把 ${count} 张照片和视频按拍摄的月份放进 ${plan.length} 个子文件夹；别的文件不动` : `Moves ${count} photos and videos into ${plan.length} subfolders by the month they were taken. Other files stay put`)
          : (zh ? '没有读得到拍摄日期的照片和视频' : 'No photos or videos with a capture date'))
        : (zh ? `会把 ${count} 个文件放进 ${plan.length} 个子文件夹；子文件夹、隐藏文件和没下载完的文件不动` : `Moves ${count} files into ${plan.length} subfolders. Subfolders, hidden files and unfinished downloads stay put`)));
    const tidy = button(zh ? '整理' : 'Tidy', apply, { class: 'mbtn default' });
    tidy.disabled = !count;
    btns.replaceChildren(tidy);
  }

  function apply() {
    const plan = tidyPlan(mode);
    const count = plan.reduce((sum, group) => sum + group.keys.length, 0);
    state.tidy = { groups: plan, fresh: true };
    state.selected = [];
    renderWindow();
    state.tidy.fresh = false;
    body.replaceChildren(h('div', { class: 'td-done' }, zh ? `整理好了 ${count} 个文件，放进了 ${plan.length} 个子文件夹` : `Moved ${count} files into ${plan.length} subfolders`));
    btns.replaceChildren(
      button(zh ? '撤销' : 'Undo', () => {
        state.tidy = null;
        state.selected = [FILES[0].key];
        renderWindow();
        draw();
      }),
      button(zh ? '在访达中显示' : 'Show in Finder', () => dismissCard()),
      button(zh ? '完成' : 'Done', () => dismissCard(), { class: 'mbtn default' }));
  }

  draw();
  presentCard(el, anchor);
}

// 示例标志：透明底上一个渐变的圆，里面一个白色的对话气泡（和 App 里 CI 截图用的一样，按 512 画）
function renderLogo() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 512;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const gradient = ctx.createLinearGradient(0, 0, 512, 512);
  gradient.addColorStop(0, '#5966ff'); gradient.addColorStop(1, '#ff6b9e');
  ctx.fillStyle = gradient;
  ctx.beginPath(); ctx.arc(256, 256, 240, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.roundRect(131, 145, 250, 170, 60); ctx.fill();
  ctx.beginPath(); ctx.moveTo(180, 312); ctx.lineTo(165, 367); ctx.lineTo(235, 316); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8c6bf2';
  for (const x of [191, 256, 321]) { ctx.beginPath(); ctx.arc(x, 230, 19, 0, Math.PI * 2); ctx.fill(); }
  return canvas;
}

// 生成图标：和 App 里一样，macOS 的圆角方块是 1024 画布里 824 见方的超椭圆 |x|⁵ + |y|⁵ = 1，底下一点阴影
const APPICON = {
  styles: [['rounded', { zh: '圆角方块', en: 'Rounded Square' }], ['plain', { zh: '原样', en: 'As Is' }]],
  margins: [['off', { zh: '不留', en: 'None' }, 0], ['narrow', { zh: '窄', en: 'Narrow' }, 0.1], ['wide', { zh: '宽', en: 'Wide' }, 0.2]],
  fills: [['white', { zh: '白色', en: 'White' }, '#ffffff'], ['black', { zh: '黑色', en: 'Black' }, '#000000'], ['clear', { zh: '透明', en: 'Transparent' }, null]],
  fits: [['crop', { zh: '裁成正方形', en: 'Crop to Square' }], ['whole', { zh: '整张放进去', en: 'Fit Whole Image' }]],
  // 上次用的样式、底色和要生成的几种
  saved: { style: 'rounded', fill: 'white', macOS: true, iOS: true, web: true },
};

function squirclePath(ctx, x, y, size) {
  const r = size / 2, cx = x + r, cy = y + r, steps = 360;
  const root = (v) => Math.sign(v) * Math.pow(Math.abs(v), 0.4);
  ctx.beginPath();
  for (let i = 0; i < steps; i++) {
    const t = i / steps * Math.PI * 2;
    const px = cx + r * root(Math.cos(t)), py = cy + r * root(Math.sin(t));
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}

// 有没有透明的地方：缩到 64 见方（不插值）看不透明度
function hasTransparency(source) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(source, 0, 0, 64, 64);
  const data = ctx.getImageData(0, 0, 64, 64).data;
  for (let i = 3; i < data.length; i += 4) if (data[i] < 250) return true;
  return false;
}

// 用到的那一块：裁切时（还有差一点点就是正方形时）是正方形，对准主体；否则整张
function iconRegion(w, hh, fit, focus) {
  const square = Math.abs(w - hh) * 50 <= Math.max(w, hh);
  if (!square && fit === 'whole') return [0, 0, w, hh];
  const side = Math.min(w, hh);
  const cx = focus ? focus[0] + focus[2] / 2 : w / 2, cy = focus ? focus[1] + focus[3] / 2 : hh / 2;
  return [Math.floor(Math.min(Math.max(cx - side / 2, 0), w - side)), Math.floor(Math.min(Math.max(cy - side / 2, 0), hh - side)), side, side];
}

// 画一个尺寸的图标；macOS 为 true 时按样式画圆角方块，opaque 时透明的地方垫白色（iOS、加到主屏幕用）
function renderIcon(source, focus, side, o, { macOS = false, opaque = false } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = side;
  const ctx = canvas.getContext('2d');
  const margin = APPICON.margins.find(([id]) => id === o.margin)[2];
  const fill = APPICON.fills.find(([id]) => id === o.fill)[2] || (opaque ? '#ffffff' : null);
  const [rx, ry, rw, rh] = iconRegion(source.width, source.height, o.fit, focus);
  const drawInto = (target, x, y, size) => {
    const inner = size * (1 - 2 * margin), ix = x + size * margin, iy = y + size * margin;
    const scale = Math.min(inner / rw, inner / rh), dw = rw * scale, dh = rh * scale;
    target.imageSmoothingQuality = 'high';
    target.drawImage(source, rx, ry, rw, rh, ix + (inner - dw) / 2, iy + (inner - dh) / 2, dw, dh);
  };
  if (macOS && o.style === 'rounded') {
    const k = side / 1024, x = 100 * k, size = 824 * k;
    // 先在一层里画好、裁成圆角方块，整层投一次阴影
    const layer = document.createElement('canvas');
    layer.width = layer.height = side;
    const lc = layer.getContext('2d');
    squirclePath(lc, x, x, size);
    lc.clip();
    const bodyFill = APPICON.fills.find(([id]) => id === o.fill)[2];
    if (bodyFill) { lc.fillStyle = bodyFill; lc.fillRect(x, x, size, size); }
    drawInto(lc, x, x, size);
    ctx.shadowColor = 'rgba(0, 0, 0, .3)'; ctx.shadowBlur = 20 * k; ctx.shadowOffsetY = 10 * k;
    ctx.drawImage(layer, 0, 0);
    return canvas;
  }
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(0, 0, side, side); }
  drawInto(ctx, 0, 0, side);
  return canvas;
}

function showAppIcon(file, anchor) {
  const zh = lang === 'zh';
  const source = imageSourceFor(file);
  // 海边的照片里最吸引注意的是太阳（按画出来的示例图算）
  const focus = file.key === 'photo' ? [274, 154, 92, 92] : null;
  const transparent = hasTransparency(source);
  const square = Math.abs(source.width - source.height) * 50 <= Math.max(source.width, source.height);
  const o = { ...APPICON.saved, margin: transparent ? 'narrow' : 'off', fit: 'crop' };
  const base = L(file.name).replace(/\.[^.]+$/, '');
  const folderName = zh ? `${base} 图标` : `${base} Icons`;

  const segment = (list, key) => h('div', { class: 'seg', role: 'group' }, list.map(([id, label]) => h('button', { type: 'button', 'data-id': id, onclick: () => { o[key] = id; draw(); } }, L(label))));
  const styleSeg = segment(APPICON.styles, 'style');
  const marginSeg = segment(APPICON.margins, 'margin');
  const fillSeg = segment(APPICON.fills, 'fill');
  const fitSeg = segment(APPICON.fits, 'fit');

// 框选的那块画成一张截图：网页里拍不了屏幕，就照着页面把壁纸、底色、边框、图标、图片和文字按原来的位置画一遍
async function captureStage(rect) {
  const scale = 2;
  const box = stage.getBoundingClientRect();
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(rect.w * scale));
  canvas.height = Math.max(1, Math.round(rect.h * scale));
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.translate(-rect.x, -rect.y);
  const wall = stage.querySelector('canvas.wall');
  if (wall) ctx.drawImage(wall, 0, 0, stage.clientWidth, stage.clientHeight);
  const local = (r) => ({ x: r.left - box.left, y: r.top - box.top, w: r.width, h: r.height });
  const meets = (a, b) => a.w > 0 && a.h > 0 && a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const clear = (color) => !color || color === 'transparent' || /,\s*0(\.0*)?\)$/.test(color) || /\/\s*0(\.0*)?\)$/.test(color);
  const styles = new Map();
  const style = (el) => { if (!styles.has(el)) styles.set(el, getComputedStyle(el)); return styles.get(el); };
  // 叠起来的透明度；藏起来的算 0
  const alphas = new Map();
  const alpha = (el) => {
    if (!el || el === stage) return 1;
    if (!alphas.has(el)) {
      const st = style(el);
      alphas.set(el, st.visibility === 'hidden' || st.display === 'none' ? 0 : Number(st.opacity) * alpha(el.parentElement));
    }
    return alphas.get(el);
  };
  // 外面裁掉溢出的那几层的交集
  const clips = new Map();
  const clipOf = (el) => {
    if (!el || el === stage) return null;
    if (!clips.has(el)) {
      let clip = clipOf(el.parentElement);
      const st = style(el);
      if (st.overflowX !== 'visible' || st.overflowY !== 'visible') {
        const r = local(el.getBoundingClientRect());
        if (!clip) clip = r;
        else {
          const x = Math.max(clip.x, r.x), y = Math.max(clip.y, r.y);
          clip = { x, y, w: Math.max(0, Math.min(clip.x + clip.w, r.x + r.w) - x), h: Math.max(0, Math.min(clip.y + clip.h, r.y + r.h) - y) };
        }
      }
      clips.set(el, clip);
    }
    return clips.get(el);
  };
  const steps = [];
  const pending = [];
  // 元素自己的底色和边框不受自己的溢出裁剪，里面的字受
  const add = (el, paint, inside = false) => {
    const opacity = alpha(el), clip = clipOf(inside ? el : el.parentElement);
    if (opacity < 0.02 || (clip && !meets(clip, rect))) return;
    steps.push(() => {
      ctx.save();
      ctx.globalAlpha = opacity;
      if (clip) { ctx.beginPath(); ctx.rect(clip.x, clip.y, clip.w, clip.h); ctx.clip(); }
      paint();
      ctx.restore();
    });
  };
  const skip = '.layer, .picker, .spotlight, .zoomer, .halo, .halo-wave, .click-dot, .rec-frame, .scroll-frame, canvas.wall';
  const walker = document.createTreeWalker(stage, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, { acceptNode: (node) => {
    const el = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
    if (el.closest(skip)) return NodeFilter.FILTER_REJECT;
    // 图标整个画成一张图，里面的不再单独画
    if (el !== node || el.tagName.toLowerCase() !== 'svg') { if (el.closest('svg')) return NodeFilter.FILTER_REJECT; }
    return NodeFilter.FILTER_ACCEPT;
  } });
  const range = document.createRange();
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (node.nodeType === Node.TEXT_NODE) {
      const el = node.parentElement;
      if (!meets(local(el.getBoundingClientRect()), rect) || !node.nodeValue.trim()) continue;
      const st = style(el);
      const font = `${st.fontStyle} ${st.fontWeight} ${st.fontSize} ${st.fontFamily}`;
      const upper = st.textTransform === 'uppercase';
      // 同一行的字连成一段画
      const runs = [];
      const text = node.nodeValue;
      for (let i = 0; i < text.length; i++) {
        range.setStart(node, i); range.setEnd(node, i + 1);
        const r = range.getClientRects()[0];
        if (!r || !r.width) continue;
        const p = local(r);
        const last = runs[runs.length - 1];
        if (last && Math.abs(last.y - p.y) < 1 && p.x >= last.right - 1) { last.text += text[i]; last.right = p.x + p.w; }
        else runs.push({ x: p.x, y: p.y, h: p.h, right: p.x + p.w, text: text[i] });
      }
      const color = st.color;
      add(el, () => {
        ctx.font = font;
        ctx.fillStyle = color;
        ctx.textBaseline = 'middle';
        for (const run of runs) {
          if (!run.text.trim() || !meets({ x: run.x, y: run.y, w: run.right - run.x, h: run.h }, rect)) continue;
          ctx.fillText(upper ? run.text.toUpperCase() : run.text, run.x, run.y + run.h / 2);
        }
      }, true);
      continue;
    }
    const el = node;
    const r = local(el.getBoundingClientRect());
    if (!meets(r, rect)) continue;
    const st = style(el);
    const tag = el.tagName.toLowerCase();
    const radius = parseFloat(st.borderTopLeftRadius) || 0;
    const background = st.backgroundColor;
    if (!clear(background)) add(el, () => { ctx.fillStyle = background; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, Math.min(radius, r.w / 2, r.h / 2)); ctx.fill(); });
    const sides = ['Top', 'Right', 'Bottom', 'Left'].map((side) => [parseFloat(st[`border${side}Width`]) || 0, st[`border${side}Color`], st[`border${side}Style`]]);
    if (sides.some(([width, color, line]) => width > 0 && !clear(color) && line !== 'none')) {
      const [top, right, bottom, left] = sides;
      const same = sides.every(([width, color]) => width === top[0] && color === top[1]);
      add(el, () => {
        if (same && radius > 0) {
          ctx.strokeStyle = top[1]; ctx.lineWidth = top[0];
          if (top[2] === 'dashed') ctx.setLineDash([top[0] * 3, top[0] * 2]);
          ctx.beginPath(); ctx.roundRect(r.x + top[0] / 2, r.y + top[0] / 2, r.w - top[0], r.h - top[0], Math.max(0, radius - top[0] / 2)); ctx.stroke();
          return;
        }
        const edges = [[top, r.x, r.y, r.w, top[0]], [right, r.x + r.w - right[0], r.y, right[0], r.h], [bottom, r.x, r.y + r.h - bottom[0], r.w, bottom[0]], [left, r.x, r.y, left[0], r.h]];
        for (const [[width, color, line], x, y, w, hh] of edges) {
          if (width > 0 && !clear(color) && line !== 'none') { ctx.fillStyle = color; ctx.fillRect(x, y, w, hh); }
        }
      });
    }
    if (tag === 'img' || tag === 'canvas' || tag === 'video') {
      add(el, () => { try { ctx.drawImage(el, r.x, r.y, r.w, r.h); } catch (error) { /* 还没加载好的图片不画 */ } });
    } else if (tag === 'svg') {
      const copy = el.cloneNode(true);
      copy.setAttribute('width', r.w);
      copy.setAttribute('height', r.h);
      copy.style.color = st.color;
      const image = new Image();
      image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(copy));
      let ready = false;
      pending.push(image.decode().then(() => { ready = true; }, () => {}));
      add(el, () => { if (ready) ctx.drawImage(image, r.x, r.y, r.w, r.h); });
    }
  }
  await Promise.all(pending);
  for (const step of steps) step();
  return canvas;
}

// 清洁键盘：盖一层提示和倒计时，这期间按键都不管用；用鼠标点「结束清洁」或者等时间到
let cleaning = null;

function startKeyboardCleaning() {
  closeRing(false);
  dismissCard(false);
  let left = 60;
  const sub = h('div', { class: 'sub' });
  const draw = () => { sub.textContent = L({ zh: `按键、亮度和音量键都不起作用；0:${String(left).padStart(2, '0')} 后自动恢复`, en: `Keys, brightness and volume don’t respond; unlocks by itself in 0:${String(left).padStart(2, '0')}` }).replace('0:60', '1:00'); };
  const end = h('button', { type: 'button' }, lang === 'zh' ? '结束清洁' : 'End Cleaning');
  const el = h('div', { class: 'kb-clean', role: 'dialog' }, icon('cleanKeyboard', { 'stroke-width': '1.3' }), h('b', null, lang === 'zh' ? '键盘已经锁住，可以放心擦了' : 'The keyboard is locked. Go ahead and wipe it'), sub, end);
  draw();
  stage.append(el);
  const timer = setInterval(() => { left -= 1; if (left <= 0) stop(); else draw(); }, 1000);
  function stop() { clearInterval(timer); el.remove(); cleaning = null; }
  end.addEventListener('click', stop);
  el.addEventListener('pointerdown', (event) => event.stopPropagation());
  cleaning = { stop };
}

// 滚动截图：框好的区域外面一圈蓝色虚线，旁边的面板显示截了多长。在区域里往下滚动，每 50 毫秒看一次滚到了哪里，
// 一下滚得比区域还远就接不上（和 App 里一样提示往回滚一点）；点「完成」拼成长图
let scrolling = null;

function screensText(total, frame) {
  const value = total / Math.max(frame, 1);
  if (value >= 10) return String(Math.round(value));
  const tenths = Math.round(value * 10);
  return tenths % 10 === 0 ? String(tenths / 10) : (tenths / 10).toFixed(1);
}

function startScrollCapture(rect) {
  const scroller = stage.querySelector('.win .content.scroll');
  const box = stage.getBoundingClientRect();
  const sr = scroller ? scroller.getBoundingClientRect() : null;
  // 区域里会滚动的那一段有多高
  const band = sr ? Math.max(Math.min(rect.y + rect.h, sr.bottom - box.top) - Math.max(rect.y, sr.top - box.top), 0) : 0;
  const startTop = scroller ? scroller.scrollTop : 0;
  let accepted = startTop;
  let lost = false;
  const frameEl = h('div', { class: 'scroll-frame', style: `left:${rect.x - 2}px;top:${rect.y - 2}px;width:${rect.w + 4}px;height:${rect.h + 4}px` });
  const status = h('span', { class: 'st' });
  const hint = h('div', { class: 'hint' });
  const panel = h('div', { class: 'scroll-panel glass' },
    h('div', { class: 'row' }, icon('scrollCapture'), status, h('span', { style: 'flex:1' }),
      button(lang === 'zh' ? '取消' : 'Cancel', () => stop(false)), button(lang === 'zh' ? '完成' : 'Done', () => stop(true))),
    hint);
  layer.append(frameEl, panel);
  const px = clamp(rect.x + rect.w - panel.offsetWidth, 8, stage.clientWidth - panel.offsetWidth - 8);
  const below = rect.y + rect.h + 10 + panel.offsetHeight < stage.clientHeight - 4;
  const above = rect.y - 10 - panel.offsetHeight > MENUBAR + 4;
  const py = below ? rect.y + rect.h + 10 : above ? rect.y - 10 - panel.offsetHeight : clamp(rect.y + rect.h - panel.offsetHeight - 12, MENUBAR + 6, stage.clientHeight - panel.offsetHeight - 6);
  Object.assign(panel.style, { left: `${px}px`, top: `${py}px` });

  function update() {
    const total = rect.h + accepted - startTop;
    const screens = screensText(total, rect.h);
    status.textContent = L({ zh: `滚动截图 · 已截 ${Math.round(total * 2)} 像素高，约 ${screens} 屏`, en: `Scrolling Screenshot · ${Math.round(total * 2)} px tall, about ${screens} ${screens === '1' ? 'screen' : 'screens'}` });
    hint.textContent = lost
      ? (lang === 'zh' ? '对不上了：往回滚一点，接上以后再慢慢往下滚' : 'Lost track: scroll back up a little, then continue down slowly')
      : (lang === 'zh' ? '往下滚动要截的内容，滚到底点「完成」；Esc 取消' : 'Scroll down through the content and click Done at the end; Esc cancels');
    hint.classList.toggle('warn', lost);
  }

  const timer = setInterval(() => {
    if (!scroller) return;
    const top = scroller.scrollTop;
    if (top <= accepted) {
      lost = false;
    } else if (top - accepted < band * 0.85) {
      accepted = top;
      lost = false;
    } else {
      lost = true;
    }
    update();
  }, 50);
  update();
  scrolling = { finish: () => stop(true), cancel: () => stop(false) };

  function stop(keep) {
    clearInterval(timer);
    frameEl.remove();
    panel.remove();
    scrolling = null;
    if (keep) showScrollShot(rect, scroller, startTop, accepted);
  }
}

// 拼好的长图：把区域里的窗口复制一份、让滚动的内容整段展开，按区域裁出来缩到卡片宽度，在卡片里上下滚着看
function showScrollShot(rect, scroller, startTop, accepted) {
  const extra = Math.max(accepted - startTop, 0);
  const total = rect.h + extra;
  const [pw, ph] = [Math.round(rect.w * 2), Math.round(total * 2)];
  const anchor = { x: clamp(rect.x + rect.w / 2, 40, stage.clientWidth - 40), y: clamp(rect.y + Math.min(rect.h, 200), MENUBAR + 20, stage.clientHeight - 40) };
  const width = Math.min(348, stage.clientWidth - 64);
  const scale = width / rect.w;
  const shot = h('div', { class: 'shot', style: `width:${rect.w}px;height:${total}px;transform:scale(${scale})` });
  // 桌面：从壁纸画布上裁一块，往下接的部分用最下面一行的颜色
  const ratio = wall.width / Math.max(stage.clientWidth, 1);
  const desk = document.createElement('canvas');
  desk.width = Math.max(1, Math.round(rect.w)); desk.height = Math.max(1, Math.round(total));
  const ctx = desk.getContext('2d');
  const [r, g, b] = wallColorAt(rect.x + rect.w / 2, rect.y + rect.h - 1);
  ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
  ctx.fillRect(0, 0, desk.width, desk.height);
  ctx.drawImage(wall, rect.x * ratio, rect.y * ratio, rect.w * ratio, rect.h * ratio, 0, 0, rect.w, rect.h);
  Object.assign(desk.style, { position: 'absolute', left: '0', top: '0', width: `${rect.w}px`, height: `${total}px` });
  shot.append(desk);
  const win = stage.querySelector('.win');
  if (win) {
    const box = stage.getBoundingClientRect(), wr = win.getBoundingClientRect();
    const copy = win.cloneNode(true);
    Object.assign(copy.style, { left: `${wr.left - box.left - rect.x}px`, top: `${wr.top - box.top - rect.y}px`, width: `${wr.width}px`, height: `${wr.height + extra}px`, right: 'auto', bottom: 'auto' });
    for (const el of copy.querySelectorAll('[data-selection]')) el.removeAttribute('data-selection');
    const content = scroller ? copy.querySelector('.content.scroll') : null;
    if (content) {
      content.style.overflow = 'hidden';
      content.firstElementChild.style.transform = `translateY(${-startTop}px)`;
    }
    shot.append(copy);
  }
  const sizer = h('div', { class: 'sizer', style: `width:${width}px;height:${total * scale}px` }, shot);
  const preview = h('div', { class: 'shot-box', style: `height:${Math.min(260, Math.max(total * scale, 80))}px` }, sizer);
  // 截到的那几段文字（识别文字用）
  const text = () => {
    if (!scroller) return '';
    const top = startTop, bottom = accepted + scroller.clientHeight;
    return [...scroller.querySelectorAll('h2, p')].filter((el) => el.offsetTop + el.offsetHeight > top && el.offsetTop < bottom).map((el) => el.textContent.trim()).join('\n\n');
  };
  const detail = extra > 0
    ? L({ zh: `拼好了一张 ${pw} × ${ph} 像素的长图，约 ${screensText(total, rect.h)} 屏高；按住拖动预览图也能拖到别的 App 里`, en: `Stitched a ${pw} × ${ph} px image, about ${screensText(total, rect.h)} ${screensText(total, rect.h) === '1' ? 'screen' : 'screens'} tall; you can drag the preview into another app` })
    : L({ zh: `没有滚动，只截了一屏（${pw} × ${ph} 像素）；按住拖动预览图也能拖到别的 App 里`, en: `Nothing scrolled, so this is one screen (${pw} × ${ph} px); you can drag the preview into another app` });
  presentCard(cardShell({ title: L(P.scrollCapture.name), children: [preview], detail, buttons: [
    button(lang === 'zh' ? '复制图片' : 'Copy Image', () => showToast(lang === 'zh' ? '已复制图片' : 'Image copied', anchor)),
    button(lang === 'zh' ? '存储' : 'Save', () => showToast(L({ zh: '已存到「下载」：Pop 滚动截图.png', en: 'Saved to Downloads: Pop Scrolling Screenshot.png' }), anchor)),
    button(lang === 'zh' ? '识别文字' : 'Recognize Text', () => {
      const words = text();
      if (words) showOCRResult(words, anchor, lang === 'zh' ? '识别文字' : 'Recognize Text');
      else showToast(lang === 'zh' ? '图片里没有识别到文字' : 'No text found in the image', anchor);
    }),
  ] }), anchor);
}

  hint: { zh: '这些功能是单独的插件包，要用时再装：从 GitHub 发布页下载，几秒就好；不用了可以卸载，连同它的设置一起删掉，不占地方。', en: 'These actions are separate plugins you install when you need them: they download from the GitHub release in a few seconds. Uninstall the ones you don’t use; their settings go with them, so they take up no space.' },
  plugins: { zh: '插件', en: 'Plugins' },
  category: (title) => ({ zh: `插件 · ${title.zh}`, en: `Plugins · ${title.en}` }),
  filters: { all: { zh: '全部', en: 'All' }, installed: { zh: '已安装', en: 'Installed' }, notInstalled: { zh: '未安装', en: 'Not installed' } },
  summary: (count, size) => ({ zh: `已装 ${count} 个插件，一共占用 ${size}`, en: `${count} plugins installed, using ${size}` }),
  none: { zh: '还没有装插件', en: 'No plugins installed yet' },
  noMatch: { zh: '没有匹配的插件', en: 'No matching plugins' },
  installed: (size) => ({ zh: `已安装 · 占用 ${size}`, en: `Installed · uses ${size}` }),
  notInstalled: (download, size) => ({ zh: `未安装 · 下载 ${download}，装好后占用 ${size}`, en: `Not installed · ${download} download, uses ${size} once installed` }),
  downloading: { zh: '正在下载…', en: 'Downloading…' },
  install: { zh: '安装', en: 'Install' },
  uninstall: { zh: '卸载', en: 'Uninstall' },
  cancel: { zh: '取消', en: 'Cancel' },
  confirmTitle: (name) => ({ zh: `卸载「${name.zh}」？`, en: `Uninstall “${name.en}”?` }),
  confirmText: (size) => ({ zh: `会删掉插件包和它的设置，腾出 ${size}。圆盘上和快捷键里的这个功能也会拿掉，要用时可以再装。`, en: `This deletes the plugin and its settings and frees up ${size}. It’s also removed from the ring and shortcuts. You can install it again any time.` }),
  foot: { zh: '下面还有「我的插件」和 Pop 自带功能的开关，试玩里省略了。装上的插件会出现在圆盘的「全部功能」里，卸载的就没有了。', en: 'My Plugins and the switches for Pop’s built-in actions follow below; the demo leaves them out. Installed plugins show up in All Actions on the ring, and uninstalled ones disappear from it.' },
};

const prefs = { filter: 'all', query: '', installing: new Set(), confirming: null, fresh: null, list: null, panel: null };

// 和 App 里的 ByteCountFormatter（.file）一样按 1000 进位：340 KB、1.2 MB
function formatBytes(bytes) {
  if (bytes < 1000) return lang === 'zh' ? `${bytes} 字节` : `${bytes} bytes`;
  const units = ['KB', 'MB', 'GB'];
  let value = bytes / 1000;
  let unit = 0;
  while (value >= 1000 && unit < units.length - 1) { value /= 1000; unit += 1; }
  return `${unit === 0 || value >= 100 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
}

function prefsWindow() {
  const search = h('input', { class: 'search', type: 'search', placeholder: L(PT.search), 'aria-label': L(PT.search), autocomplete: 'off', spellcheck: 'false', value: prefs.query });
  search.addEventListener('input', () => { prefs.query = search.value.trim().toLowerCase(); renderPrefsList(); });
  prefs.list = h('div');
  prefs.panel = h('div', { class: 'prefs' }, search, prefs.list);
  const win = h('div', { class: 'win prefs-win' },
    h('div', { class: 'bar' }, trafficLights(), h('span', { class: 'title' }, L(PT.title))),
    h('div', { class: 'ptabs', title: L(PT.tabHint) }, PT.tabs.map(([iconName, label]) => h('span', { class: iconName === 'allPlugins' ? 'on' : '' }, icon(iconName), L(label)))),
    h('div', { class: 'content' }, prefs.panel));
  renderPrefsList();
  return win;
}

function matchesPrefs(pkg) {
  if (prefs.filter === 'installed' && !state.installed.has(pkg.id)) return false;
  if (prefs.filter === 'notInstalled' && state.installed.has(pkg.id)) return false;
  if (!prefs.query) return true;
  return [pkg.name.zh, pkg.name.en.toLowerCase(), pkg.summary.zh, pkg.summary.en.toLowerCase(), pkg.id.toLowerCase()].some((key) => key.includes(prefs.query));
}

function renderPrefsList() {
  if (!prefs.list) return;
  const installed = PACKAGES.filter((pkg) => state.installed.has(pkg.id));
  const total = installed.reduce((sum, pkg) => sum + pkg.size, 0);
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': L(PT.plugins) }, Object.keys(PT.filters).map((key) => h('button', {
    type: 'button', 'aria-pressed': String(prefs.filter === key), onclick: () => { prefs.filter = key; renderPrefsList(); },
  }, L(PT.filters[key]))));
  const shown = PACKAGES.filter(matchesPrefs);
  const groups = CATEGORY_ORDER.map((category) => [category, shown.filter((pkg) => pkg.category === category)]).filter(([, list]) => list.length);
  prefs.list.replaceChildren(
    h('div', { class: 'pgroup' },
      h('div', { class: 'ghint' }, L(PT.hint)),
      h('div', { class: 'gtitle' }, L(PT.plugins)),
      h('div', { class: 'pbox' },
        h('div', { class: 'prow summary' }, h('div', { class: 'pt' }, installed.length ? L(PT.summary(installed.length, formatBytes(total))) : L(PT.none)), seg),
        shown.length ? null : h('div', { class: 'prow' }, h('div', { class: 'pt ps' }, prefs.filter === 'installed' && !prefs.query ? L(PT.none) : L(PT.noMatch))))),
    ...groups.map(([category, list]) => h('div', { class: 'pgroup' },
      h('div', { class: 'gtitle' }, L(PT.category(CATEGORY_TITLES[category]))),
      h('div', { class: 'pbox' }, list.map(prefsRow)))),
    h('div', { class: 'pfoot' }, L(PT.foot)),
    null);
  prefs.panel.closest('.win')?.querySelector('.palert-dim')?.remove();
  if (prefs.confirming) prefs.panel.closest('.win')?.append(confirmUninstall(PACKAGES.find((pkg) => pkg.id === prefs.confirming)));
  prefs.fresh = null;
}

function prefsRow(pkg) {
  const busy = prefs.installing.has(pkg.id);
  const installed = state.installed.has(pkg.id);
  let detail;
  let action;
  if (busy) {
    detail = h('div', { class: 'pd busy' }, L(PT.downloading));
    action = h('div', { class: 'spinner', role: 'progressbar', 'aria-label': L(PT.downloading) });
  } else if (installed) {
    detail = h('div', { class: 'pd' }, L(PT.installed(formatBytes(pkg.size))));
    action = button(L(PT.uninstall), () => { prefs.confirming = pkg.id; renderPrefsList(); });
  } else {
    detail = h('div', { class: 'pd' }, L(PT.notInstalled(formatBytes(pkg.download), formatBytes(pkg.size))));
    action = button(L(PT.install), () => installPackage(pkg));
  }
  return h('div', { class: 'prow' + (prefs.fresh === pkg.id ? ' fresh' : '') }, icon(pkg.icon),
    h('div', { class: 'pt' }, h('div', { class: 'pn' }, L(pkg.name)), h('div', { class: 'ps' }, L(pkg.summary)), detail), action);
}

// 装上：先「正在下载…」，下好了当场能用
function installPackage(pkg) {
  prefs.installing.add(pkg.id);
  renderPrefsList();
  setTimeout(() => {
    prefs.installing.delete(pkg.id);
    state.installed.add(pkg.id);
    saveInstalled();
    prefs.fresh = pkg.id;
    renderPrefsList();
  }, reduced() ? 300 : 700 + Math.random() * 900);
}

// 卸载之前先问一句，说明会腾出多少空间
function confirmUninstall(pkg) {
  const close = () => { prefs.confirming = null; renderPrefsList(); };
  const confirm = h('button', { type: 'button', class: 'default', onclick: () => {
    state.installed.delete(pkg.id);
    saveInstalled();
    ({ spotlight: () => spotlight?.stop(), pointerHighlight: () => halo?.stop() })[pkg.id]?.();
    close();
  } }, L(PT.uninstall));
  const logo = $('.logo').cloneNode(true);
  logo.setAttribute('class', 'logo-copy');
  for (const el of logo.querySelectorAll('[id]')) el.removeAttribute('id');
  const dim = h('div', { class: 'palert-dim', onpointerdown: (event) => { if (event.target === dim) close(); } },
    h('div', { class: 'palert', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': L(PT.confirmTitle(pkg.name)) },
      logo, h('b', null, L(PT.confirmTitle(pkg.name))), h('p', null, L(PT.confirmText(formatBytes(pkg.size)))),
      h('div', { class: 'btns2' }, h('button', { type: 'button', onclick: close }, L(PT.cancel)), confirm)));
  dim.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.stopPropagation(); event.preventDefault(); close(); } });
  setTimeout(() => confirm.focus({ preventScroll: true }));
  return dim;
}

// ---------- 指针和键盘 ----------
let press = null;

// 访达里点文件：换一个选中的；按住 ⌘、Ctrl 或 Shift 点是多选；点已经选中的文件不改变选择
function selectFileAt(event) {
  const fileEl = event.target.closest('[data-file]');
  if (!fileEl || state.scene !== 'files') return;
  const key = fileEl.dataset.file;
  if (event.metaKey || event.ctrlKey || event.shiftKey) {
    if (!state.selected.includes(key)) state.selected = [...state.selected, key];
    else if (state.selected.length > 1) state.selected = state.selected.filter((item) => item !== key);
  } else if (!state.selected.includes(key)) {
    state.selected = [key];
  } else {
    return;
  }
  const all = stage.querySelectorAll('[data-file]');
  for (const el of all) {
    el.classList.toggle('on', state.selected.includes(el.dataset.file));
    if (el.dataset.file === state.selected[0]) el.setAttribute('data-selection', ''); else el.removeAttribute('data-selection');
  }
  const status = $('#finder-status');
  if (status) status.textContent = finderStatus(all.length);
}

stage.addEventListener('contextmenu', (event) => event.preventDefault());

stage.addEventListener('pointerdown', (event) => {
  if (picker || scrolling || event.target.closest('.card, .toast, .pin, .rec-panel, .vr-bar, .scroll-panel, .fx, .picker, .prefs-win')) return;
  if (event.button > 2) return;
  // 按住 ⌘、Ctrl 或 Shift 点文件是多选，不弹圆盘
  if (state.scene === 'files' && (event.metaKey || event.ctrlKey || event.shiftKey) && event.target.closest('[data-file]')) {
    closeRing(false);
    dismissCard(false);
    selectFileAt(event);
    press = null;
    return;
  }
  const point = stagePoint(event);
  if (ring) {
    press = { id: event.pointerId, x: point.x, y: point.y, onRing: true, type: event.pointerType };
    if (ring.mode === 'click') ring.pointer(point);
    return;
  }
  let dismissed = false;
  if (card) { dismissCard(); dismissed = true; }
  if (toast) dismissToast();
  selectFileAt(event);
  press = { id: event.pointerId, x: point.x, y: point.y, type: event.pointerType, held: false, moved: false, dismissed };
  press.timer = setTimeout(() => {
    if (!press || press.moved) return;
    press.held = true;
    if (state.scene === 'foreign' && !event.target.closest('.menubar')) {
      // 选中了外文：按住直接翻译
      press.direct = true;
      showTranslation(currentContent().text, { x: press.x, y: press.y });
    } else {
      openRing(press.x, press.y, 'drag');
    }
  }, M.hold);
});

window.addEventListener('pointermove', (event) => {
  if (picker) return;
  const point = stagePoint(event);
  if (press && event.pointerId === press.id && !press.held && !press.onRing) {
    if (Math.hypot(point.x - press.x, point.y - press.y) > 8) {
      press.moved = true;
      clearTimeout(press.timer);
    }
  }
  if (!ring) return;
  if (ring.mode === 'drag' || (press && press.onRing && event.pointerId === press.id) || event.pointerType === 'mouse') ring.pointer(point);
});

window.addEventListener('pointerup', (event) => {
  if (!press || event.pointerId !== press.id) return;
  const current = press;
  press = null;
  clearTimeout(current.timer);
  if (current.direct) return;
  const point = stagePoint(event);
  if (current.onRing) { if (ring) ring.click(point); return; }
  if (current.held) { if (ring) ring.release(point); return; }
  if (current.dismissed || current.moved) return;
  openRing(current.x, current.y, 'click');
});

window.addEventListener('pointercancel', (event) => {
  if (!press || event.pointerId !== press.id) return;
  clearTimeout(press.timer);
  press = null;
});

stage.addEventListener('touchmove', (event) => { if ((press && press.held) || picker) event.preventDefault(); }, { passive: false });

document.addEventListener('keydown', (event) => {
  // 清洁键盘的时候按键都不管用
  if (cleaning) { event.preventDefault(); return; }
  keycaps?.key(event);
  if (pen && pen.key(event)) { event.preventDefault(); return; }
  // 提词器只在别的浮窗都没开、也没在输入框里打字时接按键
  if (prompter && !ring && !card && !picker && !event.target.closest?.('input, textarea, [contenteditable]') && prompter.key(event)) { event.preventDefault(); return; }
  if (largeType) { largeType.key(event); event.preventDefault(); return; }
  if (scrolling) {
    if (event.key === 'Escape') { scrolling.cancel(); event.preventDefault(); }
    return;
  }
  if (picker) {
    if (event.key === 'Escape') { picker.cancel(); event.preventDefault(); return; }
    if (picker.key(event)) event.preventDefault();
    return;
  }
  if (event.key === 'Escape') {
    if (ring) { closeRing(); event.preventDefault(); return; }
    if (card) { dismissCard(); event.preventDefault(); return; }
    const fx = stage.querySelector('.fx');
    if (fx) { fx.dispatchEvent(new PointerEvent('pointerdown')); return; }
  }
  if (card && card.onKey && card.onKey(event)) { event.preventDefault(); return; }
  if (ring && ring.phase === 'shown') {
    if (/^[1-9]$/.test(event.key)) {
      const index = Number(event.key) - 1;
      if (index < ring.count) { ring.setHovered(index); if (!ring.loading && ring.slots[index].enabled) ring.commitAndRun(index); }
      event.preventDefault();
      return;
    }
    if (['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(event.key)) {
      const delta = event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 1;
      const startIndex = ring.hovered ?? (delta > 0 ? -1 : 0);
      ring.setHovered(((startIndex + delta) % ring.count + ring.count) % ring.count);
      event.preventDefault();
      return;
    }
    if (event.key === 'Enter' && ring.hovered != null) {
      if (!ring.loading && ring.slots[ring.hovered].enabled) ring.commitAndRun(ring.hovered);
      event.preventDefault();
      return;
    }
  }
  if (document.activeElement === stage && !ring && !card && (event.key === 'Enter' || event.key === ' ')) {
    const anchor = defaultAnchor();
    openRing(anchor.x, anchor.y, 'click');
    event.preventDefault();
  }
});

// 点桌面外面：收起圆盘和卡片
document.addEventListener('pointerdown', (event) => {
  if (stage.contains(event.target)) return;
  closeRing();
  dismissCard();
});

$('#scenes').addEventListener('click', (event) => {
  const tab = event.target.closest('[data-scene]');
  if (!tab || tab.dataset.scene === state.scene) return;
  switchScene(tab.dataset.scene);
});

$('#scenes').addEventListener('keydown', (event) => {
  if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
  const ids = ['foreign', 'link', 'files', 'none', 'plugins'];
  const next = ids[(ids.indexOf(state.scene) + (event.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length];
  switchScene(next);
  $(`#scenes [data-scene="${next}"]`)?.focus();
});

$('#lang-switch').addEventListener('click', (event) => {
  const choice = event.target.closest('[data-lang]');
  if (!choice || choice.dataset.lang === lang) return;
  lang = choice.dataset.lang;
  try { localStorage.setItem('pop-demo-lang', lang); } catch (error) { /* 不能存就只管这一次 */ }
  resetOverlays();
  renderAll();
});

function resetOverlays() {
  closeRing(false);
  dismissCard(false);
  dismissToast(false);
  picker?.cancel();
  recording?.abort();
  scrolling?.cancel();
  cleaning?.stop();
  if (largeType) { stage.querySelector('.large-type')?.remove(); largeType = null; }
  for (const el of stage.querySelectorAll('.pin, .fx')) el.remove();
}

function switchScene(id) {
  resetOverlays();
  state.scene = id;
  renderAll();
  // 换了场景，在选中的内容上弹出圆盘；设置窗口不用
  if (id === 'plugins') return;
  setTimeout(() => { const anchor = defaultAnchor(); openRing(anchor.x, anchor.y, 'click'); }, 120);
}

// 系统换了深浅色：壁纸重画
const repaint = () => drawWall();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
new ResizeObserver(() => { drawWall(); }).observe(stage);
setInterval(renderMenubar, 30000);

renderAll();
drawWall();
// 打开页面时先在选中的文字上弹出圆盘，看看它长什么样
setTimeout(() => { if (!ring && !card) { const anchor = defaultAnchor(); openRing(anchor.x, anchor.y, 'click'); } }, 450);
})();
</script>
</body>
