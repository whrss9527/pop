<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop 试玩</title>
<style>
/* 布局：一行介绍和开关，下面是一整块能点的 Mac 桌面；桌面里的圆盘、卡片按 App 的尺寸和动画参数还原 */
:root {
  --page: #f1f2f8;
  --surface: #ffffff;
  --ink: #161927;
  --ink-2: #5a6074;
  --line: rgba(22, 25, 39, .12);
  --chip: rgba(22, 25, 39, .06);
  --brand: #5668ff;
  --brand-ink: #ffffff;

  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, .2);
  --label: rgba(0, 0, 0, .86);
  --label-2: rgba(60, 60, 67, .66);
  --label-3: rgba(60, 60, 67, .34);
  --fill: rgba(120, 120, 128, .16);
  --fill-2: rgba(120, 120, 128, .09);
  --hover: rgba(0, 0, 0, .05);
  --sep: rgba(60, 60, 67, .16);
  --btn: rgba(255, 255, 255, .72);
  --btn-hover: rgba(255, 255, 255, .92);
  --btn-press: rgba(225, 225, 232, .9);
  --btn-stroke: rgba(0, 0, 0, .12);
  --field: rgba(255, 255, 255, .78);
  --field-stroke: rgba(0, 0, 0, .16);
  --glass: rgba(246, 246, 250, .6);
  --sheen-top: rgba(255, 255, 255, .22);
  --sheen-bottom: rgba(255, 255, 255, .02);
  --glass-hi: rgba(255, 255, 255, .8);
  --glass-lo: rgba(255, 255, 255, .1);
  --glass-stroke: rgba(0, 0, 0, .12);
  --glass-shadow: 0 10px 30px rgba(16, 20, 44, .24), 0 2px 6px rgba(16, 20, 44, .1);
  --hub-fill: rgba(0, 0, 0, .045);
  --hub-stroke: rgba(0, 0, 0, .1);
  --win: #ffffff;
  --win-bar: #f4f4f7;
  --win-side: #ececf1;
  --win-text: #1d1d1f;
  --win-text-2: #6e6e73;
  --menubar: rgba(255, 255, 255, .46);
  --menubar-ink: #111114;
  --sel: #b3d7ff;
  --note-on: rgba(255, 199, 0, .38);
  --pin-bg: #fffdf5;
  --pin-ink: #1d1d1f;
  --rec: #ff3b30;
  --wall-mode: light;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --serif: "New York", "Iowan Old Style", "Palatino Linotype", Georgia, "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0e14; --surface: #252733; --ink: #eceef7; --ink-2: #9ca2b6; --line: rgba(236, 238, 247, .14); --chip: rgba(236, 238, 247, .08);
    --brand: #7f8cff; --brand-ink: #0d0e14;
    --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, .26); --label: rgba(255, 255, 255, .9); --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
    --fill: rgba(120, 120, 128, .34); --fill-2: rgba(120, 120, 128, .2); --hover: rgba(255, 255, 255, .07); --sep: rgba(84, 84, 88, .6);
    --btn: rgba(255, 255, 255, .14); --btn-hover: rgba(255, 255, 255, .2); --btn-press: rgba(255, 255, 255, .1); --btn-stroke: rgba(255, 255, 255, .08);
    --field: rgba(0, 0, 0, .22); --field-stroke: rgba(255, 255, 255, .14);
    --glass: rgba(38, 38, 44, .6); --sheen-top: rgba(255, 255, 255, .08); --sheen-bottom: rgba(255, 255, 255, 0); --glass-hi: rgba(255, 255, 255, .34); --glass-lo: rgba(255, 255, 255, .04); --glass-stroke: rgba(0, 0, 0, .5);
    --glass-shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --hub-fill: rgba(255, 255, 255, .06); --hub-stroke: rgba(255, 255, 255, .12);
    --win: #1e1e21; --win-bar: #2a2a2e; --win-side: #252528; --win-text: #f2f2f7; --win-text-2: #98989f;
    --menubar: rgba(18, 18, 24, .42); --menubar-ink: #f5f5f7; --sel: #3f638b; --note-on: rgba(255, 199, 0, .3);
    --pin-bg: #2c2c30; --pin-ink: #f2f2f7; --rec: #ff453a; --wall-mode: dark;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0e14; --surface: #252733; --ink: #eceef7; --ink-2: #9ca2b6; --line: rgba(236, 238, 247, .14); --chip: rgba(236, 238, 247, .08);
  --brand: #7f8cff; --brand-ink: #0d0e14;
  --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, .26); --label: rgba(255, 255, 255, .9); --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
  --fill: rgba(120, 120, 128, .34); --fill-2: rgba(120, 120, 128, .2); --hover: rgba(255, 255, 255, .07); --sep: rgba(84, 84, 88, .6);
  --btn: rgba(255, 255, 255, .14); --btn-hover: rgba(255, 255, 255, .2); --btn-press: rgba(255, 255, 255, .1); --btn-stroke: rgba(255, 255, 255, .08);
  --field: rgba(0, 0, 0, .22); --field-stroke: rgba(255, 255, 255, .14);
  --glass: rgba(38, 38, 44, .6); --sheen-top: rgba(255, 255, 255, .08); --sheen-bottom: rgba(255, 255, 255, 0); --glass-hi: rgba(255, 255, 255, .34); --glass-lo: rgba(255, 255, 255, .04); --glass-stroke: rgba(0, 0, 0, .5);
  --glass-shadow: 0 12px 34px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --hub-fill: rgba(255, 255, 255, .06); --hub-stroke: rgba(255, 255, 255, .12);
  --win: #1e1e21; --win-bar: #2a2a2e; --win-side: #252528; --win-text: #f2f2f7; --win-text-2: #98989f;
  --menubar: rgba(18, 18, 24, .42); --menubar-ink: #f5f5f7; --sel: #3f638b; --note-on: rgba(255, 199, 0, .3);
  --pin-bg: #2c2c30; --pin-ink: #f2f2f7; --rec: #ff453a; --wall-mode: dark;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.page { max-width: 1140px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 30px; display: flex; flex-direction: column; gap: 14px; }
.intro { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.intro .logo { width: 46px; height: 46px; flex: none; }
.intro .text { flex: 1; min-width: 220px; }
.intro h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 750; letter-spacing: -.01em; text-wrap: balance; }
.intro h1 span { color: var(--ink-2); font-weight: 500; margin-left: 8px; font-size: 15px; letter-spacing: 0; }
.intro p { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 64ch; }
.switch { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 2px; }
.switch button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font-size: 12.5px; padding: 4px 11px; border-radius: 7px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.switch button:focus-visible, .scenes button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.scenes { display: flex; gap: 6px; flex-wrap: wrap; }
.scenes button { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; padding: 5px 12px 5px 9px; border-radius: 999px; cursor: pointer; }
.scenes button svg { width: 16px; height: 16px; color: var(--ink-2); }
.scenes button[aria-selected="true"] { background: var(--brand); border-color: transparent; color: var(--brand-ink); }
.scenes button[aria-selected="true"] svg { color: currentColor; }

.hint { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-2); }
.hint b { color: var(--ink); font-weight: 600; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 12px; }
.foot a { color: var(--brand); text-decoration: none; font-weight: 600; }
.foot a:hover { text-decoration: underline; }
.foot .blurb { flex: 1; min-width: 240px; }

/* ---------- 桌面 ---------- */
.stage { position: relative; height: clamp(560px, 62vw, 690px); border-radius: 16px; overflow: hidden; isolation: isolate; background: #9aa8e8; color: var(--label);
  box-shadow: 0 22px 56px -16px rgba(18, 22, 60, .38), 0 0 0 1px var(--line); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; cursor: default; outline: none; }
.stage:focus-visible { box-shadow: 0 0 0 3px var(--brand), 0 22px 56px -16px rgba(18, 22, 60, .38); }
.stage canvas.wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px; font-size: 12.5px; color: var(--menubar-ink); background: var(--menubar);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); z-index: 3; white-space: nowrap; }
.menubar .app { font-weight: 700; }
.menubar .menus { display: flex; gap: 18px; overflow: hidden; }
.menubar .right { margin-left: auto; display: flex; gap: 13px; align-items: center; }
.menubar svg { width: 15px; height: 15px; display: block; }
.menubar .pop-status { width: 16px; height: 16px; }
@media (max-width: 720px) { .menubar .menus { display: none; } }

.desk { position: absolute; right: 16px; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 1; transition: opacity .35s ease; }
.desk.hidden { opacity: 0; pointer-events: none; }
.desk .item { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; line-height: 1.25; color: #fff; text-align: center; text-shadow: 0 1px 2px rgba(0, 0, 0, .55); transition: opacity .4s ease, transform .4s ease; }
.desk .item.gone { opacity: 0; transform: scale(.6); }
.desk .item .thumb { width: 52px; height: 52px; }

.win { position: absolute; left: clamp(12px, 5%, 64px); right: clamp(12px, 15%, 190px); top: 44px; bottom: 24px; background: var(--win); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; z-index: 2; color: var(--win-text);
  box-shadow: 0 24px 54px rgba(0, 0, 0, .3), 0 0 0 .5px rgba(0, 0, 0, .28); }
.win .bar { height: 46px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--win-bar); border-bottom: 1px solid var(--sep); }
.lights { display: flex; gap: 8px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.bar .nav { display: flex; gap: 14px; color: var(--win-text-2); flex: none; }
.bar .nav svg { width: 15px; height: 15px; display: block; }
.bar .title { font-size: 13px; font-weight: 600; flex: none; }
.addr { flex: 1; min-width: 0; height: 28px; border-radius: 8px; background: var(--fill-2); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--win-text-2); white-space: nowrap; overflow: hidden; padding: 0 10px; }
.addr span { overflow: hidden; text-overflow: ellipsis; }
.win .content { flex: 1; min-height: 0; overflow: hidden; position: relative; }

.article { max-width: 620px; margin: 0 auto; padding: 34px 30px; font-family: var(--serif); font-size: 17px; line-height: 1.7; }
.article h2 { font: 700 28px/1.2 var(--font); margin: 0 0 6px; letter-spacing: -.012em; text-wrap: balance; }
.article .meta { font: 13px/1.4 var(--font); color: var(--win-text-2); margin-bottom: 20px; }
.article p { margin: 0 0 14px; }
.sel { background: var(--sel); border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.notes { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); height: 100%; }
.notes .side { background: var(--win-side); border-right: 1px solid var(--sep); padding: 12px 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.note-item { padding: 8px 10px; border-radius: 8px; }
.note-item b { display: block; font-size: 13px; }
.note-item span { color: var(--win-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.note-item.on { background: var(--note-on); }
.note { padding: 22px 28px; font-size: 14.5px; line-height: 1.75; overflow: hidden; }
.note h3 { margin: 0 0 8px; font-size: 20px; }
.note p { margin: 0 0 8px; }
.note .url { word-break: break-all; }
@media (max-width: 720px) { .notes { grid-template-columns: 1fr; } .notes .side { display: none; } }

.finder { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr); height: 100%; }
.finder .side { background: var(--win-side); border-right: 1px solid var(--sep); padding: 12px 8px; font-size: 12.5px; display: flex; flex-direction: column; gap: 1px; }
.finder .side .h { font-size: 11px; font-weight: 600; color: var(--win-text-2); padding: 4px 10px; }
.finder .side .it { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; }
.finder .side .it svg { width: 15px; height: 15px; color: var(--accent); }
.finder .side .it.on { background: var(--fill); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px 6px; padding: 18px; align-content: start; overflow: hidden; }
.file { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 2px; font-size: 12px; line-height: 1.3; text-align: center; }
.file .thumb { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 8px; }
.file .name { max-width: 92px; padding: 1px 5px; border-radius: 5px; word-break: break-all; }
.file.on .thumb { background: var(--fill); }
.file.on .name { background: var(--accent); color: #fff; }
.file.fresh { animation: fresh .5s cubic-bezier(.2, .9, .3, 1.2); }
/* 隐藏文件淡一些，和访达里一样 */
.file.hidden-file .thumb, .file.hidden-file .name { opacity: .5; }
.finder-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.finder-main .files { flex: 1; min-height: 0; }
.statusbar { flex: none; font-size: 11px; color: var(--win-text-2); padding: 6px 14px; border-top: 1px solid var(--sep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes fresh { from { opacity: 0; transform: scale(.6); } }
@media (max-width: 720px) { .finder { grid-template-columns: 1fr; } .finder .side { display: none; } }

/* 文件图标 */
.fi { position: relative; width: 48px; height: 58px; }
.fi.doc { background: #fff; border-radius: 3px 12px 3px 3px; box-shadow: 0 1px 3px rgba(0, 0, 0, .25), inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.fi.doc::after { content: ""; position: absolute; right: 0; top: 0; width: 12px; height: 12px; background: linear-gradient(225deg, transparent 50%, #dcdce2 50%); border-radius: 0 12px 0 3px; }
.fi.doc .tag { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font: 700 9px/1 var(--font); color: #fff; padding: 2px 4px; border-radius: 3px; letter-spacing: .02em; }
.fi.doc .wave { position: absolute; inset: 14px 9px 22px; display: flex; align-items: center; gap: 2px; }
.fi.doc .wave i { flex: 1; background: #8e8e93; border-radius: 1px; }
.fi.photo { width: 58px; height: 44px; border-radius: 3px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); background: linear-gradient(180deg, #ffb36b 0%, #ff8a7a 34%, #7a8cff 58%, #3553c9 60%, #2a3f8f 100%); overflow: hidden; }
.fi.photo::after { content: ""; position: absolute; left: 50%; top: 42%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #fff3c4; box-shadow: 0 0 10px #ffe08a; }
.fi.video { width: 58px; height: 40px; border-radius: 4px; background: linear-gradient(135deg, #2c2c34, #111); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); display: grid; place-items: center; }
.fi.video::before { content: ""; border-left: 12px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px; }
.fi.video .strip { position: absolute; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(90deg, #fff 0 3px, transparent 3px 7px); opacity: .5; }
.fi.video .strip.t { top: 2px; } .fi.video .strip.b { bottom: 2px; }
.fi.shot { width: 44px; height: 58px; border-radius: 6px; background: #f2f2f7; box-shadow: 0 1px 3px rgba(0, 0, 0, .3), inset 0 0 0 .5px rgba(0, 0, 0, .15); display: flex; flex-direction: column; gap: 5px; padding: 9px 5px; }
.fi.shot i { display: block; height: 7px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .12); width: 70%; }
.fi.shot i:nth-child(2) { align-self: flex-end; background: #0a84ff; width: 62%; }
.fi.logo { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #5966ff, #ff6b9e); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); display: grid; place-items: center; }
.fi.logo i { width: 25px; height: 17px; border-radius: 6px; background: #fff; }
.fi.app { width: 50px; height: 50px; border-radius: 12px; background: linear-gradient(160deg, #ffb340, #ff6a3d); box-shadow: 0 1px 3px rgba(0, 0, 0, .3), inset 0 0 0 .5px rgba(0, 0, 0, .12); display: grid; place-items: center; color: #fff; font: 600 26px/1 var(--font); }
.fi.folder { width: 60px; height: 46px; }
.fi.folder::before { content: ""; position: absolute; left: 0; top: 0; width: 26px; height: 10px; background: #5aa9f4; border-radius: 4px 4px 0 0; }
.fi.folder::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; bottom: 0; background: linear-gradient(#7cc1ff, #4a9ff0); border-radius: 3px 5px 5px 5px; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.fi.disk { width: 54px; height: 40px; border-radius: 7px; background: linear-gradient(#f4f4f6, #c9c9cf); box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 -3px 0 rgba(0, 0, 0, .1); }
.fi.disk::after { content: ""; position: absolute; right: 8px; bottom: 9px; width: 5px; height: 5px; border-radius: 50%; background: #34c759; }

/* ---------- 浮层 ---------- */
.layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.layer > * { pointer-events: auto; }
.layer > .ring, .layer > .rec-frame, .layer > .click-dot, .layer > .loupe { pointer-events: none; }

.glass { position: relative; background: linear-gradient(180deg, var(--sheen-top), var(--sheen-bottom)), var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-stroke); }
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, var(--glass-hi), var(--glass-lo) 58%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.ring { position: absolute; left: 0; top: 0; }
.ring .disc { position: absolute; inset: 0; border-radius: 50%; }
.ring .hl { position: absolute; inset: 0; overflow: visible; }
.slot { position: absolute; left: 50%; top: 50%; width: 66px; height: 40px; margin: -20px 0 0 -33px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--label); transition: color .18s ease; }
.slot svg { width: 21px; height: 22px; flex: none; }
.slot .n { font-size: 10.5px; line-height: 13px; max-width: 66px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot.active { color: var(--accent); }
.slot.active .n { font-weight: 600; }
.slot .empty { width: 5px; height: 5px; border-radius: 50%; background: var(--label-3); margin-top: 17px; }
.hub { position: absolute; left: 50%; top: 50%; border-radius: 50%; background: var(--hub-fill); box-shadow: inset 0 0 0 1px var(--hub-stroke); }
.hub svg { position: absolute; inset: 0; overflow: visible; }
.hub .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 5px; }
.hub .t { font-size: 10px; font-weight: 500; line-height: 1.25; color: var(--label-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.hub .t.fn { font-size: 11px; font-weight: 600; color: var(--accent); }
.hub .t.fn.off { color: var(--label-2); }
.hub .d { font-size: 9px; line-height: 1.2; color: var(--label-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hub .label.swap { animation: swap .2s ease-out; }
@keyframes swap { from { opacity: .2; } }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--label-3); border-top-color: var(--label-2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 聚光灯：压暗的一层，指针那里挖掉一个边缘柔和的圆；在卡片、圆盘、显示按键、摄像头小窗和指针光圈下面 */
.spotlight { position: absolute; inset: 0; z-index: 15; pointer-events: none; background: rgba(0, 0, 0, .62); animation: fadeIn .2s ease-out;
  -webkit-mask-image: radial-gradient(circle var(--r, 150px) at var(--x, 50%) var(--y, 50%), transparent 70%, #000 100%);
  mask-image: radial-gradient(circle var(--r, 150px) at var(--x, 50%) var(--y, 50%), transparent 70%, #000 100%); }
/* 截图美化 */

/* 左边一列按最长的那个名字排齐 */

.ci-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 生成图标：三种样子 */
.ai-previews { height: 170px; border-radius: 8px; background: var(--fill-2); display: flex; align-items: flex-end; justify-content: center; gap: 28px; padding-bottom: 12px; }
.ai-col { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.ai-col > span { font-size: 10px; color: var(--label-2); }
.ai-mac canvas { display: block; width: 112px; height: 112px; }
.ai-ios canvas { display: block; width: 60px; height: 60px; border-radius: 13.5px; box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.ai-tab { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; background: var(--fill); font-size: 11px; color: var(--label); max-width: 120px; }
.ai-tab > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-fav canvas { display: block; width: 16px; height: 16px; }
.bt-opts > [hidden] { display: none; }
/* 退出 App：每个 App 一行 */
.qa-list { display: flex; flex-direction: column; gap: 2px; max-height: 304px; overflow-y: auto; }
.qa-row { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: 7px; background: var(--fill-1, rgba(127, 127, 127, .06)); transition: opacity .2s, transform .2s; }
.qa-row.gone { opacity: 0; transform: translateX(12px); }
.qa-icon { width: 24px; height: 24px; flex: none; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.qa-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.qa-tag { flex: none; font-size: 10px; color: var(--label-2); background: var(--fill-2); border-radius: 99px; padding: 1px 6px; }
.qa-cpu { margin-left: auto; flex: none; width: 44px; text-align: right; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.qa-cpu.hot { color: #ff9f0a; }
.qa-mem { flex: none; min-width: 56px; text-align: right; font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.qa-act { flex: none; min-width: 64px; display: flex; justify-content: flex-end; }
.qa-act .spinner { width: 14px; height: 14px; border-width: 1.6px; margin-right: 18px; }
.qa-act .mbtn.danger { color: #e5484d; }
.qa-empty { display: grid; place-items: center; min-height: 80px; color: var(--label-2); font-size: 13px; }
.qa-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qa-foot .space { flex: 1; }
/* 卸载 App */
.un-head { display: flex; align-items: center; gap: 10px; }
.un-icon { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; flex: none; }
.un-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.un-name b { font-size: 13px; }
.un-name span, .un-size span { font-size: 10.5px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.un-size { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.un-total { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.un-body { display: flex; flex-direction: column; gap: 10px; }
.un-list { max-height: 252px; }
.un-row { cursor: pointer; gap: 8px; }
.un-row input { margin: 0; accent-color: var(--accent); flex: none; }
.un-glyph { display: grid; place-items: center; width: 16px; color: var(--label-2); flex: none; }
.un-glyph svg { width: 15px; height: 15px; }
.un-where { display: flex; flex-direction: column; min-width: 0; flex: 1; font-size: 12px; }
.un-where small { font-size: 10px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.un-doubt { font-style: normal; font-size: 9px; margin-left: 4px; display: inline-grid; place-items: center; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--label-3); color: var(--label-2); vertical-align: 1px; }
.un-warn { font-size: 11px; color: #ff9f0a; }
/* 相似照片 */
.sm-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.sm-group { display: flex; gap: 6px; padding: 6px; border-radius: 8px; background: var(--fill-1, rgba(127, 127, 127, .06)); overflow-x: auto; }
.sm-tile { position: relative; flex: none; width: 76px; height: 76px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--fill-2); }
.sm-tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: opacity .15s; }
.sm-tile.marked img { opacity: .45; }
.sm-badge { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font: 700 10px/1 var(--font); font-style: normal; color: #fff; background: #34c759; }
.sm-tile.marked .sm-badge { background: #ff3b30; }
.sm-keep { position: absolute; left: 4px; bottom: 4px; font: 600 9px/1 var(--font); color: #fff; background: #34c759; padding: 2px 5px; border-radius: 99px; }
/* App 信息 */
.ai-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: baseline; }
.ai-grid span { font-size: 11px; color: var(--label-2); text-align: right; }
.ai-grid b { font-weight: 400; font-size: 12.5px; color: var(--label); overflow-wrap: anywhere; }
.ai-perms { display: flex; flex-direction: column; gap: 6px; }
.ai-perms > span { font-size: 11px; color: var(--label-2); }
.ai-perms div { display: flex; flex-wrap: wrap; gap: 6px; }
.ai-perms i { font-style: normal; font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--fill-2); color: var(--label); cursor: help; }
/* 媒体信息 */
.mi-head { font-variant-numeric: tabular-nums; }
.mi-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
.mi-sec > span { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 600; color: var(--label-2); }
.mi-sec .ai-grid b { font-variant-numeric: tabular-nums; }
.mi-sec .ai-grid b.warn { color: #ff9f0a; }
.mi-note { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 8px; background: rgba(255, 159, 10, 0.1); font-size: 11px; color: var(--label-2); }
.mi-note div { display: flex; flex-wrap: wrap; gap: 8px; }
/* 字幕工具 */
.sub-files { display: flex; flex-direction: column; gap: 3px; }
.sub-files div { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.sub-files b { flex: none; max-width: 48%; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub-files span { min-width: 0; font-size: 11px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.sub-preview { display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 8px; background: var(--fill-2); }
.sub-preview div { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px; align-items: baseline; }
.sub-preview code { font: 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--label-2); }
.sub-preview span { font-size: 12.5px; color: var(--label); white-space: pre-line; overflow-wrap: anywhere; }
.sub-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 10px; align-items: center; }
.sub-grid > span { font-size: 11px; color: var(--label-2); text-align: right; }
.sub-grid > div { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; min-width: 0; }
.sub-num { width: 64px; font: 11.5px var(--font); color: var(--label); background: var(--fill-2); border: 0; border-radius: 6px; padding: 3px 6px; text-align: right; font-variant-numeric: tabular-nums; }
.sub-hint { font-size: 11px; color: var(--label-2); }
.sub-check { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; color: var(--label); }
.sub-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sub-foot span { flex: 1; min-width: 0; font-size: 11px; color: var(--label-2); }
/* 字体预览 */
.fp-text { width: 100%; box-sizing: border-box; resize: none; font: 13px var(--font); color: var(--label); background: var(--fill-2); border: 0; border-radius: 7px; padding: 6px 8px; }
.fp-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.fp-bar input[type=range] { width: 130px; }
.fp-a { font-size: 15px; color: var(--label-2); }
.fp-a.small { font-size: 10px; }
.fp-size { width: 22px; text-align: right; font-size: 11px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.fp-search { width: 120px; font: 11.5px var(--font); color: var(--label); background: var(--fill-2); border: 0; border-radius: 6px; padding: 3px 7px; }
.fp-list { display: flex; flex-direction: column; gap: 10px; max-height: 330px; overflow-y: auto; }
.fp-row { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fp-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.fp-head b { font-size: 11px; font-weight: 600; color: var(--label); white-space: nowrap; }
.fp-head span:not(.space) { font-size: 11px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-head i { font-style: normal; font-size: 10px; color: var(--label-3); white-space: nowrap; }
.fp-head .space, .fp-bar .space { flex: 1; }
.fp-star, .fp-more { font-size: 13px; line-height: 1; color: var(--label-2); }
.fp-star.on { color: #ffcc00; }
.fp-sample { color: var(--label); line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
/* 加密打包 */
.en-body, .en-form { display: flex; flex-direction: column; gap: 10px; }
.en-input { width: 100%; max-width: 230px; box-sizing: border-box; }
.en-ext { font-style: normal; font-size: 11px; color: var(--label-2); }
.en-hint { min-height: 14px; font-size: 11px; color: var(--label-2); }
.en-hint.bad { color: #ff453a; }
.en-hint.warn { color: #ff9f0a; }
/* 电池信息 */
.bt-head { display: flex; align-items: center; gap: 14px; }
.bt-ring { --p: 0; --c: var(--accent); position: relative; width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; }
.bt-ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--fill-2) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px)); mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px)); }
.bt-ring.charging { --c: #30d158; }
.bt-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bt-state { display: flex; align-items: baseline; gap: 5px; font-size: 13px; color: var(--label); }
.bt-state span:not(.bt-bolt) { font-size: 12px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.bt-bolt { color: #30d158; font-size: 12px; }
.bt-remaining { font-size: 11px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.bt-devices { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--sep); }
.bt-devices-title { font-size: 11px; color: var(--label-2); }
.bt-device { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--label); }
.bt-device svg { width: 18px; height: 18px; flex: none; color: var(--label-2); }
.bt-device-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bt-device b { font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bt-device b.warn { color: #ff9f0a; }
/* 录音的小条 */
.vr-bar { position: absolute; z-index: 26; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: 999px;
  background: rgba(0, 0, 0, .82); color: #fff; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .28); white-space: nowrap; max-width: calc(100% - 16px); }
.vr-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; flex: none; }
.vr-bar.recording .dot { background: #ff453a; animation: blink 1s steps(2, start) infinite; }
.vr-time { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; }
.vr-bars { display: flex; align-items: center; gap: 2px; height: 18px; }
.vr-bars i { width: 2px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .35); }
.vr-bar.recording .vr-bars i { background: rgba(255, 255, 255, .85); }
.vr-btn { width: 26px; height: 22px; border: 0; border-radius: 6px; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; cursor: pointer; }
.vr-btn:hover { background: rgba(255, 255, 255, .24); }
.vr-pause { width: 8px; height: 10px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
.vr-resume { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .82), inset 0 0 0 5px currentColor; }
.vr-stop { width: 9px; height: 9px; border-radius: 1.5px; background: currentColor; }
.vr-check { width: 16px; height: 16px; border-radius: 50%; background: #30d158; color: #000; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.vr-file { display: flex; flex-direction: column; gap: 1px; min-width: 0; max-width: 230px; }
.vr-file b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.vr-file span { font-size: 11px; color: rgba(255, 255, 255, .7); overflow: hidden; text-overflow: ellipsis; }
.vr-bar .mbtn { background: rgba(255, 255, 255, .16); color: #fff; border-color: transparent; }
.vr-close { border: 0; background: none; color: rgba(255, 255, 255, .7); font-size: 16px; line-height: 1; width: 20px; height: 20px; cursor: pointer; padding: 0; }
@media (max-width: 520px) { .vr-bar.saved { white-space: normal; flex-wrap: wrap; border-radius: 14px; } .vr-file { max-width: none; flex: 1 1 calc(100% - 26px); } }
/* 系统信息 */
.si-head { display: flex; align-items: center; gap: 12px; }
.si-head svg { width: 40px; height: 40px; flex: none; color: var(--label-2); stroke-width: 1.3; }
.si-head div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.si-head b { font-size: 14px; font-weight: 600; color: var(--label); }
.si-head span { font-size: 11px; color: var(--label-2); }
.si-serial-row { display: flex; align-items: baseline; gap: 6px; }
.si-serial { font: 400 12px/1.3 var(--mono); letter-spacing: .02em; }
/* 声音设备 */
.sd-sec-title { font-size: 11px; color: var(--label-2); }
.sd-list { display: flex; flex-direction: column; gap: 1px; margin-top: -4px; }
.sd-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 6px; border: 0; border-radius: 6px; background: none; color: var(--label);
  font: inherit; text-align: left; cursor: pointer; }
.sd-row:hover { background: var(--fill-2); }
.sd-row svg { width: 18px; height: 18px; flex: none; color: var(--label-2); }
.sd-row.on svg { color: var(--accent); }
.sd-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sd-name b { font-weight: 400; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sd-name span { font-size: 10.5px; color: var(--label-2); }
.sd-check { color: var(--accent); font-size: 12px; font-weight: 700; }
.sd-volume { display: flex; align-items: center; gap: 8px; padding: 0 6px; }
.sd-volume button, .sd-mic { width: 20px; height: 20px; flex: none; padding: 0; border: 0; background: none; color: var(--label-2); cursor: pointer; display: grid; place-items: center; }
.sd-mic { cursor: default; }
.sd-volume svg { width: 17px; height: 17px; }
.sd-volume input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.sd-volume.muted input { opacity: .5; }
/* 表情和符号 */
.es-top { display: flex; gap: 8px; align-items: center; }
.card .seg[hidden], .es-cats[hidden] { display: none; }
.es-top input { flex: 1; min-width: 0; }
.es-tone { flex: none; font-size: 15px; line-height: 1; padding: 3px 6px; border: 0; border-radius: 6px; background: var(--fill-2); cursor: pointer; }
.es-tone:hover { background: var(--fill); }
.es-cats { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 2px; }
.es-cats button { appearance: none; border: 0; border-radius: 6px; background: none; color: var(--label); font: 14px/26px var(--font); height: 26px; padding: 0; cursor: pointer; }
.es-cats button.emoji { font-size: 16px; }
.es-cats button:hover { background: var(--fill-2); }
.es-cats button[aria-pressed="true"] { background: var(--accent-soft); }
.es-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); grid-auto-rows: 38px; gap: 2px; height: 200px; overflow-y: auto; align-content: start; overscroll-behavior: contain; }
.es-grid button { appearance: none; border: 0; border-radius: 7px; background: none; color: var(--label); height: 38px; min-width: 0; padding: 0; font: 19px/1 var(--font); cursor: pointer; display: grid; place-items: center; overflow: hidden; }
.es-grid button.emoji { font-size: 23px; }
.es-grid button:hover { background: var(--fill-2); }
.es-grid button.sel { background: var(--accent-soft); }
.es-empty { grid-column: 1 / -1; padding: 40px 8px; text-align: center; font-size: 12px; color: var(--label-2); }
.es-foot { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.es-foot .big { flex: none; width: 40px; text-align: center; font-size: 26px; line-height: 1; }
.es-foot .names { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.es-foot .names b { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.es-foot .names span { font-size: 10px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.es-foot .hint { flex: none; font-size: 10px; color: var(--label-3); }
@media (max-width: 480px) { .es-foot .hint { display: none; } }
/* 白噪音 */
.fs-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.fs-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 62px; padding: 8px 2px; border: 1px solid transparent; border-radius: 8px;
  background: var(--fill-2); color: var(--label); font: 11px/1.2 var(--font); text-align: center; cursor: pointer; }
.fs-tile:hover { background: var(--fill); }
.fs-tile svg { width: 20px; height: 20px; flex: none; }
.fs-tile.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.fs-tile.playing svg { animation: fs-pulse 1.6s ease-in-out infinite; }
@keyframes fs-pulse { 50% { opacity: .4; transform: scale(.88); } }
@media (prefers-reduced-motion: reduce) { .fs-tile.playing svg { animation: none; } }
.fs-detail { font-size: 11.5px; color: var(--label-2); }
.fs-volume { display: flex; align-items: center; gap: 8px; color: var(--label-2); }
.fs-volume svg { width: 16px; height: 16px; flex: none; }
.fs-volume input { flex: 1; min-width: 0; accent-color: var(--accent); }
.fs-hint { font-size: 10.5px; color: var(--label-3); }
.fs-error { font-size: 11px; color: #ff9f0a; }
.fs-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fs-foot label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.fs-foot .space { flex: 1; }
.fs-left { font-size: 11px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.menubar .fs-status { appearance: none; border: 0; padding: 2px; margin: -2px; border-radius: 4px; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; }
.menubar .fs-status.paused { opacity: .45; }
.menubar .fs-status:hover, .menubar .fs-status[aria-expanded="true"] { background: var(--fill); }
.fs-menu .fs-menu-title { padding: 5px 10px 5px 24px; color: var(--label-2); font-size: 12px; white-space: nowrap; }
/* 蓝牙设备 */
.bt-row { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 6px; }
.bt-row:hover { background: var(--fill-2); }
.bt-row > svg { width: 19px; height: 19px; flex: none; color: var(--label-2); }
.bt-row.on > svg { color: var(--accent); }
.bt-row .sd-name b { font-size: 12.5px; }
.bt-row .mbtn { flex: none; min-width: 52px; }
.bt-spin { flex: none; width: 52px; display: grid; place-items: center; }
.bt-spin i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fill); border-top-color: var(--label-2); animation: bt-spin .8s linear infinite; }
@keyframes bt-spin { to { transform: rotate(360deg); } }
.bt-note { font-size: 11px; color: #ff9f0a; }
/* 休息提醒 */
.brk-switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.brk-toggle { appearance: none; border: 0; width: 34px; height: 20px; border-radius: 10px; background: var(--fill); position: relative; cursor: pointer; flex: none; transition: background .2s; }
.brk-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .28); transition: transform .2s; }
.brk-toggle[aria-checked="true"] { background: var(--accent); }
.brk-toggle[aria-checked="true"]::after { transform: translateX(14px); }
.brk-status { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--label-2); }
.brk-status svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.brk-status.on { color: var(--label); }
.brk-status.on svg { color: var(--accent); }
.brk-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.brk-row span { min-width: 34px; }
.brk-row select { font: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--field-stroke); background: var(--field); color: var(--label); }
.brk-check { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.brk-note { font-size: 11px; color: var(--label-2); }
.brk-banner { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100% - 32px)); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 40; font-size: 12.5px; color: var(--label); animation: brkIn .35s ease; }
@keyframes brkIn { from { opacity: 0; transform: translate(-50%, -10px); } }
.brk-banner .head { display: flex; gap: 12px; align-items: center; }
.brk-banner .head > svg { width: 26px; height: 26px; flex: none; color: var(--accent); }

.brk-banner .text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.brk-banner b { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.brk-banner .sub { color: var(--label-2); }
.brk-banner .btns { justify-content: flex-end; }
.brk-ring { width: 28px; height: 28px; flex: none; transform: rotate(-90deg); }
.brk-ring circle { fill: none; stroke-width: 3; }
.brk-ring .track { stroke: var(--fill); }
.brk-ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
.brk-overlay { position: absolute; inset: 0; z-index: 60; background: rgba(0, 0, 0, .6); display: grid; place-items: center; color: #fff; text-align: center; animation: fxIn .5s ease; }
.brk-overlay > div { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
.brk-overlay svg { width: 48px; height: 48px; }
.brk-overlay .title { font-size: 24px; font-weight: 600; }
.brk-overlay .big { font-size: clamp(44px, 9vw, 64px); font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.brk-overlay .tip { font-size: 15px; opacity: .75; }
.brk-overlay button { appearance: none; border: 0; background: rgba(255, 255, 255, .18); color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 7px 22px; border-radius: 999px; cursor: pointer; }
.brk-overlay button:hover { background: rgba(255, 255, 255, .26); }
.brk-overlay .hint { font-size: 11px; opacity: .65; }
/* 万年历 */
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.cal-title b { font-size: 15px; font-weight: 650; line-height: 1.25; }
.cal-title span { font-size: 10.5px; color: var(--label-2); }
.cal-head .mbtn { padding: 4px 7px; }
.cal-head .mbtn svg { width: 12px; height: 12px; display: block; stroke-width: 2.4; }
.cal-head .mbtn:disabled { opacity: .45; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }

.cal-cell { appearance: none; border: 1px solid transparent; background: none; border-radius: 7px; padding: 2px 0 3px; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; color: var(--label); }
.cal-cell:hover { background: var(--hover); }

.cal-cell .t { font-size: 9px; line-height: 12px; min-height: 12px; color: var(--label-2); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }

.cal-cell.out { opacity: .35; }
.cal-cell.today .n { background: var(--accent); color: #fff; font-weight: 700; }
.cal-cell.sel { background: var(--accent-soft); border-color: var(--accent); }
.cal-cell .t.festival { color: var(--rec); }
.cal-cell .t.term { color: var(--cal-term); }
.cal-cell .t.month { color: var(--accent); }
.cal-detail { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--sep); font-size: 11.5px; }
.cal-detail .top { display: flex; align-items: baseline; gap: 8px; }

.cal-detail .top span { margin-left: auto; font-size: 11px; color: var(--label-2); white-space: nowrap; }
.cal-detail .top span.today { color: var(--accent); }
.cal-detail .ev { color: var(--rec); font-weight: 600; }
.cal-detail .muted { color: var(--label-2); }
.cal-note { font-size: 11px; color: var(--label-2); }
.cal-foot { display: flex; align-items: center; gap: 8px; }
.cal-foot label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; white-space: nowrap; }
.cal-foot .hint { flex: 1; min-width: 0; font-size: 10px; color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
@media (max-width: 480px) { .cal-foot .hint { visibility: hidden; } }
/* PDF 加页码 */
.pn-body { display: flex; gap: 14px; align-items: flex-start; }
.pn-page { position: relative; flex: none; width: 108px; height: 140px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .14), 0 1px 4px rgba(0, 0, 0, .14); overflow: hidden; }
.pn-page i { position: absolute; left: 14px; right: 14px; height: 4px; border-radius: 2px; background: #d9dbe3; }
.pn-num { position: absolute; font: 400 6.5px/1 var(--font); color: #444; white-space: nowrap; }
.pn-num.bottomCenter { bottom: 7px; left: 50%; transform: translateX(-50%); }
.pn-num.bottomRight { bottom: 7px; right: 8px; }
.pn-num.topRight { top: 7px; right: 8px; }
.pn-form { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 12px; }
.pn-form > span { color: var(--label-2); font-size: 11px; justify-self: end; }
.pn-step { display: flex; align-items: center; gap: 6px; }
.pn-step input { width: 52px; font: inherit; font-variant-numeric: tabular-nums; padding: 2px 5px; border-radius: 5px; border: 1px solid var(--field-stroke); background: var(--field); color: var(--label); }
.pn-summary { font-size: 11px; color: var(--label-2); }
/* PDF 识别文字 */
.ocr-progress { width: 100%; height: 6px; accent-color: var(--accent); }
.ocr-status { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ocr-note { font-size: 11px; color: var(--label-2); line-height: 1.45; }
/* 磁盘测速 */
.ds-top { display: flex; align-items: center; gap: 8px; }
.ds-top .seg { margin-left: auto; }
.ds-info { font-size: 11px; color: var(--label-2); }
.ds-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ds-tile { padding: 10px; border-radius: 8px; background: var(--fill-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ds-tile.on { background: var(--fill); }
.ds-tile span { font-size: 11px; color: var(--label-2); display: flex; align-items: center; gap: 4px; }
.ds-tile.on span { color: var(--accent); }
.ds-tile span svg { width: 12px; height: 12px; }
.ds-tile b { font: 600 26px/1.15 ui-rounded, var(--font); font-variant-numeric: tabular-nums; }
.ds-tile b i { font: 400 11px var(--font); color: var(--label-2); margin-left: 4px; font-style: normal; }
.ds-progress { width: 100%; height: 6px; accent-color: var(--accent); }
.ds-progress[hidden] { display: none; }
.ds-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ds-foot > span { flex: 1; min-width: 150px; font-size: 11px; color: var(--label-2); }
/* 时区换算 */
.wt-note { font-size: 11.5px; color: var(--label-2); }
.wt-list { display: flex; flex-direction: column; gap: 2px; }
.wt-row { display: grid; grid-template-columns: minmax(0, 124px) minmax(40px, 1fr) minmax(0, 104px); align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-radius: 8px; background: var(--fill-2); }
.wt-row:hover { background: var(--fill); }
.wt-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.wt-name b { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; min-width: 0; }
.wt-name b > em { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
.wt-name > span { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--label-2); white-space: nowrap; min-width: 0; }
.wt-name > span > i { font-style: normal; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wt-tag { flex: none; font-size: 9px; font-weight: 600; padding: 0 4px; border-radius: 6px; border: 0.8px solid currentColor; color: var(--label-2); line-height: 13px; }
.wt-icon { flex: none; width: 15px; height: 15px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--label-2); cursor: pointer; display: none; place-items: center; }
.wt-icon svg { width: 14px; height: 14px; }
.wt-icon.add { display: grid; color: var(--accent); }
.wt-row:hover .wt-icon, .wt-icon:focus-visible { display: grid; }
.wt-bar { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(to right, rgba(94, 92, 230, .32) 0 29.1667%, rgba(255, 159, 10, .32) 29.1667% 37.5%, rgba(48, 209, 88, .55) 37.5% 75%, rgba(255, 159, 10, .32) 75% 91.6667%, rgba(94, 92, 230, .32) 91.6667% 100%); }
.wt-bar i { position: absolute; top: -4px; width: 2.5px; height: 16px; border-radius: 1px; background: var(--label); }
.wt-time { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; min-width: 0; }
.wt-time b { font: 500 17px/1.1 var(--font); font-variant-numeric: tabular-nums; }
.wt-time span { display: flex; gap: 3px; font-size: 10px; color: var(--label-2); white-space: nowrap; }
.wt-time span em { font-style: normal; font-weight: 600; color: #ff9f0a; }
.wt-time span em.back { color: var(--accent); }
.wt-slide { display: flex; align-items: center; gap: 8px; }
.wt-slide svg { width: 15px; height: 15px; flex: none; color: var(--label-2); }
.wt-slide input { flex: 1; min-width: 0; accent-color: var(--accent); }
.wt-slide span { width: 92px; flex: none; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--label-2); }
.wt-slide span.on { color: var(--label); }
.wt-overlap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label-2); }
.wt-overlap > span { flex: 1; min-width: 0; }
.wt-overlap svg { width: 14px; height: 14px; flex: none; }
.wt-search { display: flex; flex-direction: column; gap: 2px; }
.wt-search input { width: 100%; font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--field-stroke); background: var(--field); color: var(--label); }
.wt-result { display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; padding: 0 6px; border: 0; border-radius: 6px; background: none; color: var(--label); font: inherit; font-size: 12.5px; cursor: pointer; text-align: left; }
.wt-result:hover { background: var(--fill-2); }
.wt-result svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
.wt-result span { font-size: 11px; color: var(--label-2); }
.wt-result b { margin-left: auto; font-weight: 400; color: var(--label-2); font-variant-numeric: tabular-nums; }
.wt-none { font-size: 11px; color: var(--label-2); padding: 2px 6px; }
.wt-grow { flex: 1; }
/* 选中表格的场景、生成图表 */
.note-table { border-collapse: collapse; margin: 2px 0 12px; font-size: 13px; line-height: 1.5; }
.note-table th, .note-table td { border: 1px solid var(--sep); padding: 2px 14px; text-align: right; font-variant-numeric: tabular-nums; }
.note-table th:first-child, .note-table td:first-child { text-align: left; }
.note-table th { font-weight: 600; }
.note-table.sel-table th, .note-table.sel-table td { background: var(--sel); }
.rows.pre .v { white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; }
.ch-title { width: 100%; font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--field-stroke); background: var(--field); color: var(--label); }
.ch-canvas { width: 100%; height: auto; aspect-ratio: 428 / 230; max-width: 100%; display: block; }
.ch-canvas text { font: 9.5px var(--font); fill: var(--label-2); }
.ch-canvas text.val { font-size: 9px; }
.ch-canvas text.pct { fill: #fff; font-weight: 700; }
.ch-canvas .axis { stroke: var(--label-3); }
.ch-canvas .grid { stroke: var(--sep); stroke-dasharray: 2 3; }
.ch-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--label-2); }
.ch-legend[hidden] { display: none; }
.ch-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.ch-seg { align-self: stretch; }
.ch-seg button { flex: 1; min-width: 0; }
.ch-opts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px; }
.ch-opts label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.wt-search[hidden], .wt-overlap[hidden] { display: none; }
/* 分辨率 */
.rs-seg { align-self: stretch; }
.rs-seg button { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.rs-title { font-size: 11px; color: var(--label-2); }
.rs-list { display: flex; flex-direction: column; margin-top: -4px; max-height: 228px; overflow-y: auto; }
.rs-row { display: flex; align-items: center; gap: 8px; flex: none; width: 100%; height: 24px; padding: 0 6px; border: 0; border-radius: 6px; background: none;
  color: var(--label); font: inherit; text-align: left; cursor: pointer; }
.rs-row:hover { background: var(--fill-2); }
.rs-row b { font-weight: 400; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.rs-row i { font-style: normal; font-size: 10.5px; color: var(--label-2); }
.rs-row i.warn { color: #ff9f0a; }
.rs-row .sd-check { margin-left: auto; }
.rs-rate { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.rs-main { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label-2); }
.rs-main svg { width: 14px; height: 14px; flex: none; }
.rs-main-btn { align-self: flex-start; }
.rs-pending { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: rgba(255, 159, 10, .14); font-size: 12px; }
.rs-pending svg { width: 16px; height: 16px; color: #ff9f0a; flex: none; }
.rs-pending span { flex: 1; min-width: 120px; font-variant-numeric: tabular-nums; }
.rs-seg[hidden], .rs-rate[hidden], .rs-done[hidden] { display: none; }
/* 新建文件 */
.nf-where { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label-2); }
.nf-where svg { width: 14px; height: 14px; }
.nf-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.nf-chip { appearance: none; border: 0; border-radius: 7px; padding: 5px 4px; background: var(--fill-2); color: var(--label); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; font: 500 11.5px/1.2 var(--font); }
.nf-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nf-chip small { font-size: 9.5px; opacity: .7; }
.nf-chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
.nf-preview { margin: 0; padding: 8px; border-radius: 6px; background: var(--fill-2); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--label); white-space: pre-wrap; max-height: 64px; overflow: hidden; }
.nf-name { font: 12px var(--font); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line, rgba(127, 127, 127, .3)); background: var(--field, transparent); color: var(--label); min-width: 0; }
/* 文件编码 */
.fe-list { max-height: 230px; }
.fe-row { height: 44px; gap: 8px; }
.fe-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.fe-bad { color: #ff453a !important; }
.fe-meta { font-size: 10.5px; color: var(--label-2); flex: none; }
.fe-select { flex: none; max-width: 132px; font: 11px var(--font); color: var(--label); background: var(--fill-2); border: 0; border-radius: 6px; padding: 3px 4px; }
.qa-ask { flex: 1; min-width: 0; font-size: 12.5px; }
/* 整理文件夹：每个子文件夹一行 */
.td-body { display: flex; flex-direction: column; gap: 10px; }
.td-list { display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; }
.td-row { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--fill-1, rgba(127, 127, 127, .06)); font-size: 12.5px; }
.td-icon { width: 16px; height: 16px; flex: none; color: var(--label-2); }
.td-icon svg { width: 16px; height: 16px; display: block; }
.td-name { flex: 1; min-width: 0; }
.td-count { color: var(--label-2); font-variant-numeric: tabular-nums; }
.td-done { font-size: 13px; padding: 4px 0; }
.bt-checks input { margin: 0; accent-color: var(--accent); }
/* 屏幕放大：盖住桌面，在聚光灯、卡片、显示按键、摄像头小窗和指针光圈下面 */
.zoomer { position: absolute; inset: 0; z-index: 14; overflow: hidden; background: #000; touch-action: none; }
.zoomer .zoom-shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.win .content.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.scroll-frame { position: absolute; border: 2px dashed var(--accent); border-radius: 2px; z-index: 25; pointer-events: none; }
.scroll-panel { position: absolute; z-index: 26; width: min(400px, calc(100% - 16px)); border-radius: 12px; padding: 7px 8px 7px 12px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.scroll-panel .row { display: flex; align-items: center; gap: 8px; }
.scroll-panel .row svg { width: 15px; height: 15px; flex: none; }
.scroll-panel .st { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.scroll-panel .hint { font-size: 11px; color: var(--label-2); }
.scroll-panel .hint.warn { color: #ff9f0a; }
.shot-box { height: 260px; overflow: auto; overscroll-behavior: contain; border-radius: 8px; background: var(--fill-2); }
.shot-box .sizer { position: relative; overflow: hidden; }
.shot-box .shot { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; pointer-events: none; }
.rec-panel .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.click-dot { position: absolute; width: 36px; height: 36px; margin: -18px; border-radius: 50%; border: 2px solid rgba(255, 204, 0, .95); background: rgba(255, 204, 0, .25); animation: ripple .5s ease-out forwards; z-index: 27; }
@keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.1); opacity: 0; } }
.loupe { position: absolute; width: 84px; height: 84px; margin: -42px; border-radius: 50%; z-index: 31; box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgba(0, 0, 0, .25), 0 8px 22px rgba(0, 0, 0, .35); }
.loupe::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
.loupe .hex { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); font: 11px/1 var(--mono); color: #fff; background: rgba(0, 0, 0, .7); padding: 4px 7px; border-radius: 5px; white-space: nowrap; }

.fx { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; cursor: pointer; animation: fxIn .5s ease; }
.fx.out { animation: fxOut .45s ease forwards; }
@keyframes fxIn { from { opacity: 0; } }
@keyframes fxOut { to { opacity: 0; } }
.fx.black { background: #000; }
.fx.lock { background: rgba(10, 12, 30, .28); -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%); color: #fff; text-align: center; }
.fx.lock .time { font-size: clamp(56px, 11vw, 96px); font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.fx.lock .date { font-size: 17px; font-weight: 500; margin-bottom: 8px; }
.fx.lock .tap { font-size: 12.5px; opacity: .8; margin-top: 26px; }

.pbox { background: var(--prefs-box); border-radius: 10px; box-shadow: 0 0 0 .5px var(--sep); overflow: hidden; }

.prefs .pfoot { font-size: 11px; color: var(--win-text-2); margin: 14px 4px 0; line-height: 1.45; }
.palert-dim { position: absolute; inset: 0; z-index: 3; background: rgba(0, 0, 0, .16); display: grid; place-items: start center; padding-top: 72px; animation: fadeIn .15s ease-out; }

function icon(name, attrs) {
  const el = s('svg', Object.assign({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.7', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }, attrs || {}));
  el.innerHTML = ICONS[name] || '';
  return el;
}

// 顶上的图标：一圈 8 格，最上面那格最亮
(() => {
  const ring = $('#logo-ring');
  for (let i = 0; i < 8; i++) {
    const a0 = (-90 - 22.5 + i * 45 + 3) * Math.PI / 180;
    const a1 = (-90 + 22.5 + i * 45 - 3) * Math.PI / 180;
    const r0 = 10, r1 = 22;
    const p = (r, a) => `${32 + r * Math.cos(a)} ${32 + r * Math.sin(a)}`;
    ring.append(s('path', { d: `M${p(r0, a0)} L${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)}Z`, opacity: i === 0 ? '1' : '.42' }));
  }
})();

  airDrop: { icon: 'airDrop', accepts: ['text', 'files'], keys: 'gekongtousong gkts airdrop', name: { zh: '隔空投送', en: 'AirDrop' }, summary: { zh: '用隔空投送把选中的文件、图片、链接或文字发到附近的 iPhone、iPad 或 Mac', en: 'Send the selected files, images, links or text to a nearby iPhone, iPad or Mac with AirDrop' } },
  sendToPhone: { icon: 'sendToPhone', accepts: [], keys: 'chuandaoshouji cdsj', name: { zh: '传到手机', en: 'Send to Phone' }, summary: { zh: '手机扫码下载选中的文件、图片（文件夹先打包成 zip）或者拿到选中的文字，也能从手机传文件到「下载」文件夹；手机和 Mac 连同一个 Wi-Fi 就行，安卓手机也能用', en: 'Scan a QR code with your phone to download the selected files or images (folders are zipped first) or get the selected text, and upload files from the phone to Downloads. The phone and Mac just need to be on the same Wi-Fi; Android works too.' } },

const easeIn = (p) => p * p;
const easeOut = (p) => 1 - (1 - p) * (1 - p);

const running = new Set();
const dirty = new Set();
let frame = 0;
let lastTime = 0;

// 一个会动的数：弹簧（和 SwiftUI 的 spring(response:dampingFraction:) 一样）或者定时的缓动
class Anim {
  constructor(value, owner) { this.value = value; this.target = value; this.velocity = 0; this.owner = owner; this.kind = null; }
  spring(target, [response, damping], delay = 0) {
    this.kind = 'spring'; this.target = target; this.delay = delay;
    this.k = (2 * Math.PI / response) ** 2; this.c = 4 * Math.PI * damping / response;
    this.eps = Math.max(Math.abs(target - this.value) * 0.0008, 0.0004);
    start(this);
    return this;
  }
  tween(target, duration, ease = easeOut, delay = 0) {
    this.kind = 'tween'; this.from = this.value; this.target = target; this.duration = Math.max(duration, 0.001); this.elapsed = 0; this.ease = ease; this.delay = delay; this.velocity = 0;
    start(this);
    return this;
  }
  set(value) { this.value = value; this.target = value; this.velocity = 0; this.kind = null; running.delete(this); if (this.owner) dirty.add(this.owner); return this; }
  step(dt) {
    if (this.delay > 0) { this.delay -= dt; if (this.delay > 0) return true; dt = -this.delay; this.delay = 0; }
    if (this.kind === 'tween') {
      this.elapsed += dt;
      const p = Math.min(this.elapsed / this.duration, 1);
      this.value = this.from + (this.target - this.from) * this.ease(p);
      return p < 1;
    }
    let left = dt;
    while (left > 0) {
      const step = Math.min(left, 1 / 600);
      const acceleration = -this.k * (this.value - this.target) - this.c * this.velocity;
      this.velocity += acceleration * step;
      this.value += this.velocity * step;
      left -= step;
    }
    if (Math.abs(this.value - this.target) < this.eps && Math.abs(this.velocity) < this.eps * 12) {
      this.value = this.target; this.velocity = 0;
      return false;
    }
    return true;
  }
}

function start(anim) {
  running.add(anim);
  if (anim.owner) dirty.add(anim.owner);
  if (!frame) { lastTime = performance.now(); frame = requestAnimationFrame(tick); }
}

function tick(now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 20);
  lastTime = now;
  for (const anim of [...running]) {
    if (!anim.step(dt)) running.delete(anim);
    if (anim.owner) dirty.add(anim.owner);
  }
  for (const owner of dirty) owner.render();
  dirty.clear();
  frame = running.size ? requestAnimationFrame(tick) : 0;
}

  dark: { base: '#10122a', blobs: [[0.12, 0.18, 0.75, '#2b3a9c'], [0.88, 0.12, 0.62, '#6a2a72'], [0.72, 0.95, 0.72, '#0e5a61'], [0.18, 0.96, 0.6, '#3c2a88'], [0.52, 0.45, 0.35, '#1b1f4a']] },
};

function drawWall() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const width = stage.clientWidth, height = stage.clientHeight;
  wall.width = Math.round(width * ratio); wall.height = Math.round(height * ratio);
  const ctx = wall.getContext('2d', { willReadFrequently: true });
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  const theme = WALLS[isDark() ? 'dark' : 'light'];
  ctx.fillStyle = theme.base;
  ctx.fillRect(0, 0, width, height);
  const size = Math.max(width, height);
  for (const [x, y, r, color] of theme.blobs) {
    const gradient = ctx.createRadialGradient(x * width, y * height, 0, x * width, y * height, r * size);
    gradient.addColorStop(0, color);
    gradient.addColorStop(1, color + '00');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
  }
}

function wallColorAt(x, y) {
  const ratio = wall.width / Math.max(stage.clientWidth, 1);
  const px = clamp(Math.round(x * ratio), 0, wall.width - 1), py = clamp(Math.round(y * ratio), 0, wall.height - 1);
  const data = wall.getContext('2d', { willReadFrequently: true }).getImageData(px, py, 1, 1).data;
  return [data[0], data[1], data[2]];
}

function currentContent() {
  switch (state.scene) {
    case 'foreign': {
      const text = ARTICLE[lang].selected;
      const kinds = ['text', 'foreign'];
      if (/[A-Za-z]/.test(text)) kinds.push('latin');
      return { kinds, text, summary: L(T.chars(text.length)) };
    }
    case 'link':
      return { kinds: ['text', 'url', 'latin'], text: LINK.url, summary: L(T.linkKind) };
    case 'table': {
      const text = tableText();
      return { kinds: ['text', 'table'], text, summary: L(T.chars(text.length)) };
    }
    case 'files': {
      const files = selectedFiles();
      const file = files[0];
      if (files.length === 1) return { kinds: ['files', file.kind].concat(file.subtitle ? ['subtitle'] : []), file, files, summary: L(file.name) };
      const kinds = ['files'];
      if (files.length === 2 && files.every((f) => f.subtitle)) kinds.push('subtitle');
      if (files.length === 2 && files.every((f) => f.kind === 'textFile')) kinds.push('twoTextFiles');
      if (files.length === 2 && files.every((f) => f.kind === 'imageFile')) kinds.push('twoImageFiles');
      if (files.every((f) => f.kind === 'imageFile')) kinds.push('imageFile');
      if (files.every((f) => f.kind === 'textFile')) kinds.push('textFile');
      return { kinds, file, files, summary: L({ zh: `${files.length} 个文件`, en: `${files.length} files` }) };
    }
    default:
      return { kinds: [], summary: L(T.nothing) };
  }
}
